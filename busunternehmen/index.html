<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bus-Imperium</title>
<style>
:root{
  color-scheme:dark;
  --bg:#0f1720;--panel:#16212e;--panel2:#1c2a3a;--line:#2a3b50;--text:#e8eef5;--mute:#8da2b8;
  --acc:#ffc233;--good:#3ddc97;--bad:#ff6b6b;--blue:#4da3ff;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
header{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:16px;margin:0;color:var(--acc);letter-spacing:.3px;white-space:nowrap}
.stat{display:flex;flex-direction:column;line-height:1.15}
.stat small{color:var(--mute);font-size:10.5px;text-transform:uppercase;letter-spacing:.5px}
.stat b{font-size:15px;font-variant-numeric:tabular-nums}
.sp{flex:1}
.speed{display:flex;gap:3px}
.speed button,.btn{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:5px 10px}
.speed button.on{background:var(--acc);color:#222;border-color:var(--acc);font-weight:700}
.btn:hover:not(:disabled){border-color:var(--acc)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.pri{background:var(--acc);color:#1c1c1c;border-color:var(--acc);font-weight:700}
.btn.danger{border-color:#6b3040;color:#ffb3b3}
.btn.sm{padding:3px 8px;font-size:12px}
main{flex:1;display:grid;grid-template-columns:1fr 440px;min-height:0}
#mapcol{display:flex;flex-direction:column;min-height:0;min-width:0}
#mapwrap{flex:1;position:relative;min-height:0;background:radial-gradient(circle at 50% 40%,#1b2a3d,#0e1620)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#tip{position:absolute;pointer-events:none;background:#0b121bee;border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:12px;display:none;z-index:5;max-width:240px}
#hint{position:absolute;left:10px;top:10px;background:#0b121bdd;border:1px solid var(--acc);color:var(--acc);padding:6px 10px;border-radius:8px;display:none;font-weight:600;z-index:4}
#log{height:76px;overflow:hidden;background:var(--panel);border-top:1px solid var(--line);padding:6px 12px;font-size:12px;color:var(--mute);display:flex;flex-direction:column-reverse}
#log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#log div:first-child{color:var(--text)}
#side{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#tabs{display:flex;border-bottom:1px solid var(--line)}
#tabs button{flex:1;background:none;border:0;border-bottom:3px solid transparent;padding:10px 2px;color:var(--mute);font-size:13px}
#tabs button.on{color:var(--acc);border-bottom-color:var(--acc);font-weight:700}
#panel{flex:1;overflow:auto;padding:12px}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px}
.card.sel{border-color:var(--acc)}
.card h3{margin:0 0 6px;font-size:14px}
.row{display:flex;align-items:center;gap:8px;justify-content:space-between;margin:4px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.kpi small{color:var(--mute);display:block;font-size:11px}
.kpi b{font-size:17px;font-variant-numeric:tabular-nums}
.bar{height:7px;background:#0b121b;border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--good)}
.mute{color:var(--mute)} .good{color:var(--good)} .bad{color:var(--bad)} .acc{color:var(--acc)}
.small{font-size:12px}
.tag{font-size:11px;background:#0b121b;border-radius:5px;padding:1px 6px;color:var(--mute);white-space:nowrap}
h2.s{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--mute);margin:14px 0 6px}
input[type=range]{width:100%;accent-color:var(--acc)}
select{background:#0b121b;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:3px 5px;font:inherit;max-width:170px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td,th{padding:2px 0;text-align:left;font-weight:400}
td:last-child,th:last-child{text-align:right}
th{color:var(--mute);font-size:11px;text-transform:uppercase;letter-spacing:.4px}
tr.me td{color:var(--acc);font-weight:700}
hr{border:0;border-top:1px solid var(--line);margin:8px 0}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:6px 0}
.slot{aspect-ratio:1.5;border:1px dashed var(--line);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:18px;color:var(--mute)}
.slot small{font-size:10px;line-height:1.1;text-align:center}
.slot.on{border-style:solid;background:#0b121b;color:var(--text)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
#modalbg{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#modal{background:var(--panel);border:1px solid var(--acc);border-radius:14px;padding:20px;max-width:480px;width:100%;max-height:90vh;overflow:auto}
#modal h2{margin:0 0 8px;color:var(--acc)}
#modal .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
@media(max-width:860px){
  body{overflow:auto}
  main{grid-template-columns:1fr;grid-template-rows:60vh auto}
  #side{border-left:0;border-top:1px solid var(--line)}
  #panel{overflow:visible}
}
</style>
</head>
<body>
<header>
  <h1>🚌 Bus-Imperium</h1>
  <div class="stat"><small>Kasse</small><b id="hCash">–</b></div>
  <div class="stat"><small>Unternehmenswert</small><b id="hValue">–</b></div>
  <div class="stat"><small>Privatvermögen</small><b id="hWealth">–</b></div>
  <div class="stat"><small>Rang</small><b id="hRank">–</b></div>
  <div class="stat"><small>Ruf</small><b id="hRep">–</b></div>
  <div class="stat"><small>Diesel</small><b id="hFuel">–</b></div>
  <div class="stat"><small>Datum</small><b id="hDate">–</b></div>
  <div class="sp"></div>
  <div class="speed" id="speed">
    <button data-s="0" title="Pause (Leertaste)">⏸</button>
    <button data-s="1">1×</button>
    <button data-s="2">2×</button>
    <button data-s="5">5×</button>
  </div>
  <button class="btn" id="bHelp" title="Anleitung">?</button>
  <button class="btn" id="bNew" title="Neues Spiel">↺</button>
</header>
<main>
  <div id="mapcol">
    <div id="mapwrap">
      <canvas id="cv"></canvas>
      <div id="hint"></div>
      <div id="tip"></div>
    </div>
    <div id="log"></div>
  </div>
  <aside id="side">
    <div id="tabs">
      <button data-tab="ov">Übersicht</button>
      <button data-tab="lines">Linien</button>
      <button data-tab="fleet">Flotte</button>
      <button data-tab="sites">Gelände</button>
      <button data-tab="market">Markt</button>
      <button data-tab="firm">Firma</button>
    </div>
    <div id="panel"></div>
  </aside>
</main>
<div id="modalbg"><div id="modal"></div></div>

<script>
'use strict';
/* ===================== Daten ===================== */
const KEY='busimperium_v1';
const MAP={w:600,h:780,lon0:5.6,lon1:15.2,lat0:47.2,lat1:55.1};
const CITIES=[
 {id:'HAM',name:'Hamburg',lon:10.0,lat:53.55,pop:1850},
 {id:'BER',name:'Berlin',lon:13.4,lat:52.52,pop:3700},
 {id:'HAN',name:'Hannover',lon:9.73,lat:52.37,pop:540},
 {id:'BRE',name:'Bremen',lon:8.8,lat:53.08,pop:570},
 {id:'ROS',name:'Rostock',lon:12.14,lat:54.09,pop:210},
 {id:'DOR',name:'Dortmund',lon:7.47,lat:51.51,pop:590},
 {id:'KOE',name:'Köln',lon:6.96,lat:50.94,pop:1080},
 {id:'KAS',name:'Kassel',lon:9.5,lat:51.31,pop:200},
 {id:'LEI',name:'Leipzig',lon:12.37,lat:51.34,pop:600},
 {id:'DRE',name:'Dresden',lon:13.74,lat:51.05,pop:560},
 {id:'FRA',name:'Frankfurt',lon:8.68,lat:50.11,pop:770},
 {id:'NUE',name:'Nürnberg',lon:11.08,lat:49.45,pop:520},
 {id:'STU',name:'Stuttgart',lon:9.18,lat:48.78,pop:630},
 {id:'MUC',name:'München',lon:11.58,lat:48.14,pop:1500},
];
const START_CITIES=['HAN','HAM','LEI','FRA','KOE','MUC'];
const GERMANY=[[8.6,54.9],[9.9,54.8],[10.9,54.0],[12.4,54.4],[13.8,54.1],[14.3,53.0],[14.6,51.8],[15.0,51.0],[14.3,50.9],[12.2,50.3],[13.0,50.0],[13.8,48.8],[13.0,47.8],[12.9,47.5],[10.5,47.5],[9.6,47.5],[7.6,47.6],[7.6,48.9],[8.2,49.0],[6.4,49.5],[6.2,50.4],[6.0,51.0],[6.0,51.9],[7.0,52.2],[7.2,53.3],[8.2,53.5],[8.6,54.0]];
const TYPES={
 mini:{name:'Minibus',     seats:22,price:45000, speed:70,comfort:5, cons:.10,wear:.0025,color:'#4da3ff'},
 city:{name:'Stadtbus',    seats:50,price:85000, speed:55,comfort:4, cons:.28,wear:.0025,color:'#3ddc97'},
 coach:{name:'Reisebus',   seats:55,price:130000,speed:75,comfort:8, cons:.30,wear:.002,color:'#ffc233'},
 dd:{name:'Doppeldecker',  seats:80,price:190000,speed:60,comfort:6, cons:.38,wear:.0025,color:'#ff9f5a'},
 lux:{name:'Luxusliner',   seats:45,price:220000,speed:85,comfort:10,cons:.30,wear:.0015,color:'#d58cff'},
};
const BUILD={
 garage:{name:'Bushalle',icon:'🏠',short:'Halle',cost:30000,rent:40,max:99,desc:'+6 Busplätze.'},
 werkstatt:{name:'Werkstatt',icon:'🔧',short:'Werkstatt',cost:40000,rent:60,max:2,desc:'Reparaturen −35 %, 10 % weniger Pannen (je Werkstatt, max. 2).'},
 wash:{name:'Waschanlage',icon:'🚿',short:'Wäsche',cost:22000,rent:25,max:1,desc:'Saubere Busse: Ruf-Zielwert +4.'},
 tank:{name:'Eigene Tankstelle',icon:'⛽',short:'Tankst.',cost:55000,rent:50,max:2,desc:'Tanklager (20.000 l je Tankstelle), 8 % Rabatt auf Diesel, Vorratskauf bei niedrigen Preisen.'},
 leit:{name:'Leitstelle',icon:'📡',short:'Leitstelle',cost:60000,rent:70,max:1,desc:'Routenoptimierung: 6 % weniger Spritverbrauch, +4 % Nachfrage.'},
 kantine:{name:'Fahrerkantine',icon:'🍽',short:'Kantine',cost:25000,rent:30,max:1,desc:'Zufriedene Fahrer: Löhne −8 %.'},
 center:{name:'Kundencenter',icon:'🎫',short:'Center',cost:35000,rent:40,max:1,desc:'+6 % Nachfrage auf allen Linien.'},
};
const UPGRADES={
 schulung:{name:'Fahrerschulung',cost:25000,desc:'Weniger Verschleiß (−25 %) und 30 % weniger Pannen.'},
 app:{name:'Ticket-App',cost:35000,desc:'+10 % Nachfrage auf allen Linien.'},
 wlan:{name:'Bord-WLAN',cost:30000,desc:'+1 Komfort in allen Bussen.'},
 auto:{name:'Wartungsplanung',cost:45000,desc:'Busse unter 35 % Zustand fahren automatisch in die Werkstatt.'},
};
const RIVAL_DEFS=[
 {name:'Nordlicht Bus',home:'HAM',q:6,pf:.95},{name:'Hansa Reisen',home:'BRE',q:5,pf:1},
 {name:'Rheinland Mobil',home:'KOE',q:6,pf:1},{name:'RuhrLinie',home:'DOR',q:5,pf:1.08},
 {name:'Main-Express',home:'FRA',q:7,pf:.97},{name:'Schwaben Bus',home:'STU',q:6,pf:1},
 {name:'Isar Fernverkehr',home:'MUC',q:7,pf:.92},{name:'Elbe Tours',home:'DRE',q:5,pf:1.05},
 {name:'Spree-Shuttle',home:'BER',q:6,pf:1},{name:'Franken Reisen',home:'NUE',q:5,pf:1.08},
 {name:'EuroBus AG',home:null,nat:true,q:7,pf:.97,v:4e6},
 {name:'Fernflix',home:null,nat:true,fran:true,q:6,pf:.8,v:3e7},
];
const NEW_RIVAL_NAMES=['City-Mobil','Regio-Bus Süd','Land-Express','BlauBus','Küsten-Linie','Harz Shuttle','Pfalz Reisen','Odenwald Bus','Rhön Mobil'];
const SELLER_NAMES=['Gebr. Müller Reisen','Autobus Kaiser','Reisedienst Lindner','Busbetrieb Nord','Omnibus Hartmann','Stadtlinien Weber','Albtours Fischer','Bus & Reisen Krause','Landverkehr Brandt','Heidebus Jansen'];
const FR_RATES=[1.0,1.1,1.2,1.32,1.45];
const FR_LEVELS=[0,100,300,700,1500];
const MILESTONES=[250000,500000,1000000,2500000,5000000,10000000,25000000];
const RANKS=[[0,'Einzelkämpfer'],[200000,'Regionalverkehr'],[500000,'Verkehrsbetrieb'],[1000000,'Fernbus-Anbieter'],[2500000,'Branchenriese'],[5000000,'Mobilitätskonzern'],[15000000,'Bus-Imperator']];
const MONTHS=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
const DAY_REAL=10;
const SUBST=0.6; // Attraktivität von Auto/Bahn als Ersatz
const cityById=id=>CITIES.find(c=>c.id===id);

/* ===================== Hilfsfunktionen ===================== */
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const EUR=new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR',maximumFractionDigits:0});
const eur=n=>EUR.format(Math.round(n));
const eurK=n=>Math.abs(n)>=1e6?num(n/1e6,2)+' Mio. €':eur(n);
const num=(n,d=0)=>n.toLocaleString('de-DE',{maximumFractionDigits:d,minimumFractionDigits:d});
const pct=n=>num(n*100,0)+' %';
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
function hav(a,b){const R=6371,r=Math.PI/180;
  const dl=(b.lat-a.lat)*r,dn=(b.lon-a.lon)*r;
  const h=Math.sin(dl/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dn/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));}
function proj(c){return{x:(c.lon-MAP.lon0)/(MAP.lon1-MAP.lon0)*MAP.w,y:(MAP.lat1-c.lat)/(MAP.lat1-MAP.lat0)*MAP.h};}
CITIES.forEach(c=>Object.assign(c,proj(c)));
const licCost=c=>Math.round((6000+c.pop*7)/500)*500;
const siteCost=c=>Math.round((30000+c.pop*8)/500)*500;
const zero=()=>({inc:0,fuel:0,wage:0,ins:0,repair:0,depot:0,interest:0,other:0});
const COSTKEYS=['fuel','wage','ins','repair','depot','interest','other'];
const sumCosts=d=>COSTKEYS.reduce((s,k)=>s+d[k],0);
function nearest(id,k){const H=cityById(id);return CITIES.filter(c=>c.id!==id).sort((a,b)=>hav(H,a)-hav(H,b)).slice(0,k).map(c=>c.id);}

/* ===================== Spielstand ===================== */
let S;
const ui={tab:'ov',selLine:null,selSite:null,mode:null,first:null,hold:false,hover:null,modalOpen:false};
const nextId=()=>S.nid++;
function makeRivals(){
  return RIVAL_DEFS.map((d,i)=>({id:i+1,name:d.name,home:d.home,q:d.q,pf:d.pf,nat:!!d.nat,fran:!!d.fran,
    value:d.v||rnd(150000,800000)}));
}
function newBus(type){return{id:nextId(),type,line:null,cond:100,age:0,state:'depot',dir:0,t:0,load:0,waited:0,left:0,prev:'wait'};}
function freshCompany(home,name){
  const b=newBus('mini');
  return{name,hq:home,cash:150000,loan:0,rep:50,lic:[home,...nearest(home,2)],buses:[b],lines:[],up:{},
    sites:[{id:nextId(),city:home,hq:true,cost:0,b:[]}]};
}
function installCompany(c){
  Object.assign(S,c,{owned:true,fx:{},today:zero(),week:[],hist:[],negDays:0,lostToday:0,
    tank:{l:0,avg:0},litToday:0,litHist:[],fuelDeal:{bonus:0,bonusLeft:0,cool:0,lock:null},
    partner:{pts:0,offers:[],gen:-99},demT:-99,over:false});
  ui.selLine=null;ui.selSite=S.sites[0].id;ui.mode=null;ui.first=null;
}
function newState(){
  S={v:2,t:6,day:0,owned:true,wealth:0,speed:1,nid:1,log:[],ach:{},exits:[],market:[],rivals:makeRivals(),
    over:false,fuel:1.6,winter:false,totalPax:0,totalKm:0,fuelU:1.6};
  installCompany(freshCompany('HAN','Mein Busunternehmen'));
  return S;
}
function upgradeSave(s){
  if(s.v>=2)return s;
  S=s;
  s.v=2;s.name='Mein Busunternehmen';s.owned=true;s.wealth=0;s.hq=s.lic[0]||'HAN';
  const g=Math.ceil((s.depot||0)*4/6);
  s.sites=[{id:nextId(),city:s.hq,hq:true,cost:0,b:Array(g).fill('garage').concat(s.up.werkstatt?['werkstatt']:[])}];
  delete s.depot;delete s.up.werkstatt;
  s.fuelDeal={bonus:0,bonusLeft:0,cool:0,lock:null};s.tank={l:0,avg:0};s.litToday=0;s.litHist=[];
  s.rivals=makeRivals();s.partner={pts:0,offers:[],gen:-99};s.ach={};s.market=[];s.exits=[];s.fuelU=s.fuel;
  for(const L of s.lines){L.svc=0;L.fr=null;L.pd=0;L.ph=[];L.share=0;L.comps=genComps(L);L.rate=clamp(L.rate,0.04,0.30);}
  return s;
}
function load(){
  try{const raw=localStorage.getItem(KEY);if(raw){const s=JSON.parse(raw);if(s&&s.v&&!s.over)return upgradeSave(s);}}catch(e){}
  return null;
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function say(msg,cls){S.log.unshift({m:msg,c:cls||''});if(S.log.length>40)S.log.pop();renderLog();}

/* ===================== Modell ===================== */
const lineById=id=>S.lines.find(l=>l.id===id);
const busById=id=>S.buses.find(b=>b.id===id);
const lname=L=>cityById(L.a).name+' – '+cityById(L.b).name;
const bcount=k=>S.sites.reduce((n,s)=>n+s.b.filter(x=>x===k).length,0);
const cap=()=>4+6*bcount('garage');
const slotsOf=s=>s.hq?8:4;
const comfort=b=>TYPES[b.type].comfort+(S.up.wlan?1:0)-(b.cond<40?2:0);
const eligible=b=>TYPES[b.type].seats>=40&&comfort(b)>=6;
const wageDay=()=>150*(bcount('kantine')?0.92:1);
const fuelUse=()=>bcount('leit')?0.94:1;
const repairF=()=>Math.pow(0.65,Math.min(2,bcount('werkstatt')));
const breakF=()=>Math.pow(0.9,Math.min(2,bcount('werkstatt')));
function rentDay(){return 120+S.sites.reduce((s,x)=>s+(x.hq?0:60)+x.b.reduce((t,k)=>t+BUILD[k].rent,0),0);}
function siteVal(x){return x.cost+x.b.reduce((t,k)=>t+BUILD[k].cost,0);}
function lineBuses(L){return S.buses.filter(b=>b.line===L.id);}
function lineQ(L){const bs=lineBuses(L);return clamp((bs.length?avg(bs.map(comfort)):6)+(L.svc||0),1,12);}
/* Markt */
function marketBase(L){const A=cityById(L.a),B=cityById(L.b);return 0.38*Math.sqrt(A.pop*B.pop)/(1+L.dist/200);}
function attrUs(L,rate,nb){return Math.pow(lineQ(L)/5,1.2)*Math.pow(0.12/rate,1.8)*(1+0.18*Math.min(4,Math.max(0,nb-1)))*(0.7+S.rep/150);}
function attrComp(c){return Math.pow(c.q/5,1.2)*Math.pow(0.12/c.price,1.8)*c.s;}
function shareAt(L,rate,nb){const a=attrUs(L,rate,nb);const C=SUBST+L.comps.reduce((s,c)=>s+attrComp(c),0);return a/(a+C);}
function boosts(L){
  let m=1;
  if(S.fx.fest>0&&(S.fx.festCity===L.a||S.fx.festCity===L.b))m*=1.8;
  if(S.fx.ad>0)m*=1.2;
  if(S.up.app)m*=1.1;
  if(bcount('center'))m*=1.06;
  if(bcount('leit'))m*=1.04;
  let sb=0;
  for(const s of S.sites)if(s.city===L.a||s.city===L.b)sb=Math.max(sb,s.hq?0.12:0.08);
  return m*(1+sb);
}
function demandAt(L,rate,nb){return marketBase(L)*shareAt(L,rate,nb)*boosts(L);}
function demand(L){return L.fr?marketBase(L)*0.8*boosts(L):demandAt(L,L.rate,lineBuses(L).length);}
function regionShare(id){
  let d=0,m=0;
  for(const L of S.lines){if(L.fr||(L.a!==id&&L.b!==id))continue;d+=L.D;m+=marketBase(L)*boosts(L);}
  return m?d/m:0;
}
/* Kraftstoff */
function volLiters(){return S.litHist.reduce((a,b)=>a+b,0)+S.litToday;}
function volDisc(){const l=volLiters();return l>=150000?.10:l>=80000?.08:l>=40000?.06:l>=15000?.04:l>=5000?.02:0;}
const stationDisc=()=>bcount('tank')?0.08:0;
const bonusDisc=()=>S.fuelDeal.bonusLeft>0?S.fuelDeal.bonus:0;
const fuelDisc=()=>Math.min(0.25,volDisc()+stationDisc()+bonusDisc());
function fuelBase(){const f=S.fuelDeal.lock;return f&&f.left>0?f.price:S.fuel*(S.fx.fuelM>0?1.4:1);}
const fuelUnit=()=>fuelBase()*(1-fuelDisc());
const tankCap=()=>20000*bcount('tank');
/* Wert */
function busValue(b){const T=TYPES[b.type];return T.price*0.7*(0.5+b.cond/200)*Math.pow(0.9,b.age/365);}
function repairCost(b){return (100-b.cond)*TYPES[b.type].price*0.0005*repairF();}
function fleetValue(){return S.buses.reduce((s,b)=>s+busValue(b),0);}
function companyValue(){return S.cash-S.loan+fleetValue()+S.sites.reduce((s,x)=>s+siteVal(x),0)*0.6;}
function avgProfit(){return S.week.length?avg(S.week.map(d=>d.inc-sumCosts(d))):0;}
function goodwill(){return Math.max(0,avgProfit())*200+S.rep*500+S.lines.length*2500;}
function sellValue(){return companyValue()+goodwill();}
function totalWorth(){return S.wealth+(S.owned?companyValue():0);}
function rankOf(v){let r=RANKS[0][1];for(const [min,n] of RANKS)if(v>=min)r=n;return r;}
function ranking(){
  const rows=S.rivals.map(r=>({name:r.name,home:r.home,value:r.value,fleet:r.fleet||Math.round(r.value/(r.nat?90000:55000)),me:false}));
  if(S.owned)rows.push({name:S.name,home:S.hq,value:companyValue(),fleet:S.buses.length,me:true});
  return rows.sort((a,b)=>b.value-a.value);
}
const myRank=()=>ranking().findIndex(r=>r.me)+1;
function earn(a,L){S.cash+=a;S.today.inc+=a;if(L)L.revDay+=a;}
function spend(cat,a,L){S.cash-=a;S.today[cat]+=a;if(L)L.costDay+=a;}
function assign(b,L){b.line=L.id;b.state='wait';b.t=0;b.waited=0;b.load=0;b.dir=lineBuses(L).length%2;}
function unassign(b){b.line=null;b.state='depot';b.t=0;b.load=0;}
function busPos(b){
  const L=lineById(b.line);if(!L)return null;
  const A=cityById(L.a),B=cityById(L.b);
  const f=b.dir===0?A:B,to=b.dir===0?B:A;
  const t=b.state==='wait'||b.state==='service'?0:b.t;
  return{x:f.x+(to.x-f.x)*t,y:f.y+(to.y-f.y)*t,ang:Math.atan2(to.y-f.y,to.x-f.x)};
}
/* Linien & Wettbewerb */
function lineDefaults(a,b){
  const dist=Math.round(hav(cityById(a),cityById(b))*1.2);
  return{id:nextId(),a,b,dist,rate:0.12,minLoad:0.5,svc:0,fr:null,comps:[],wait:[0,0],revDay:0,costDay:0,h:[],pax:0,pd:0,ph:[],lost:0,D:0,share:0};
}
function genComps(L){
  const A=cityById(L.a),B=cityById(L.b),out=[];
  for(const r of S.rivals){
    let p;
    if(r.nat)p=r.fran?(L.dist>=200?0.6:0.15):0.6;
    else{const h=cityById(r.home);const d=Math.min(hav(h,A),hav(h,B));p=d<=120?0.9:d<=250?0.4:0.05;}
    if(Math.random()<p){
      const base=rnd(0.09,0.15)*r.pf;
      out.push({r:r.id,base,price:base,q:clamp(r.q+rnd(-.6,.6),2,10),s:clamp(0.6+Math.log10(r.value/100000)*0.45,0.5,1.8),war:0});
    }
  }
  return out.sort(()=>Math.random()-0.5).slice(0,3);
}
const rivalById=id=>S.rivals.find(r=>r.id===id);
function busAvg(L){
  const bs=lineBuses(L);
  if(!bs.length)return{n:0,seats:50,speed:60,cons:.28,ins:40};
  return{n:bs.length,seats:avg(bs.map(b=>TYPES[b.type].seats)),speed:avg(bs.map(b=>TYPES[b.type].speed)),
    cons:avg(bs.map(b=>TYPES[b.type].cons)),ins:avg(bs.map(b=>TYPES[b.type].price*0.0004))};
}
function forecast(L,rate){
  const a=busAvg(L),nb=Math.max(1,a.n);
  const D=demandAt(L,rate,nb);
  const trips=24/(L.dist/a.speed+1.5);
  const served=Math.min(D,nb*a.seats*0.9*trips);
  const rev=served*L.dist*rate;
  const need=Math.max(0.45,L.minLoad);
  const km=Math.min(nb*a.speed*24*0.85,served/(a.seats*need)*L.dist);
  const fuel=km*a.cons*fuelUse()*fuelUnit();
  const fixed=nb*(wageDay()+a.ins+[0,25,60][L.svc||0]);
  return{D,served,rev,cost:fuel+fixed,profit:rev-fuel-fixed,share:shareAt(L,rate,nb),nb};
}
function optimalRate(L){
  let best=0.12,bp=-1e12;
  for(let r=4;r<=30;r+=0.5){const f=forecast(L,r/100);if(f.profit>bp){bp=f.profit;best=r/100;}}
  return best;
}

/* ===================== Simulation ===================== */
function step(dt){
  S.t+=dt;
  S.fuelU=fuelUnit();
  for(const k of ['fuelM','snow','strike','ad','fest'])if(S.fx[k]>0)S.fx[k]-=dt/24;
  if(S.t-S.demT>=0.5){
    for(const L of S.lines){L.D=demand(L);L.share=L.fr?0:shareAt(L,L.rate,lineBuses(L).length);}
    S.demT=S.t;
  }
  for(const L of S.lines){
    if(L.fr)continue;
    const capEnd=Math.max(12,L.D*1.2)/2;
    for(let i=0;i<2;i++){
      L.wait[i]+=L.D/2*dt/24;
      if(L.wait[i]>capEnd){const over=L.wait[i]-capEnd;L.wait[i]=capEnd;S.lostToday+=over;L.lost+=over;}
    }
  }
  for(const b of S.buses)stepBus(b,dt);
  const d=Math.floor(S.t/24);
  while(S.day<d){S.day++;dayEnd();}
}
function stepBus(b,dt){
  if(b.state==='depot')return;
  if(b.state==='charter'){b.left-=dt;if(b.left<=0)b.state=b.prev;return;}
  const L=lineById(b.line);
  if(!L){unassign(b);return;}
  const T=TYPES[b.type];
  switch(b.state){
    case 'service':b.left-=dt;if(b.left<=0)b.state='wait';break;
    case 'broken':b.left-=dt;if(b.left<=0)b.state='move';break;
    case 'wait':{
      b.waited+=dt;
      if(!L.fr){
        const take=Math.min(L.wait[b.dir],T.seats-b.load);
        if(take>0){L.wait[b.dir]-=take;b.load+=take;earn(take*L.dist*L.rate,L);L.pax+=take;L.pd+=take;}
      }
      if(S.up.auto&&b.cond<35){
        const c=repairCost(b);
        if(S.cash>c){spend('repair',c,L);b.cond=100;b.state='service';b.left=6;say(`Bus #${b.id} automatisch gewartet (${eur(c)}).`);break;}
      }
      let ready;
      if(L.fr)ready=b.waited>=1&&eligible(b);
      else{
        const need=L.minLoad>0?Math.max(1,Math.ceil(T.seats*L.minLoad)):0;
        ready=b.waited>=0.5&&(b.load>=T.seats-0.5||need===0||b.load>=need||(b.waited>=4&&b.load>=1));
      }
      if(ready&&!(S.fx.strike>0)){b.state='move';b.t=0;}
      break;}
    case 'move':{
      const sp=T.speed*(S.fx.snow>0?0.65:1)*(S.winter?0.93:1)*(b.cond<30?0.85:1);
      const km=sp*dt;
      b.t+=km/L.dist;
      const lit=km*T.cons*fuelUse();S.litToday+=lit;
      const fromTank=Math.min(S.tank.l,lit);S.tank.l-=fromTank;
      const c1=fromTank*S.tank.avg;
      if(c1>0){S.today.fuel+=c1;L.costDay+=c1;}
      spend('fuel',(lit-fromTank)*S.fuelU,L);
      if(L.fr){earn(km*FR_RATES[partnerLevel()-1]*(b.cond<30?0.5:1),L);L.frKm=(L.frKm||0)+km;}
      b.cond=Math.max(0,b.cond-km*T.wear*(S.up.schulung?0.75:1));
      S.totalKm+=km;
      const p=(0.0006+Math.pow((100-b.cond)/100,2)*0.012)*(S.fx.snow>0?2:1)*(S.up.schulung?0.7:1)*breakF();
      if(Math.random()<p*dt){
        b.state='broken';b.left=rnd(8,14);
        spend('repair',350,L);S.rep=Math.max(5,S.rep-0.6);
        say(`🔧 Panne! Bus #${b.id} (${lname(L)}) bleibt liegen. Abschleppen: ${eur(350)}.`,'bad');
        break;
      }
      if(b.t>=1){
        b.t=0;b.dir=1-b.dir;b.state='wait';b.waited=0;
        if(L.fr){const p=T.seats*0.75;S.totalPax+=p;L.pax+=p;L.pd+=p;}else S.totalPax+=b.load;
        b.load=0;
      }
      break;}
  }
}
function dayEnd(){
  const mon=new Date(2025,2,3+S.day).getMonth();
  S.winter=mon===11||mon===0||mon===1;
  // Rivalen laufen immer weiter
  updateRivals();
  if(!S.owned)return;
  for(const b of S.buses){
    const L=lineById(b.line);
    b.age++;
    spend('wage',wageDay(),L);
    spend('ins',TYPES[b.type].price*0.0004,L);
    if(L&&L.svc)spend('other',[0,25,60][L.svc],L);
  }
  spend('depot',rentDay(),null);
  if(S.loan>0)spend('interest',S.loan*0.09/365,null);
  if(S.cash<0)spend('interest',-S.cash*0.0006,null);
  // Kraftstoff
  S.litHist.push(S.litToday);if(S.litHist.length>30)S.litHist.shift();S.litToday=0;
  const fd=S.fuelDeal;
  if(fd.bonusLeft>0)fd.bonusLeft--;
  if(fd.cool>0)fd.cool--;
  if(fd.lock){fd.lock.left--;if(fd.lock.left<=0){fd.lock=null;say('⛽ Dein Festpreis-Vertrag für Diesel ist ausgelaufen.');}}
  // Linien
  for(const L of S.lines){
    L.h.push(L.revDay-L.costDay);if(L.h.length>7)L.h.shift();
    L.ph.push(L.pd);if(L.ph.length>7)L.ph.shift();
    L.revDay=0;L.costDay=0;L.pd=0;
    if(L.fr)frDay(L);
    else for(const c of L.comps){
      const target=c.base*(c.war>0?0.75:1)*(L.share>0.5?0.95:1);
      c.price+=(target-c.price)*0.15;
      if(c.war>0)c.war--;
    }
  }
  S.lines.filter(L=>L.fr&&L.fr.dead).forEach(endContract);
  // Ruf
  const act=S.buses.filter(b=>b.line);
  if(act.length){
    const free=S.lines.filter(L=>!L.fr&&lineBuses(L).length);
    const sumD=S.lines.reduce((s,L)=>s+L.D,0)||1;
    const lostR=S.lostToday/sumD;
    const cAvg=avg(act.map(comfort));
    const condAvg=avg(act.map(b=>b.cond));
    const rr=avg(free.map(L=>L.rate/(L.comps.length?avg(L.comps.map(c=>c.price)):0.12)))||1;
    const target=35+cAvg*5+(bcount('wash')?4:0)-clamp(lostR*40,0,25)-(condAvg<50?(50-condAvg)*0.4:0)-Math.max(0,rr-1.2)*20;
    S.rep=clamp(S.rep+(clamp(target,5,100)-S.rep)*0.06,5,100);
  }
  S.lostToday=0;
  // Wirtschaft
  S.fuel=clamp(S.fuel+(1.6-S.fuel)*0.05+rnd(-0.08,0.08),1.2,2.4);
  S.week.push(S.today);if(S.week.length>7)S.week.shift();
  S.hist.push(Math.round(companyValue()));if(S.hist.length>400)S.hist.shift();
  S.today=zero();
  if(S.day%7===0)for(const L of S.lines)L.lost=0;
  // Partner-Angebote
  if(S.day-S.partner.gen>=14||!S.partner.offers.length)genPartnerOffers();
  // Schulden
  S.negDays=S.cash<-25000?S.negDays+1:0;
  if(S.negDays===1)say('⚠ Kasse stark im Minus! Verkaufe Busse oder nimm einen Kredit auf.','bad');
  rollEvent();
  checkAch();
  if(S.negDays>=10&&!S.over){S.over=true;showOver();}
  if(S.day%5===0)save();
}
function updateRivals(){
  for(const r of S.rivals){
    const sh=r.home&&S.owned?regionShare(r.home):0;
    let g=0.0007+rnd(-0.0012,0.0022)-sh*0.004;
    if(r.nat)g*=0.6;
    r.value=Math.max(60000,r.value*(1+g));
    r.fleet=Math.max(2,Math.round(r.value/(r.nat?90000:55000)));
    if(!r.nat&&r.value<=70000&&Math.random()<0.1){
      const old=r.name;r.name=pick(NEW_RIVAL_NAMES)+' '+pick(['GmbH','KG','& Co.']);r.value=rnd(110000,160000);
      if(S.owned)say(`📉 ${old} hat aufgegeben. Ein neuer Anbieter (${r.name}) ist am Markt.`);
    }
  }
}
function checkAch(){
  for(const a of ACH){
    if(!S.ach[a.id]&&a.t()){S.ach[a.id]=S.day;say(`🏅 Erfolg: ${a.n} – ${a.d}`,'good');}
  }
}

/* ===================== Partnerprogramm ===================== */
function partnerLevel(){let l=1;FR_LEVELS.forEach((v,i)=>{if(S.partner.pts>=v)l=i+1;});return l;}
function genPartnerOffers(){
  S.partner.gen=S.day;
  const lvl=partnerLevel(),out=[];
  const lic=S.lic.slice();
  const pairs=[];
  for(let i=0;i<lic.length;i++)for(let j=i+1;j<lic.length;j++){
    const a=lic[i],b=lic[j];
    if(S.lines.some(l=>(l.a===a&&l.b===b)||(l.a===b&&l.b===a)))continue;
    const dist=Math.round(hav(cityById(a),cityById(b))*1.2);
    if(dist>=180)pairs.push({a,b,dist});
  }
  pairs.sort(()=>Math.random()-0.5);
  for(const p of pairs.slice(0,3)){
    out.push({...p,minBuses:2+(lvl>=3?1:0),term:60,lvlReq:Math.min(5,lvl+(Math.random()<0.3?1:0))});
  }
  S.partner.offers=out;
}
function acceptOffer(i){
  const o=S.partner.offers[i];if(!o)return;
  if(o.lvlReq>partnerLevel())return say(`Dieser Vertrag erfordert Partnerstufe ${o.lvlReq}.`,'bad');
  if(S.lines.some(l=>(l.a===o.a&&l.b===o.b)||(l.a===o.b&&l.b===o.a))){S.partner.offers.splice(i,1);return;}
  const L=lineDefaults(o.a,o.b);
  L.fr={minBuses:o.minBuses,term:o.term,rating:75,low:0,missDays:0};
  S.lines.push(L);S.partner.offers.splice(i,1);
  ui.selLine=L.id;ui.tab='lines';S.demT=-99;
  say(`🤝 Partnervertrag mit Fernflix: ${lname(L)}. Weise mindestens ${o.minBuses} Reisebusse zu.`,'good');
}
function frDay(L){
  const f=L.fr,bs=lineBuses(L),el=bs.filter(eligible);
  const miss=Math.max(0,f.minBuses-el.length);
  if(miss>0){spend('other',250*miss,L);f.missDays++;if(f.missDays%5===1)say(`⚠ Partnerlinie ${lname(L)}: ${miss} Reisebus(se) fehlen (250 € Vertragsstrafe je Tag).`,'bad');}
  if(bs.length)f.rating=f.rating*0.9+(avg(bs.map(b=>b.cond))*0.6+S.rep*0.4)*0.1;
  S.partner.pts+=(L.frKm||0)/1000*(f.rating>=70?1:0.5);L.frKm=0;
  f.low=f.rating<45?f.low+1:0;f.term--;
  if(f.low>=5){f.dead='Mangelnde Qualität';}
  else if(f.term<=0){
    if(f.rating>=60){f.term=60;say(`🤝 Vertrag ${lname(L)} wurde automatisch um 60 Tage verlängert.`,'good');}
    else f.dead='Vertrag ausgelaufen';
  }
}
function endContract(L){
  const why=L.fr.dead;
  L.fr=null;L.comps=genComps(L);L.rate=0.12;S.rep=Math.max(5,S.rep-(why==='Vertrag ausgelaufen'?0:3));S.demT=-99;
  say(`🤝 Partnervertrag ${lname(L)} beendet (${why}). Die Linie läuft jetzt auf eigene Rechnung.`,'bad');
}

/* ===================== Ereignisse ===================== */
function rollEvent(){
  if(S.day<8||ui.modalOpen||Math.random()>0.09)return;
  const ev=pick(['oil','fest','snow','strike','charter','sub','comp','comp','entry','rivalsale']);
  if(ev==='oil'){S.fx.fuelM=20;say('⛽ Ölpreis-Schock: Diesel ist 20 Tage lang 40 % teurer.','bad');}
  else if(ev==='fest'){const c=pick(S.lic);S.fx.fest=6;S.fx.festCity=c;S.demT=-99;say(`🎉 Stadtfest in ${cityById(c).name}! 6 Tage lang mehr Nachfrage.`,'good');}
  else if(ev==='snow'){S.fx.snow=5;say('❄ Schneechaos! 5 Tage langsamer und mehr Pannen.','bad');}
  else if(ev==='sub'){if(S.rep>=40){earn(8000);say('🏛 Förderprogramm für ÖPNV: +'+eur(8000)+' Zuschuss.','good');}}
  else if(ev==='rivalsale'){
    const r=pick(S.rivals.filter(x=>!x.nat));
    if(r){r.value*=rnd(1.08,1.25);say(`📈 ${r.name} hat einen Großauftrag gewonnen und wächst kräftig.`);}
  }
  else if(ev==='strike'&&S.buses.length>=2){
    const cost=Math.max(2500,300*S.buses.length);
    modal('✊ Fahrerstreik!','Die Fahrer fordern höhere Löhne. Zahlst du einen Bonus oder lässt du es auf einen Streik ankommen?',[
      {label:`Bonus zahlen (${eur(cost)})`,cls:'pri',fn:()=>{spend('other',cost);say('Streik abgewendet.');}},
      {label:'Hart bleiben',fn:()=>{S.fx.strike=3;S.rep=Math.max(5,S.rep-4);say('✊ Streik! Keine Abfahrten für 3 Tage.','bad');}}]);
  }
  else if(ev==='charter'){
    const cand=S.buses.filter(b=>TYPES[b.type].seats>=40&&['depot','wait'].includes(b.state));
    if(!cand.length)return;
    const b=pick(cand),pay=Math.round(rnd(3500,6500)/50)*50;
    modal('🚌 Charter-Anfrage',`Ein Reiseveranstalter möchte Bus #${b.id} (${TYPES[b.type].name}) für 3 Tage mieten und zahlt ${eur(pay)}.`,[
      {label:'Annehmen',cls:'pri',fn:()=>{b.prev=b.state;b.state='charter';b.left=72;earn(pay);say(`Charter angenommen: +${eur(pay)}.`,'good');}},
      {label:'Ablehnen',fn:()=>{}}]);
  }
  else if(ev==='comp'){
    const ls=S.lines.filter(L=>!L.fr&&L.comps.length&&lineBuses(L).length);
    if(!ls.length)return;
    const L=pick(ls),c=pick(L.comps),r=rivalById(c.r);
    modal('⚔ Preisaktion',`${r.name} startet auf ${lname(L)} eine Preisaktion (−25 %) für 15 Tage. Ohne Reaktion verlierst du Fahrgäste an den Konkurrenten.`,[
      {label:'Eigenen Preis um 15 % senken',cls:'pri',fn:()=>{c.war=15;L.rate=clamp(L.rate*0.85,0.04,0.3);S.demT=-99;say(`Preis auf ${lname(L)} gesenkt.`);}},
      {label:'Ignorieren',fn:()=>{c.war=15;S.demT=-99;say(`${r.name} unterbietet dich auf ${lname(L)}.`,'bad');}}]);
  }
  else if(ev==='entry'){
    const ls=S.lines.filter(L=>!L.fr&&L.comps.length<3&&lineBuses(L).length);
    if(!ls.length)return;
    const L=pick(ls);
    const have=new Set(L.comps.map(c=>c.r));

  const tier=[0,5000,15000,40000,80000,150000].filter(v=>volLiters()>=v).length-1;

function buyFuel(l){

function makeOffer(tier){
  const home=pick(CITIES).id;
  const k=[2,3,5,7][tier-1];
  const lic=[home,...nearest(home,k)];
  const nb=[3,6,11,18][tier-1]+Math.floor(rnd(0,3));
  const nl=[2,3,6,9][tier-1];
  const pairs=[];
  for(let i=0;i<lic.length;i++)for(let j=i+1;j<lic.length;j++){
    const L=lineDefaults(lic[i],lic[j]);pairs.push([L,marketBase(L)]);
  }
  pairs.sort((x,y)=>y[1]-x[1]);
  const lines=pairs.slice(0,nl).map(([L])=>{L.rate=Math.round(rnd(0.105,0.135)*200)/200;L.comps=genComps(L);return L;});
  const buses=[];
  for(let i=0;i<nb;i++){
    const L=lines[i%lines.length],m=marketBase(L);
    const list=m<45?['mini','mini','city']:m<110?['city','coach','mini']:(tier>=3?['coach','dd','lux','city']:['coach','city']);
    const b=newBus(pick(list));
    b.cond=rnd(55,95);b.age=Math.floor(rnd(60,900));b.line=L.id;b.state='wait';b.dir=i%2;
    buses.push(b);
  }
  const g=Math.max(0,Math.ceil((nb-4)/6));
  const sites=[{id:nextId(),city:home,hq:true,cost:0,b:Array(g).fill('garage').concat(tier>=2?['werkstatt']:[])}];
  if(tier>=3){const c=cityById(lic[1]);sites.push({id:nextId(),city:c.id,hq:false,cost:siteCost(c),b:['garage']});}
  const up={};
  if(tier>=2)up.app=true;if(tier>=3){up.schulung=true;up.wlan=true;}if(tier>=4)up.auto=true;
  const rep=Math.round(rnd(40,70));
  const profit=Math.round(nb*rnd(280,420));
  const val=buses.reduce((s,b)=>s+busValue(b),0)+sites.reduce((s,x)=>s+siteVal(x),0)*0.6+lines.length*2500+rep*500+profit*200;
  return{name:pick(SELLER_NAMES),tier,profit,price:Math.round(val*rnd(0.95,1.15)/500)*500,
    comp:{name:'',hq:home,cash:0,loan:0,rep,lic,buses,lines,up,sites}};
}
function genOffers(){
  const used=new Set();
  return [1,2,3,4].map(t=>{let o=makeOffer(t),n=0;while(used.has(o.name)&&n++<10)o.name=pick(SELLER_NAMES);used.add(o.name);o.comp.name=o.name;return o;});
}

  const cur=clamp(L.rate*100,4,30);
  const poly=pts.map(p=>`${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 300 84" width="100%" height="84" role="img" aria-label="Gewinn je Ticketpreis">
   <line x1="8" x2="292" y1="${Y(0).toFixed(1)}" y2="${Y(0).toFixed(1)}" stroke="#2a3b50" stroke-width="1"/>
   <polyline fill="none" stroke="#ffc233" stroke-width="2" points="${poly}"/>
   <circle cx="${X(best[0]).toFixed(1)}" cy="${Y(best[1]).toFixed(1)}" r="4" fill="#3ddc97"/>
   <circle cx="${X(cur).toFixed(1)}" cy="${Y(forecast(L,cur/100).profit).toFixed(1)}" r="4" fill="#ffffff"/>

  </svg>`;
}

   <h2 class="s">Neu gründen (25.000 € Gründungskosten)</h2><div class="chips">
   ${START_CITIES.map(id=>`<button class="btn sm pri" data-act="found" data-id="${id}" ${S.wealth<35000?'disabled':''}>${cityById(id).name}</button>`).join('')}</div>
   <div class="mute small" style="margin-top:4px">Du startest mit bis zu 150.000 € Betriebskapital aus deinem Privatvermögen.</div>`;
  if(S.wealth<35000&&!S.market.some(o=>o.price<=S.wealth))h+=`<hr><div class="bad small">Dein Vermögen reicht für nichts mehr.</div><button class="btn sm danger" data-act="restart">Neues Spiel starten</button>`;
  if(S.exits.length){
    h+='<h2 class="s">Deine Verkäufe</h2><div class="card"><table>'+S.exits.map(e=>`<tr><td>${e.name} <span class="mute">an ${e.buyer}</span></td><td>${eur(e.price)}</td></tr>`).join('')+'</table></div>';
  }
  return h;
}
function render(){
  if(!S)return;
  const owned=S.owned;
  $('#tabs').style.display=owned?'flex':'none';
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===ui.tab));
  const el=$('#panel');
  const f=document.activeElement;
  if(ui.hold||(f&&el.contains(f)&&/SELECT|INPUT/.test(f.tagName)))return;
  const top=el.scrollTop;
  el.innerHTML=owned?{ov:tabOv,lines:tabLines,fleet:tabFleet,sites:tabSites,market:tabMarket,firm:tabFirm}[ui.tab]():tabNoCompany();
  el.scrollTop=top;
}
function renderLog(){
  $('#log').innerHTML=S.log.slice(0,4).map(l=>`<div class="${l.c}">${l.m}</div>`).join('');
}
function updateHeader(){
  if(!S)return;
  const o=S.owned;
  $('#hCash').textContent=o?eur(S.cash):'–';$('#hCash').className=o&&S.cash<0?'bad':'';
  $('#hValue').textContent=o?eurK(companyValue()):'–';
  $('#hWealth').textContent=eur(S.wealth);
  $('#hRank').textContent=o?`${myRank()} / ${S.rivals.length+1}`:'–';
  $('#hRep').textContent=o?Math.round(S.rep)+' / 100':'–';
  $('#hFuel').textContent=num(S.fuel*(S.fx.fuelM>0?1.4:1),2)+' €/l';
  const d=new Date(2025,2,3+S.day);
  $('#hDate').textContent=`${d.getDate()}. ${MONTHS[d.getMonth()]} ${d.getFullYear()}, ${String(Math.floor(S.t%24)).padStart(2,'0')}:00`;
  document.querySelectorAll('#speed button').forEach(b=>b.classList.toggle('on',+b.dataset.s===S.speed));
  const hint=$('#hint');
  if(ui.mode==='newline'){hint.style.display='block';hint.textContent=ui.first?`Von ${cityById(ui.first).name} → Zielstadt anklicken (Esc = Abbruch)`:'Startstadt anklicken (lizenzierte Städte)';}
  else hint.style.display='none';
}

/* ===================== Events (UI) ===================== */
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b){ui.tab=b.dataset.tab;render();}});
$('#speed').addEventListener('click',e=>{const b=e.target.closest('[data-s]');if(b){S.speed=+b.dataset.s;updateHeader();}});
$('#bHelp').onclick=showHelp;
$('#bNew').onclick=()=>modal('Neues Spiel?','Der aktuelle Spielstand geht verloren.',[
  {label:'Neu starten',cls:'pri',fn:()=>{localStorage.removeItem(KEY);newState();ui.tab='ov';say('Neues Spiel gestartet.');chooseHQ();}},
  {label:'Abbrechen',fn:()=>{}}]);
window.addEventListener('keydown',e=>{
  if(e.code==='Space'&&!/INPUT|SELECT|BUTTON/.test(document.activeElement.tagName)){e.preventDefault();S.speed=S.speed?0:1;updateHeader();}
  if(e.key==='Escape'){ui.mode=null;ui.first=null;updateHeader();render();}
});
const panel=$('#panel');
panel.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el||el.disabled)return;
  const a=el.dataset.act,id=+el.dataset.id;
  if(a==='loan'){
    const amt=el.dataset.amt==='all'?-S.loan:+el.dataset.amt;
    S.loan+=amt;S.cash+=amt;
    say(amt>0?`Kredit über ${eur(amt)} aufgenommen.`:`${eur(-amt)} Kredit getilgt.`);
  }
  else if(a==='newline'){ui.mode=ui.mode==='newline'?null:'newline';ui.first=null;}
  else if(a==='sel'){ui.selLine=ui.selLine===id?null:id;}
  else if(a==='delline')deleteLine(id);
  else if(a==='addbus'){
    const L=lineById(id),free=S.buses.find(b=>!b.line&&b.state==='depot');
    if(!free)say('Kein freier Bus im Depot – kaufe einen neuen (Reiter Flotte).','bad');
    else{
      if(L.fr&&!eligible(free))say('Für Partnerlinien brauchst du Reisebusse (≥ 40 Plätze, Komfort ≥ 6). Dieser Bus fährt dort nicht ab.','bad');
      assign(free,L);S.demT=-99;
    }
  }
  else if(a==='rembus'){const L=lineById(id);const bs=lineBuses(L);if(bs.length){const b=bs[bs.length-1];if(b.state==='charter')say('Bus ist gerade verchartert.','bad');else{unassign(b);S.demT=-99;}}}
  else if(a==='optprice'){const L=lineById(id);L.rate=Math.round(optimalRate(L)*200)/200;S.demT=-99;}
  else if(a==='buy')buyBus(el.dataset.type);
  else if(a==='sell')sellBus(id);
  else if(a==='repair')repairBus(id);
  else if(a==='lic')buyLicense(el.dataset.id);
  else if(a==='selsite')ui.selSite=id;
  else if(a==='build')build(+el.dataset.site,el.dataset.b);
  else if(a==='demol')demolish(+el.dataset.site,+el.dataset.idx);
  else if(a==='buysite')buySite(el.dataset.id);
  else if(a==='sellsite')sellSite(id);
  else if(a==='negotiate')negotiate();
  else if(a==='lockfuel')lockFuel();
  else if(a==='buyfuel')buyFuel(+el.dataset.l);
  else if(a==='accept')acceptOffer(id);
  else if(a==='transfer')transfer(+el.dataset.amt);
  else if(a==='sellco')openSell();
  else if(a==='buyco')buyOffer(id);
  else if(a==='found')foundCompany(el.dataset.id);
  else if(a==='newoffers')newOffers();
  else if(a==='restart'){localStorage.removeItem(KEY);newState();ui.tab='ov';chooseHQ();}
  else if(a==='ad'){if(S.cash>=12000){S.cash-=12000;S.fx.ad=30;S.demT=-99;say('Werbekampagne gestartet.','good');}}
  else if(a==='up'){const u=UPGRADES[el.dataset.id];if(u&&S.cash>=u.cost&&!S.up[el.dataset.id]){S.cash-=u.cost;S.up[el.dataset.id]=true;S.demT=-99;say(`Upgrade „${u.name}“ freigeschaltet.`,'good');}}
  render();updateHeader();
});
panel.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.in==='rate'){
    const L=lineById(+el.dataset.id);L.rate=+el.value;S.demT=-99;
    const v=$('#rateV');if(v)v.textContent=rateTxt(L);
    const fc=$('#fc');if(fc)fc.innerHTML=forecastHTML(L);
  }
});
panel.addEventListener('pointerdown',e=>{if(e.target.type==='range')ui.hold=true;});
window.addEventListener('pointerup',()=>{if(ui.hold){ui.hold=false;render();}});
panel.addEventListener('change',e=>{
  const el=e.target,id=+el.dataset.id;
  if(el.dataset.in==='minload'){lineById(id).minLoad=+el.value;}
  else if(el.dataset.in==='svc'){lineById(id).svc=+el.value;S.demT=-99;}
  else if(el.dataset.in==='assign'){
    const b=busById(id);
    if(el.value==='')unassign(b);else assign(b,lineById(+el.value));
    S.demT=-99;
  }
  el.blur();render();
});

/* ===================== Karte ===================== */
const cv=$('#cv'),ctx=cv.getContext('2d');
let view={s:1,ox:0,oy:0,dpr:1};
function resize(){
  const r=cv.getBoundingClientRect();
  view.dpr=window.devicePixelRatio||1;
  cv.width=Math.max(1,r.width*view.dpr);cv.height=Math.max(1,r.height*view.dpr);
  view.s=Math.min(r.width/MAP.w,r.height/MAP.h)*0.96;
  view.ox=(r.width-MAP.w*view.s)/2;view.oy=(r.height-MAP.h*view.s)/2;
}
new ResizeObserver(resize).observe(cv);
const toMap=(ev)=>{const r=cv.getBoundingClientRect();return{x:(ev.clientX-r.left-view.ox)/view.s,y:(ev.clientY-r.top-view.oy)/view.s};};
function segDist(p,a,b){
  const dx=b.x-a.x,dy=b.y-a.y,l2=dx*dx+dy*dy;
  const t=clamp(((p.x-a.x)*dx+(p.y-a.y)*dy)/l2,0,1);
  return Math.hypot(p.x-(a.x+dx*t),p.y-(a.y+dy*t));
}
function hitTest(p){
  if(!S.owned){for(const c of CITIES)if(Math.hypot(c.x-p.x,c.y-p.y)<15)return{k:'city',o:c};return null;}
  for(const b of S.buses){if(!b.line)continue;const q=busPos(b);if(q&&Math.hypot(q.x-p.x,q.y-p.y)<8)return{k:'bus',o:b};}
  for(const c of CITIES)if(Math.hypot(c.x-p.x,c.y-p.y)<15)return{k:'city',o:c};
  for(const L of S.lines)if(segDist(p,cityById(L.a),cityById(L.b))<6)return{k:'line',o:L};
  return null;
}
let mouse={x:0,y:0};
cv.addEventListener('mousemove',e=>{
  mouse=toMap(e);
  const h=hitTest(mouse);ui.hover=h;
  cv.style.cursor=h?'pointer':'default';
  const tip=$('#tip');
  if(!h){tip.style.display='none';return;}
  let t='';
  if(h.k==='city'){const c=h.o;const own=S.owned&&S.lic.includes(c.id);
    const w=S.owned?S.lines.filter(L=>!L.fr&&(L.a===c.id||L.b===c.id)).reduce((s,L)=>s+L.wait[L.a===c.id?0:1],0):0;
    const rv=S.rivals.filter(r=>r.home===c.id).map(r=>r.name).join(', ');
    const st=S.owned?S.sites.find(s=>s.city===c.id):null;
    t=`<b>${c.name}</b><br>${num(c.pop)} Tsd. Einwohner${rv?`<br>Zuhause von ${rv}`:''}<br>${own?`Lizenz ✓${st?` · ${st.hq?'Hauptstandort':'Betriebshof'}`:''}${w>=1?`<br>Wartende: ${Math.round(w)}`:''}${S.lines.length?`<br>Dein Marktanteil: ${pct(regionShare(c.id))}`:''}`:S.owned?`Keine Lizenz – ${eur(licCost(c))}<br><span class="mute">Klicken zum Kaufen</span>`:''}`;}
  else if(h.k==='bus'){const b=h.o,T=TYPES[b.type];t=`<b>#${b.id} ${T.name}</b><br>${busStatus(b)}<br>Zustand ${Math.round(b.cond)} %`;}
  else{const L=h.o;t=`<b>${lname(L)}</b><br>${L.dist} km · ${lineBuses(L).length} Busse<br>${L.fr?'Partnerlinie Fernflix':`Nachfrage ${num(L.D)}/Tag · Anteil ${pct(L.share)}<br>${L.comps.length} Konkurrent(en)`}`;}
  tip.innerHTML=t;tip.style.display='block';
  const r=cv.getBoundingClientRect();
  tip.style.left=Math.min(e.clientX-r.left+14,r.width-250)+'px';tip.style.top=(e.clientY-r.top+14)+'px';
});
cv.addEventListener('mouseleave',()=>{$('#tip').style.display='none';ui.hover=null;});
cv.addEventListener('click',e=>{
  if(!S.owned)return;
  const p=toMap(e),h=hitTest(p);
  if(!h)return;
  if(ui.mode==='newline'){
    if(h.k!=='city')return;
    if(!S.lic.includes(h.o.id))return say(`Für ${h.o.name} fehlt die Lizenz (Reiter Firma).`,'bad');
    if(!ui.first){ui.first=h.o.id;}
    else if(ui.first!==h.o.id){createLine(ui.first,h.o.id);ui.mode=null;ui.first=null;}
    updateHeader();render();return;
  }
  if(h.k==='city'&&!S.lic.includes(h.o.id)){
    const c=h.o,cost=licCost(c);
    modal(`Lizenz für ${c.name}`,`Betriebslizenz kostet ${eur(cost)}. Du hast ${eur(S.cash)}.`,[
      {label:'Kaufen',cls:'pri',fn:()=>buyLicense(c.id)},{label:'Abbrechen',fn:()=>{}}]);
  }
  else if(h.k==='city'){const st=S.sites.find(s=>s.city===h.o.id);if(st){ui.selSite=st.id;ui.tab='sites';render();}}
  else if(h.k==='line'){ui.selLine=h.o.id;ui.tab='lines';render();}
  else if(h.k==='bus'){ui.tab='fleet';render();}
});

function drawMap(){
  const W=cv.width/view.dpr,H=cv.height/view.dpr;
  ctx.setTransform(view.dpr,0,0,view.dpr,0,0);
  ctx.clearRect(0,0,W,H);
  ctx.save();ctx.translate(view.ox,view.oy);ctx.scale(view.s,view.s);
  ctx.beginPath();
  GERMANY.forEach(([lon,lat],i)=>{const p=proj({lon,lat});i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y);});
  ctx.closePath();ctx.fillStyle='#22344a';ctx.fill();
  ctx.strokeStyle='#3b5472';ctx.lineWidth=2;ctx.lineJoin='round';ctx.stroke();
  const owned=S.owned;
  for(const L of owned?S.lines:[]){
    const A=cityById(L.a),B=cityById(L.b);
    const n=lineBuses(L).length,p=L.h.length?avg(L.h):0;
    ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.lineTo(B.x,B.y);
    if(ui.selLine===L.id){ctx.strokeStyle='#fff';ctx.lineWidth=7+n;ctx.globalAlpha=.25;ctx.stroke();ctx.globalAlpha=1;}
    ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.lineTo(B.x,B.y);
    ctx.strokeStyle=!n?'#7c8ea3':L.fr?'#6fa8ff':(L.h.length&&p<0?'#ff6b6b':'#3ddc97');
    ctx.lineWidth=2+n;ctx.setLineDash(n?[]:[6,5]);ctx.stroke();ctx.setLineDash([]);
  }
  if(owned&&ui.mode==='newline'&&ui.first){
    const A=cityById(ui.first);
    ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.lineTo(mouse.x,mouse.y);
    ctx.strokeStyle='#ffc233';ctx.lineWidth=3;ctx.setLineDash([8,6]);ctx.stroke();ctx.setLineDash([]);
  }
  for(const c of CITIES){
    const own=owned&&S.lic.includes(c.id);
    const r=5+Math.sqrt(c.pop)/6;
    const w=owned?S.lines.filter(L=>!L.fr&&(L.a===c.id||L.b===c.id)).reduce((s,L)=>s+L.wait[L.a===c.id?0:1],0):0;
    const hi=ui.mode==='newline'&&own;
    if(hi){ctx.beginPath();ctx.arc(c.x,c.y,r+5,0,7);ctx.strokeStyle='#ffc23399';ctx.lineWidth=2;ctx.stroke();}
    ctx.beginPath();ctx.arc(c.x,c.y,r,0,7);
    ctx.fillStyle=own?'#fff':'#4a5a6e';ctx.fill();
    ctx.lineWidth=2;ctx.strokeStyle=ui.first===c.id?'#ffc233':own?'#0f1720':'#2a3b50';ctx.stroke();
    ctx.font='600 12px system-ui,sans-serif';ctx.textAlign='center';
    ctx.fillStyle=own?'#e8eef5':'#7a8da3';
    ctx.fillText((own||!owned?'':'🔒 ')+c.name,c.x,c.y-r-5);
    if(w>=1){ctx.font='11px system-ui';ctx.fillStyle=w>40?'#ff6b6b':'#ffc233';ctx.fillText('👥 '+Math.round(w),c.x,c.y+r+13);}
    if(owned){
      const st=S.sites.find(s=>s.city===c.id);
      if(st){
        ctx.font='700 14px system-ui';ctx.textAlign='left';
        if(st.hq){ctx.fillStyle='#ffc233';ctx.fillText('★',c.x+r+2,c.y-r+4);}
        else{ctx.fillStyle='#4da3ff';ctx.fillRect(c.x+r+2,c.y-r-6,8,8);}
      }
    }
  }
  const tm=performance.now()/1000;
  for(const b of owned?S.buses:[]){
    if(!b.line)continue;
    const q=busPos(b);if(!q)continue;
    const T=TYPES[b.type];
    ctx.save();ctx.translate(q.x,q.y);
    if(b.state==='broken'){
      const a=0.5+0.5*Math.sin(tm*8);
      ctx.beginPath();ctx.arc(0,0,9,0,7);ctx.fillStyle=`rgba(255,107,107,${a})`;ctx.fill();
    }
    ctx.rotate(q.ang);
    ctx.fillStyle=b.state==='charter'?'#888':T.color;
    ctx.strokeStyle='#0f1720';ctx.lineWidth=1.5;
    const w=7+T.seats/20,hh=4.5;
    ctx.beginPath();ctx.roundRect(-w/2,-hh/2,w,hh,2);ctx.fill();ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
}

/* ===================== Hauptschleife ===================== */
let last=performance.now(),acc=0;
function frame(now){
  const dt=Math.min(0.1,(now-last)/1000);last=now;
  if(S&&S.owned&&!ui.modalOpen&&!S.over&&S.speed>0){
    let h=dt*S.speed*24/DAY_REAL;
    while(h>0){const s=Math.min(0.1,h);step(s);h-=s;}
  }
  if(S){
    drawMap();
    acc+=dt;
    if(acc>0.4){acc=0;updateHeader();render();}
  }
  requestAnimationFrame(frame);
}
function start(){
  const s=load();
  const first=!s;
  if(s){S=s;S.fuelU=S.fuelU||S.fuel;}else newState();
  if(first)say('Willkommen! Wähle deinen Hauptstandort und lege eine Linie an.');
  else say(S.owned?'Spielstand geladen.':'Spielstand geladen. Du hast kein Unternehmen.');
  renderLog();render();updateHeader();
  window.addEventListener('beforeunload',save);
  document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});
  if(first){chooseHQ();showHelp();}
  requestAnimationFrame(frame);
}
window.__bus={get S(){return S;},step,createLine,buyBus,assign,lineById,dayEnd,build,buySite,acceptOffer,openSell,sellCompany,buyOffer,foundCompany,negotiate,lockFuel,buyFuel,forecast,optimalRate,ranking,tabOv,tabLines,tabFleet,tabSites,tabMarket,tabFirm,tabNoCompany,installCompany,freshCompany,upgradeSave,sellValue,partnerLevel,genPartnerOffers,licCost};
start();
