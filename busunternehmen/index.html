<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bus-Imperium Europa</title>
<style>

:root{
  color-scheme:dark;
  --bg:#0f1720;--panel:#16212e;--panel2:#1c2a3a;--line:#2a3b50;--text:#e8eef5;--mute:#8da2b8;
  --acc:#ffc233;--good:#3ddc97;--bad:#ff6b6b;--blue:#4da3ff;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
header{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:16px;margin:0;color:var(--acc);letter-spacing:.3px;white-space:nowrap}
.stat{display:flex;flex-direction:column;line-height:1.15}
.stat small{color:var(--mute);font-size:10.5px;text-transform:uppercase;letter-spacing:.5px}
.stat b{font-size:15px;font-variant-numeric:tabular-nums}
.sp{flex:1}
.speed{display:flex;gap:3px}
.speed button,.btn{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:5px 10px}
.speed button.on{background:var(--acc);color:#222;border-color:var(--acc);font-weight:700}
.btn:hover:not(:disabled){border-color:var(--acc)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.pri{background:var(--acc);color:#1c1c1c;border-color:var(--acc);font-weight:700}
.btn.danger{border-color:#6b3040;color:#ffb3b3}
.btn.sm{padding:3px 8px;font-size:12px}
main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 440px;min-height:0}
#mapcol{display:flex;flex-direction:column;min-height:0;min-width:0}
#mapwrap{flex:1;position:relative;min-height:0;background:radial-gradient(circle at 50% 40%,#16314d,#0b1826)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#tip{position:absolute;pointer-events:none;background:#0b121bee;border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:12px;display:none;z-index:5;max-width:240px}
#back{position:absolute;left:10px;top:10px;z-index:6}
#siteTitle{position:absolute;left:10px;top:52px;z-index:5;background:#0b121bdd;border:1px solid var(--line);border-radius:10px;padding:8px 10px;max-width:calc(100% - 20px)}
#hint{position:absolute;left:10px;top:10px;background:#0b121bdd;border:1px solid var(--acc);color:var(--acc);padding:6px 10px;border-radius:8px;display:none;font-weight:600;z-index:4}
#log{height:76px;overflow:hidden;background:var(--panel);border-top:1px solid var(--line);padding:6px 12px;font-size:12px;color:var(--mute);display:flex;flex-direction:column-reverse}
#log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#log div:first-child{color:var(--text)}
#side{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto}
#tabs button{flex:1 0 auto;background:none;border:0;border-bottom:3px solid transparent;padding:10px 9px;color:var(--mute);font-size:12.5px;white-space:nowrap}
#tabs button.on{color:var(--acc);border-bottom-color:var(--acc);font-weight:700}
#panel{flex:1;overflow:auto;padding:12px}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px}
.card.sel{border-color:var(--acc)}
.card h3{margin:0 0 6px;font-size:14px}
.row{display:flex;align-items:center;gap:8px;justify-content:space-between;margin:4px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.kpi small{color:var(--mute);display:block;font-size:11px}
.kpi b{font-size:17px;font-variant-numeric:tabular-nums}
.bar{height:7px;background:#0b121b;border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--good)}
.mute{color:var(--mute)} .good{color:var(--good)} .bad{color:var(--bad)} .acc{color:var(--acc)}
.small{font-size:12px}
.tag{font-size:11px;background:#0b121b;border-radius:5px;padding:1px 6px;color:var(--mute);white-space:nowrap}
h2.s{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--mute);margin:14px 0 6px}
input[type=range]{width:100%;accent-color:var(--acc)}
select{background:#0b121b;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:3px 5px;font:inherit;max-width:170px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td,th{padding:2px 0;text-align:left;font-weight:400}
td:last-child,th:last-child{text-align:right}
th{color:var(--mute);font-size:11px;text-transform:uppercase;letter-spacing:.4px}
tr.me td{color:var(--acc);font-weight:700}
hr{border:0;border-top:1px solid var(--line);margin:8px 0}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:6px 0}
.slot{aspect-ratio:1.5;border:1px dashed var(--line);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:18px;color:var(--mute)}
.slot small{font-size:10px;line-height:1.1;text-align:center}
.slot.on{border-style:solid;background:#0b121b;color:var(--text)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12px;color:var(--mute)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#1c1c1c;font-weight:700}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.lrow,.brow{display:grid;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);margin-bottom:4px;cursor:pointer}
.lrow{grid-template-columns:1fr auto auto auto}
.brow{grid-template-columns:auto auto 1fr 46px auto}
.lrow:hover,.brow:hover{border-color:var(--acc)}
.lrow.sel,.brow.sel{border-color:var(--acc)}
.lrow .n,.brow .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ghead{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--mute);margin:10px 0 4px}
.detail{background:var(--panel2);border:1px solid var(--acc);border-radius:8px;padding:8px 10px;margin:-2px 0 6px}
#modalbg{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#modal{background:var(--panel);border:1px solid var(--acc);border-radius:14px;padding:20px;max-width:480px;width:100%;max-height:90vh;overflow:auto}
#modal h2{margin:0 0 8px;color:var(--acc)}
#modal .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
@media(max-width:860px){
  html,body{height:auto;min-height:100%}
  body{display:block;overflow-x:hidden;overflow-y:auto}
  main{display:flex;flex-direction:column;min-width:0}
  #mapcol{flex:none;height:62vh;min-height:340px;width:100%}
  #side{flex:none;width:100%;min-width:0;border-left:0;border-top:1px solid var(--line);position:relative;z-index:2}
  #tabs{position:sticky;top:0;z-index:10;background:var(--panel)}
  #panel{overflow:visible;min-width:0}
  #log{height:64px}
  canvas{touch-action:manipulation}
  #siteTitle{max-width:calc(100% - 20px);font-size:12px}
}

.swatch{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);padding:0}
.swatch.on{border-color:#fff;box-shadow:0 0 0 2px var(--acc)}
.zoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px;z-index:6}
.zoom .btn{width:36px;height:36px;padding:0;font-size:18px;line-height:1}
#cityCard{position:absolute;left:10px;bottom:10px;z-index:6;background:#0b121bf2;border:1px solid var(--acc);border-radius:12px;padding:10px 12px;max-width:min(340px,calc(100% - 70px))}
table.small td{padding:1px 0}
@media(max-width:860px){canvas{touch-action:none}}
</style>
</head>
<body>
<header>
  <h1>🚌 Bus-Imperium Europa <small style="font-weight:400;color:var(--mute);font-size:10px">v9</small></h1>
  <div class="stat"><small>Kasse</small><b id="hCash">–</b></div>
  <div class="stat"><small>Unternehmenswert</small><b id="hValue">–</b></div>
  <div class="stat"><small>Privat</small><b id="hWealth">–</b></div>

  <div class="stat"><small>Ruf</small><b id="hRep">–</b></div>

  <div class="stat"><small>Datum</small><b id="hDate">–</b></div>
  <div class="sp"></div>
  <div class="speed" id="speed">
    <button data-s="0" title="Pause (Leertaste)">⏸</button>
    <button data-s="1">1×</button>
    <button data-s="2">2×</button>
    <button data-s="5">5×</button>
  </div>
  <button class="btn" id="bHelp" title="Anleitung">?</button>
  <button class="btn" id="bNew" title="Neues Spiel">↺</button>
</header>
<main>
  <div id="mapcol">
    <div id="mapwrap">
      <canvas id="cv"></canvas>
      <div class="zoom"><button class="btn" id="zin" aria-label="Hineinzoomen">+</button><button class="btn" id="zout" aria-label="Herauszoomen">−</button><button class="btn" id="zhome" aria-label="Ganz Europa">⌂</button></div>
      <div id="hint"></div>
      <div id="tip"></div>
      <div id="cityCard" hidden></div>
    </div>
    <div id="log"></div>
  </div>
  <aside id="side">
    <div id="tabs">
      <button data-tab="ov">Übersicht</button>
      <button data-tab="lines">Linien</button>
      <button data-tab="fleet">Flotte</button>
      <button data-tab="sites">Standorte</button>
      <button data-tab="tech">Technik</button>
      <button data-tab="market">Markt</button>
      <button data-tab="firm">Firma</button>
      <button data-tab="wealth">Vermögen</button>
      <button data-tab="nocomp" hidden>Unternehmen</button>
    </div>
    <div id="panel"></div>
  </aside>
</main>
<div id="modalbg"><div id="modal"></div></div>

  const h=Math.sin(dl/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dn/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));}

  for(const k of sp.feat){const F=FEAT[k];cmf+=F.cmf;fp+=F.price;if(F.seats)seatsF*=F.seats;}

  if(sp.drive==='electric'&&B.evDisc)price*=1-B.evDisc;
  price+=fp;

    seats:Math.max(8,Math.round(C.seats*seatsF)),speed:C.speed,cmf:clamp(cmf,1,12),rel:B.rel,list:Math.round(price),wear:C.wear,wage:C.wage,tollF:C.toll,

function lineReq(L){
  const A=cityById(L.a),B=cityById(L.b),r=[];
  if(L.fr)r.push('wc','klima','wlan');
  if(L.dist>=120)r.push('wc');
  if(L.dist>=250){r.push('klima');r.push('komfort');}
  if(L.dist>=450)r.push('wlan');
  if(A.t||B.t)r.push('gepaeck');
  if(L.dist<100)r.push('rampe');
  if(L.night)r.push('liege');
  return [...new Set(r)];
}
const busHas=(b,k)=>k==='komfort'?(b.feat.includes('komfort')||b.feat.includes('liege')):b.feat.includes(k);
function busMeets(b,L){
  const miss=[];
  for(const k of lineReq(L))if(!busHas(b,k))miss.push(FEAT[k].n);
  if((zoneOn(L.a)||zoneOn(L.b))&&b.drive==='diesel')miss.push('Umweltzone (kein Diesel)');
  if(b.drive==='electric'&&L.dist>b.range*0.92)miss.push(`Reichweite ${Math.round(b.range)} km zu gering`);
  return miss;
}

function lineGeo(a,b){
  const A=cityById(a),B=cityById(b),CA=COUNTRIES[A.c],CB=COUNTRIES[B.c];
  const w=(CA.wage+CB.wage)/2;
  return{dist:Math.round(hav(A,B)*1.25),intl:A.c!==B.c,fm:(CA.fuel+CB.fuel)/2,wm:w,toll:(CA.toll+CB.toll)/2,dm:(CA.dem+CB.dem)/2,cm:clamp(0.78+0.22*w,0.85,1.15)};
}

function marketBase(L){
  const A=cityById(L.a),B=cityById(L.b);
  return 0.38*Math.sqrt(A.pop*B.pop)/(1+Math.pow(L.dist/150,1.6))*L.dm*(A.t||B.t?1.12:1);
}
const rivalS=r=>clamp(0.5+Math.log10(Math.max(r.value,50000)/100000)*0.55,0.45,2.4);
function compsOf(L){
  if(L.excl>0||L.fr)return [];
  const A=cityById(L.a),B=cityById(L.b),out=[];
  for(const r of S.rivals){
    if(!r.alive)continue;
    let p=0;
    if(r.cities.includes(L.a)||r.cities.includes(L.b))p=1;
    else{
      const d=Math.min(...r.cities.map(id=>Math.min(hav(cityById(id),A),hav(cityById(id),B))));
      if(d<220)p=0.55;else if(r.net&&d<900)p=0.4;
    }
    if(!p)continue;
    const h=((r.id*7919+L.id*104729)%1000)/1000;
    if(h>=p)continue;
    const ref=0.077*r.pf*L.cm;
    out.push({r:r.id,price:ref*(r.war>0?0.75:1)*(L.share>0.4?1-0.08*r.agg:1),ref:REF*L.cm,q:clamp(r.q+0.12*r.tech,2,11),s:rivalS(r),tech:r.tech});
  }
  return out.sort((x,y)=>y.s-x.s).slice(0,3);
}
function recSpec(L){
  const reqs=lineReq(L);
  const est=marketBase(L)*0.28;
  const cls=L.dist<100?(est<35?'mini':'midi'):L.dist<250?(est<35?'mini':est<70?'midi':'bus'):(est<55?'midi':est<110?'bus':'coach');
  return{cls,brand:'iveko',drive:(zoneOn(L.a)||zoneOn(L.b))?'hybrid':'diesel',
    feat:reqs.filter(k=>k!=='komfort'||!reqs.includes('liege')),color:'#4da3ff'};
}
function hypoOf(L,sp){const st=bStats(sp);return{n:1,seats:st.seats,speed:st.speed,ckm:busCostKm(st,L),ins:st.list*0.0004,wage:st.wage,tollF:st.tollF};}
const techScore=()=>tfx('planung')+tfx('ertrag')+tfx('crm');
function attrUs(L,rate,nb){return Math.pow(lineQ(L)/5,1.2)*Math.pow(REF*L.cm/rate,1.8)*(1+0.18*Math.min(4,Math.max(0,nb-1)))*(0.7+S.rep/150)*(1+0.03*techScore())*(L.night?1.1:1);}
function attrComp(c){return Math.pow(c.q/5,1.2)*Math.pow(c.ref/c.price,1.8)*c.s*(1+0.03*c.tech);}
function shareAt(L,rate,nb){const a=attrUs(L,rate,nb);const C=SUBST+L.comps.reduce((s,c)=>s+attrComp(c),0);return a/(a+C);}
function boosts(L){
  let m=1;
  if(S.fx.fest>0&&(S.fx.festCity===L.a||S.fx.festCity===L.b))m*=1.8;
  if(S.fx.ad>0)m*=1.2;
  if(S.fx.econ>0)m*=1+S.fx.econV;
  if(S.fx.border>0&&L.intl)m*=0.85;
  m*=1+0.04*tfx('app');
  if(L.night)m*=1.25;
  let sb=0;
  for(const s of S.sites)if(s.city===L.a||s.city===L.b)sb=Math.max(sb,(s.hq?0.12:0.08)+Math.min(0.3,0.03*s.verw));
  return m*(1+sb);
}
function demandAt(L,rate,nb){return marketBase(L)*shareAt(L,rate,nb)*boosts(L);}
function demand(L){return L.fr?marketBase(L)*0.8*boosts(L):demandAt(L,L.rate,lineBuses(L).length);}
function regionShare(id){
  let d=0,m=0;
  for(const L of S.lines){if(L.fr||(L.a!==id&&L.b!==id))continue;d+=L.D;m+=marketBase(L)*boosts(L);}
  return m?d/m:0;
}
function countryShare(c){
  let d=0,m=0;
  for(const L of S.lines){if(L.fr||(cityById(L.a).c!==c&&cityById(L.b).c!==c))continue;d+=L.D;m+=marketBase(L)*boosts(L);}
  return m?d/m:0;
}
/* Kraftstoff */
function volLiters(){return S.litHist.reduce((a,b)=>a+b,0)+S.litToday;}
function volDisc(){const l=volLiters();return l>=150000?.10:l>=80000?.08:l>=40000?.06:l>=15000?.04:l>=5000?.02:0;}
const bonusDisc=()=>S.fuelDeal.bonusLeft>0?S.fuelDeal.bonus:0;
const fuelDisc=()=>Math.min(0.28,volDisc()+stationDisc()+bonusDisc()+0.01*tfx('einkauf'));
function fuelBase(){const f=S.fuelDeal.lock;return f&&f.left>0?f.price:S.fuel*(S.fx.fuelM>0?1.4:1);}
const fuelUnit=()=>fuelBase()*(1-fuelDisc());
const tankUpDummy=0;
function busCostKm(b,L){
  return b.drive==='electric'?b.ekm*S.energy*L.fm*(1-chargeDisc()):b.lkm*fuelUse()*fuelUnit()*L.fm;
}
/* Wert */
function busValue(b){const base=b.paid>0?b.paid:b.list;return Math.max(3000,base*0.72*(0.5+b.cond/200)*Math.pow(0.9,b.age/365));}
function repairCost(b){return (100-b.cond)*b.list*0.0005*repairF();}
function fleetValue(){return S.buses.reduce((s,b)=>s+busValue(b),0);}
function companyValue(){return S.cash-S.loan+fleetValue()+S.sites.reduce((s,x)=>s+siteVal(x),0)*0.6;}
function avgProfit(){return S.week.length?avg(S.week.map(d=>d.inc-sumCosts(d))):0;}
function goodwill(){return Math.max(0,avgProfit())*200+S.rep*500+S.lines.length*2500;}
function sellValue(){return companyValue()+goodwill();}
function totalWorth(){return S.wealth+investWorth()+(S.owned?companyValue():0);}
function rankOf(v){let r=RANKS[0][1];for(const [min,n] of RANKS)if(v>=min)r=n;return r;}
function ranking(){
  const rows=S.rivals.filter(r=>r.alive).map(r=>({id:r.id,name:r.name,home:r.home,value:r.value,fleet:r.fleet,tech:r.tech,me:false}));
  if(S.owned)rows.push({name:S.name,home:S.hq,value:companyValue(),fleet:S.buses.length,tech:Object.values(S.tech).reduce((a,b)=>a+b,0),me:true});
  return rows.sort((a,b)=>b.value-a.value);
}
const myRank=()=>ranking().findIndex(r=>r.me)+1;
function earn(a,L){S.cash+=a;S.today.inc+=a;if(L)L.revDay+=a;}
function spend(cat,a,L){S.cash-=a;S.today[cat]=(S.today[cat]||0)+a;if(L)L.costDay+=a;}
function assign(b,L){b.line=L.id;b.state='wait';b.t=0;b.waited=0;b.load=0;b.dir=lineBuses(L).length%2;}
function unassign(b){b.line=null;b.state='depot';b.t=0;b.load=0;}
function busPos(b){
  const L=lineById(b.line);if(!L)return null;
  const A=cityById(L.a),B=cityById(L.b);
  const f=b.dir===0?A:B,to=b.dir===0?B:A;
  const t=b.state==='wait'||b.state==='service'?0:b.t;
  return{x:f.x+(to.x-f.x)*t,y:f.y+(to.y-f.y)*t,ang:Math.atan2(to.y-f.y,to.x-f.x)};
}
function busAvg(L,hyp){
  if(hyp)return hyp;
  const bs=lineBuses(L);
  if(!bs.length)return{n:0,seats:50,speed:62,ckm:0.27*S.fuelU*L.fm,ins:45,wage:130,tollF:.9};
  return{wage:avg(bs.map(b=>b.wage)),tollF:avg(bs.map(b=>b.tollF)),n:bs.length,seats:avg(bs.map(b=>b.seats)),speed:avg(bs.map(b=>b.speed)),ckm:avg(bs.map(b=>busCostKm(b,L))),ins:avg(bs.map(b=>b.list*0.0004))};
}
function forecast(L,rate,hyp){
  const a=busAvg(L,hyp),nb=Math.max(1,a.n);
  const D=demandAt(L,rate,nb);
  const turn=1.5+(L.intl?1:0);
  const trips=24/(L.dist/a.speed+turn);
  const served=Math.min(D,nb*a.seats*0.9*trips);
  const prem=(1+0.025*tfx('ertrag'))*(L.night?1.1:1);
  const rev=served*L.dist*rate*prem;
  const need=Math.max(0.45,L.minLoad);
  const km=Math.min(nb*a.speed*24*0.85,served/(a.seats*need)*L.dist);
  const run=km*(a.ckm+L.toll*a.tollF);
  const fixed=nb*(a.wage*wageBase()*L.wm*(L.night?1.25:1)+a.ins+[0,25,60][L.svc||0]);
  return{D,served,rev,cost:run+fixed,profit:rev-run-fixed,share:shareAt(L,rate,nb),nb};
}
function optimalRate(L,step,hyp){
  let best=REF,bp=-1e12;
  for(let r=3;r<=20;r+=(step||0.5)){const f=forecast(L,r/100,hyp);if(f.profit>bp){bp=f.profit;best=r/100;}}
  return best;
}

/* ===================== Simulation ===================== */
function step(dt){
  S.t+=dt;
  if(S.owned)stepOps(dt);
  const d=Math.floor(S.t/24);
  while(S.day<d){S.day++;dayEnd();}
}
function stepOps(dt){
  S.fuelU=fuelUnit();
  for(const k of ['fuelM','snow','strike','ad','fest','econ','border','evsub'])if(S.fx[k]>0)S.fx[k]-=dt/24;
  if(S.t-S.demT>=0.5){
    for(const L of S.lines){L.D=demand(L);L.share=L.fr?0:shareAt(L,L.rate,lineBuses(L).length);}
    S.demT=S.t;
  }
  for(const L of S.lines){
    if(L.fr)continue;
    const capEnd=Math.max(12,L.D*1.2)/2;
    for(let i=0;i<2;i++){
      L.wait[i]+=L.D/2*dt/24;
      if(L.wait[i]>capEnd){const over=L.wait[i]-capEnd;L.wait[i]=capEnd;S.lostToday+=over;L.lost+=over;}
    }
  }
  for(const b of S.buses)stepBus(b,dt);
}
function stepBus(b,dt){
  if(b.state==='depot')return;
  if(b.state==='charter'){b.left-=dt;if(b.left<=0)b.state=b.prev;return;}
  const L=lineById(b.line);
  if(!L){unassign(b);return;}
  switch(b.state){
    case 'service':b.left-=dt;if(b.left<=0)b.state='wait';break;
    case 'broken':b.left-=dt;if(b.left<=0)b.state='move';break;
    case 'wait':{
      b.waited+=dt;
      if(!L.fr){
        const take=Math.min(L.wait[b.dir],b.seats-b.load);
        if(take>0){L.wait[b.dir]-=take;b.load+=take;earn(take*L.dist*L.rate*(1+0.025*tfx('ertrag'))*(L.night?1.1:1),L);L.pax+=take;L.pd+=take;}
      }
      if(tl('telematik')>=2&&b.cond<35){
        const c=repairCost(b);
        if(S.cash>c){spend('repair',c,L);b.cond=100;b.state='service';b.left=6;say(`Bus #${b.id} automatisch gewartet (${eur(c)}).`);break;}
      }
      let ready;
      const turn=(L.intl?1:0.5)+(b.drive==='electric'?0.75:0);
      if(L.fr)ready=b.waited>=turn+0.5&&eligible(b);
      else{
        const need=L.minLoad>0?Math.max(1,Math.ceil(b.seats*L.minLoad)):0;
        ready=b.waited>=turn&&(b.load>=b.seats-0.5||need===0||b.load>=need||(b.waited>=4&&b.load>=1));
      }
      if(ready&&!(S.fx.strike>0)){b.state='move';b.t=0;}
      break;}
    case 'move':{
      const sp=b.speed*(S.fx.snow>0?0.65:1)*(S.winter?0.93:1)*(b.cond<30?0.85:1);
      const km=sp*dt;
      b.t+=km/L.dist;
      if(b.drive==='electric')spend('fuel',km*b.ekm*S.energy*L.fm*(1-chargeDisc()),L);
      else{
        const lit=km*b.lkm*fuelUse();S.litToday+=lit;
        const fromTank=Math.min(S.tank.l,lit);S.tank.l-=fromTank;
        const c1=fromTank*S.tank.avg;
        if(c1>0){S.today.fuel+=c1;L.costDay+=c1;}
        spend('fuel',(lit-fromTank)*S.fuelU*L.fm,L);
      }
      spend('toll',km*L.toll*b.tollF,L);
      if(L.fr){earn(km*frRate()*L.cm*(b.cond<30?0.5:1),L);L.frKm=(L.frKm||0)+km;}
      b.cond=Math.max(0,b.cond-km*b.wear*wearF());
      S.totalKm+=km;
      const p=(0.0006+Math.pow((100-b.cond)/100,2)*0.012)*(S.fx.snow>0?2:1)*breakF()/(b.rel*b.rel);
      if(Math.random()<p*dt){
        b.state='broken';b.left=rnd(8,14);
        spend('repair',350,L);S.rep=Math.max(5,S.rep-0.6);
        say(`🔧 Panne! Bus #${b.id} (${lname(L)}) bleibt liegen. Abschleppen: ${eur(350)}.`,'bad');
        break;
      }
      if(b.t>=1){
        b.t=0;b.dir=1-b.dir;b.state='wait';b.waited=0;
        if(L.fr){const p=b.seats*0.75;S.totalPax+=p;L.pax+=p;L.pd+=p;}else S.totalPax+=b.load;
        b.load=0;
      }
      break;}
  }
}
function enforceReqs(){
  for(const b of S.buses.slice()){
    if(!b.line||b.state==='charter')continue;
    const L=lineById(b.line);
    const miss=L?busMeets(b,L):[];
    if(miss.length){unassign(b);say(`Bus #${b.id} darf nicht mehr auf ${lname(L)} fahren: ${miss.join(', ')}.`,'bad');}
  }
}
function dayEnd(){
  const mon=new Date(2025,2,3+S.day).getMonth();
  S.winter=mon===11||mon===0||mon===1;
  updateRivals();
  updateWorld();
  if(!S.owned)return;
  // Umweltzonen
  for(const [id,d] of Object.entries(ZONES)){
    if(S.day===d-30&&d>30)say(`🌱 In ${cname(id)} gilt in 30 Tagen eine Umweltzone: Diesel-Busse dürfen dann nicht mehr hinein.`,'bad');
    if(S.day===d&&d>0){say(`🌱 Umweltzone ${cname(id)} ist jetzt aktiv.`,'bad');enforceReqs();}
  }
  for(const b of S.buses){
    const L=lineById(b.line);
    b.age++;
    spend('wage',busWage(b,L),L);
    spend('ins',b.list*0.0004,L);
    if(L&&L.svc)spend('other',[0,25,60][L.svc],L);
  }
  spend('depot',rentDay(),null);
  if(S.loan>0)spend('interest',S.loan*0.09/365,null);
  if(S.cash<0)spend('interest',-S.cash*0.0006,null);
  S.litHist.push(S.litToday);if(S.litHist.length>30)S.litHist.shift();S.litToday=0;
  const fd=S.fuelDeal;
  if(fd.bonusLeft>0)fd.bonusLeft--;
  if(fd.cool>0)fd.cool--;
  autoFuel();
  if(fd.lock){fd.lock.left--;if(fd.lock.left<=0){fd.lock=null;say('⛽ Dein Festpreis-Vertrag für Diesel ist ausgelaufen.');}}
  for(const L of S.lines){
    L.h.push(L.revDay-L.costDay);if(L.h.length>7)L.h.shift();
    L.ph.push(L.pd);if(L.ph.length>7)L.ph.shift();
    L.revDay=0;L.costDay=0;L.pd=0;
    if(L.excl>0)L.excl--;
    if(L.fr)frDay(L);
    else{
      L.comps=compsOf(L);
      if(L.auto&&tl('ertrag')>=1)L.rate=Math.round(optimalRate(L,1)*200)/200;
    }
  }
  S.lines.filter(L=>L.fr&&L.fr.dead).forEach(endContract);
  copycats();
  // Ruf
  const act=S.buses.filter(b=>b.line);
  if(act.length){
    const free=S.lines.filter(L=>!L.fr&&lineBuses(L).length);
    const sumD=S.lines.reduce((s,L)=>s+L.D,0)||1;
    const lostR=S.lostToday/sumD;
    const cAvg=avg(act.map(comfort));
    const condAvg=avg(act.map(b=>b.cond));
    const rr=avg(free.map(L=>L.rate/(L.comps.length?avg(L.comps.map(c=>c.price)):REF*L.cm)))||1;
    const target=35+cAvg*5+2*tfx('crm')+prestigeBonus()-clamp(lostR*40,0,25)-(condAvg<50?(50-condAvg)*0.4:0)-Math.max(0,rr-1.2)*20;
    S.rep=clamp(S.rep+(clamp(target,5,100)-S.rep)*0.06,5,100);
  }
  S.lostToday=0;
  S.fuel=clamp(S.fuel+(1.6-S.fuel)*0.05+rnd(-0.08,0.08),1.2,2.4);
  S.energy=clamp(S.energy+(0.22-S.energy)*0.05+rnd(-0.01,0.01),0.15,0.35);
  S.week.push(S.today);if(S.week.length>7)S.week.shift();
  S.hist.push(Math.round(companyValue()));if(S.hist.length>400)S.hist.shift();
  S.today=zero();
  if(S.day%7===0)for(const L of S.lines)L.lost=0;
  if(S.day-S.partner.gen>=14||!S.partner.offers.length)genPartnerOffers();
  if(S.day-S.usedGen>=10)genUsed();
  S.negDays=S.cash<-25000?S.negDays+1:0;
  if(S.negDays===1)say('⚠ Kasse stark im Minus! Verkaufe Busse oder nimm einen Kredit auf.','bad');
  rollEvent();
  checkAch();
  if(S.negDays>=10&&!S.over){S.over=true;showOver();}
  if(S.day%5===0)save();
}
/* Nachahmer: Rivalen kopieren profitable Linien */
function copycats(){
  for(const L of S.lines){
    if(L.fr||L.excl>0)continue;
    const p=L.h.length?avg(L.h):0;
    if(p>400&&L.comps.length<3&&Math.random()<0.012*Math.min(3,p/600)){
      const have=new Set(L.comps.map(c=>c.r));
      const cands=S.rivals.filter(r=>r.alive&&!have.has(r.id));
      if(!cands.length)continue;
      const r=pick(cands);
      const city=pick([L.a,L.b]);
      if(!r.cities.includes(city))r.cities.push(city);
      L.comps=compsOf(L);S.demT=-99;
      say(`⚔ ${r.name} kopiert deine erfolgreiche Linie ${lname(L)}.`,'bad');
    }
  }
}
/* Rivalen */
function updateRivals(){
  for(const r of S.rivals){
    if(!r.alive)continue;
    const sh=S.owned?regionShare(r.home):0;
    const P=r.fleet*180*(r.eff||0.6)*(1+0.05*Math.min(10,r.tech))*(1-Math.min(0.6,sh*0.8));
    const sat=Math.pow(1+r.value/6e6,-0.7);
    r.value=Math.max(55000,r.value+P*0.8*sat+r.value*rnd(-0.0012,0.0012));
    r.fleet=Math.max(2,Math.round(r.value/55000));
    r.tech+=0.0035*Math.sqrt(1+r.value/5e5);
    if(r.war>0)r.war--;
    else if(S.owned&&Math.random()<0.004*r.agg&&sh>0.15){r.war=15;say(`⚔ ${r.name} startet eine Preisaktion in ihrer Heimat.`,'bad');}
    // Expansion
    if(Math.random()<0.012*Math.sqrt(1+r.value/1e6)*(r.net?2.5:1)){
      const c=nearest(pick(r.cities),6).find(id=>!r.cities.includes(id));
      if(c){r.cities.push(c);}
    }
    if(r.value<=62000&&Math.random()<0.1){
      r.alive=false;
      if(S.owned)say(`📉 ${r.name} hat aufgegeben.`);
      delete S.inv.stakes[r.id];
    }
  }
  const alive=S.rivals.filter(r=>r.alive);
  // Fusionen
  if(S.day>0&&S.day%45===0){
    const sorted=alive.slice().sort((a,b)=>b.value-a.value);
    const big=sorted[0];
    if(big&&big.value>1.2e6){
      const prey=sorted.slice(1).filter(r=>r.value<big.value*0.5&&!r.net).sort(()=>Math.random()-0.5)[0];
      if(prey){
        big.value+=prey.value*0.85;prey.cities.forEach(c=>{if(!big.cities.includes(c))big.cities.push(c);});big.tech=Math.max(big.tech,prey.tech);
        prey.alive=false;
        const stake=S.inv.stakes[prey.id];if(stake){S.wealth+=stake*prey.value;delete S.inv.stakes[prey.id];}
        if(S.owned)say(`🏢 Fusion: ${big.name} übernimmt ${prey.name} und wächst auf ${eurK(big.value)}.`,'bad');
      }
    }
  }
  // Neugründungen halten den Markt lebendig
  if(alive.length<16||(S.day%90===0&&Math.random()<0.5)){
    const c=pick(CITIES);
    const r=mkRival(Math.max(...S.rivals.map(x=>x.id))+1,pick(NEW_RIVAL_NAMES)+' '+pick(['GmbH','S.A.','S.r.l.','B.V.']),c.id,false);
    S.rivals.push(r);
    if(S.owned)say(`🆕 Neuer Anbieter am Markt: ${r.name} (${c.name}).`);
  }
}

  }
}

/* ===================== Partnerprogramm ===================== */
function partnerLevel(){let l=1;FR_LEVELS.forEach((v,i)=>{if(S.partner.pts>=v)l=i+1;});return l;}
function genPartnerOffers(){
  S.partner.gen=S.day;
  const lvl=partnerLevel(),out=[];
  const lic=CITIES.filter(c=>S.lic.includes(c.c)).map(c=>c.id);
  const pairs=[];
  for(let i=0;i<lic.length;i++)for(let j=i+1;j<lic.length;j++){
    const a=lic[i],b=lic[j];
    if(S.lines.some(l=>(l.a===a&&l.b===b)||(l.a===b&&l.b===a)))continue;
    const g=lineGeo(a,b);
    if(g.dist>=180&&g.dist<=1500)pairs.push({a,b,dist:g.dist});
  }
  pairs.sort(()=>Math.random()-0.5);
  for(const p of pairs.slice(0,3))out.push({...p,minBuses:2+(lvl>=3?1:0),term:60,lvlReq:Math.min(5,lvl+(Math.random()<0.3?1:0))});
  S.partner.offers=out;
}
function acceptOffer(i){
  const o=S.partner.offers[i];if(!o)return;
  if(o.lvlReq>partnerLevel())return say(`Dieser Vertrag erfordert Partnerstufe ${o.lvlReq}.`,'bad');
  if(S.lines.some(l=>(l.a===o.a&&l.b===o.b)||(l.a===o.b&&l.b===o.a))){S.partner.offers.splice(i,1);return;}
  const L=lineDefaults(o.a,o.b);
  L.fr={minBuses:o.minBuses,term:o.term,rating:75,low:0,missDays:0};
  S.lines.push(L);S.partner.offers.splice(i,1);
  ui.selLine=L.id;ui.tab='lines';S.demT=-99;
  say(`🤝 Partnervertrag mit Fernflix: ${lname(L)}. Weise mindestens ${o.minBuses} Reisebusse mit Toilette, Klima und WLAN zu.`,'good');
}
function frDay(L){
  const f=L.fr,bs=lineBuses(L),el=bs.filter(eligible);
  const miss=Math.max(0,f.minBuses-el.length);
  if(miss>0){spend('other',250*miss,L);f.missDays++;if(f.missDays%5===1)say(`⚠ Partnerlinie ${lname(L)}: ${miss} Reisebus(se) fehlen (250 € Vertragsstrafe je Tag).`,'bad');}
  if(bs.length)f.rating=f.rating*0.9+(avg(bs.map(b=>b.cond))*0.6+S.rep*0.4)*0.1;
  S.partner.pts+=(L.frKm||0)/1000*(f.rating>=70?1:0.5);L.frKm=0;
  f.low=f.rating<45?f.low+1:0;f.term--;
  if(f.low>=5){f.dead='Mangelnde Qualität';}
  else if(f.term<=0){
    if(f.rating>=60){f.term=60;say(`🤝 Vertrag ${lname(L)} wurde automatisch um 60 Tage verlängert.`,'good');}
    else f.dead='Vertrag ausgelaufen';
  }
}
function endContract(L){
  const why=L.fr.dead;
  L.fr=null;L.comps=compsOf(L);L.rate=REF*L.cm;S.rep=Math.max(5,S.rep-(why==='Vertrag ausgelaufen'?0:3));S.demT=-99;
  say(`🤝 Partnervertrag ${lname(L)} beendet (${why}). Die Linie läuft jetzt auf eigene Rechnung.`,'bad');
  enforceReqs();
}

  else if(ev==='crisis'){S.fx.econ=30;S.fx.econV=-0.2;S.demT=-99;say('📉 Wirtschaftskrise: 30 Tage lang −20 % Nachfrage.','bad');}
  else if(ev==='border'){S.fx.border=10;S.demT=-99;say('🛂 Verschärfte Grenzkontrollen: 10 Tage lang weniger Fahrgäste auf internationalen Linien.','bad');}

  else if(ev==='sub'){if(S.rep>=40){earn(8000);say('🏛 Förderprogramm für ÖPNV: +'+eur(8000)+' Zuschuss.','good');}}
  else if(ev==='strike'&&S.buses.length>=2){
    const cost=Math.max(2500,300*S.buses.length);
    modal('✊ Fahrerstreik!','Die Fahrer fordern höhere Löhne. Zahlst du einen Bonus oder lässt du es auf einen Streik ankommen?',[
      {label:`Bonus zahlen (${eur(cost)})`,cls:'pri',fn:()=>{spend('other',cost);say('Streik abgewendet.');}},
      {label:'Hart bleiben',fn:()=>{S.fx.strike=3;S.rep=Math.max(5,S.rep-4);say('✊ Streik! Keine Abfahrten für 3 Tage.','bad');}}]);
  }
  else if(ev==='charter'){
    const cand=S.buses.filter(b=>b.seats>=40&&['depot','wait'].includes(b.state));
    if(!cand.length)return;
    const b=pick(cand),pay=Math.round(rnd(3500,6500)/50)*50;
    modal('🚌 Charter-Anfrage',`Ein Reiseveranstalter möchte Bus #${b.id} (${busName(b)}) für 3 Tage mieten und zahlt ${eur(pay)}.`,[
      {label:'Annehmen',cls:'pri',fn:()=>{b.prev=b.state;b.state='charter';b.left=72;earn(pay);say(`Charter angenommen: +${eur(pay)}.`,'good');}},
      {label:'Ablehnen',fn:()=>{}}]);
  }
  else if(ev==='comp'){
    const ls=S.lines.filter(L=>!L.fr&&L.comps.length&&lineBuses(L).length);
    if(!ls.length)return;
    const L=pick(ls),c0=L.comps.filter(x=>(S.inv.stakes[x.r]||0)<0.25);
    if(!c0.length)return;
    const c=pick(c0),r=rivalById(c.r);
    modal('⚔ Preisaktion',`${r.name} startet auf ${lname(L)} eine Preisaktion (−25 %) für 15 Tage. Ohne Reaktion verlierst du Fahrgäste an den Konkurrenten.`,[
      {label:'Eigenen Preis um 15 % senken',cls:'pri',fn:()=>{r.war=15;L.rate=clamp(L.rate*0.85,PMIN,PMAX);L.comps=compsOf(L);S.demT=-99;say(`Preis auf ${lname(L)} gesenkt.`);}},
      {label:'Ignorieren',fn:()=>{r.war=15;L.comps=compsOf(L);S.demT=-99;say(`${r.name} unterbietet dich auf ${lname(L)}.`,'bad');}}]);
  }
  else if(ev==='entry'){
    const ls=S.lines.filter(L=>!L.fr&&L.comps.length<3&&lineBuses(L).length&&L.excl<=0);
    if(!ls.length)return;
    const L=pick(ls);
    const have=new Set(L.comps.map(c=>c.r));

    if(!r)return;
    r.cities.push(pick([L.a,L.b]));L.comps=compsOf(L);S.demT=-99;
    say(`⚔ ${r.name} fährt jetzt auch auf ${lname(L)}.`,'bad');
  }
}

const volDiscBrand=br=>{const n=S.bought[br]||0;return n>=100?.18:n>=50?.14:n>=25?.10:n>=10?.06:n>=5?.03:0;};
const qtyDisc=q=>q>=25?.08:q>=10?.05:q>=5?.03:0;
const buyDisc=(br,q)=>br==='own'?0:Math.min(0.35,volDiscBrand(br)+qtyDisc(q)+0.01*tfx('einkauf'));
function unitPrice(sp,q){
  const st=bStats(sp);
  let p=st.list*(1-buyDisc(sp.brand,q));
  if(sp.drive==='electric'&&S.fx.evsub>0)p*=0.8;
  return Math.round(p);
}
function cfgSpec(){const c=ui.cfg;return{cls:c.cls,brand:c.brand,drive:c.drive,feat:c.feat,design:c.brand==='own'?c.design:null,color:c.color};}
function brandOk(br,cls){
  if(br==='own')return S.designs.some(d=>d.cls===cls);
  const B=BRANDS[br];return !B.only||B.only.includes(cls);
}
function cfgFix(){
  const c=ui.cfg;
  if(!brandOk(c.brand,c.cls))c.brand=Object.keys(BRANDS).find(b=>brandOk(b,c.cls));
  if(c.brand==='own'){const d=S.designs.find(x=>x.cls===c.cls&&x.id===c.design)||S.designs.find(x=>x.cls===c.cls);c.design=d?d.id:null;}
  c.feat=c.feat.filter(k=>FEAT[k]);
}
function buyBuses(){
  cfgFix();
  const sp=cfgSpec(),q=ui.cfg.qty;

  if(S.buses.length+q>cap())return say(`Nur ${Math.max(0,cap()-S.buses.length)} Stellplätze frei – baue die Bushalle aus (Reiter Standorte).`,'bad');
  const up=unitPrice(sp,q);
  if(S.cash<up*q)return say('Nicht genug Geld.','bad');
  S.cash-=up*q;

  else S.bought[sp.brand]=(S.bought[sp.brand]||0)+q;
  let last;
  for(let i=0;i<q;i++){last=newBus(sp,{paid:up});S.buses.push(last);}
  say(`${q}× ${busName(last)} gekauft (${eur(up*q)}, ${eur(up)} je Bus).`,'good');
}

function suggestLines(budget){
  const lic=CITIES.filter(c=>S.lic.includes(c.c));
  const cand=[];
  for(let i=0;i<lic.length;i++)for(let j=i+1;j<lic.length;j++){
    const a=lic[i].id,b=lic[j].id;
    if(S.lines.some(l=>(l.a===a&&l.b===b)||(l.a===b&&l.b===a)))continue;
    const L=lineDefaults(a,b);S.nid--;
    if(L.dist<60||L.dist>1800)continue;
    cand.push({a,b,L,m:marketBase(L)});
  }
  cand.sort((x,y)=>y.m-x.m);

function takeover(id){
  const r=rivalById(id);if(!r||!r.alive)return;
  if(r.net||r.value>S.cash/1.15&&false)return;
  const p=takeoverPrice(r);
  if(S.cash<p)return say(`Die Übernahme kostet ${eur(p)}.`,'bad');
  if(r.value>Math.max(1e6,companyValue()*1.5))return say('Der Rivale ist zu groß für eine Übernahme.','bad');
  S.cash-=p;
  const n=Math.min(Math.floor(r.fleet*0.7),Math.max(0,cap()-S.buses.length),12);
  for(let i=0;i<n;i++){
    const cls=pick(['mini','midi','bus','bus','coach']);
    const brands=Object.keys(BRANDS).filter(b=>brandOk(b,cls)&&b!=='voltra');
    S.buses.push(newBus({cls,brand:pick(brands),drive:'diesel',feat:['wc','klima','rampe'].filter(()=>Math.random()<0.6),color:pick(SWATCH)},{cond:rnd(50,90),age:Math.floor(rnd(300,1800))}));
  }
  const stake=S.inv.stakes[r.id];if(stake){S.wealth+=stake*r.value;delete S.inv.stakes[r.id];}
  r.alive=false;S.rep=Math.min(100,S.rep+2);S.ach.takeover=S.day;
  S.lines.forEach(L=>{L.comps=compsOf(L);});S.demT=-99;
  say(`🦈 ${r.name} übernommen (${eur(p)}): ${n} Busse und deren Kunden gehören jetzt dir.`,'good');
}

function negotiate(){
  const fd=S.fuelDeal;

function autoSpec(L,tier){

  const brands=Object.keys(BRANDS).filter(b=>brandOk(b,cls)&&b!=='voltra');
  const feat=lineReq(L).filter(k=>k!=='komfort'||true).map(k=>k==='komfort'?'komfort':k);
  if(L.dist>=250&&Math.random()<0.5)feat.push('usb');
  let drive='diesel';
  if(zoneOn(L.a)||zoneOn(L.b))drive='hybrid';
  return{cls,brand:pick(brands),drive,feat:[...new Set(feat)],color:pick(SWATCH)};

function makeOffer(tier){
  const home=pick(CITIES);
  const radius=[320,560,900,1300][tier-1];
  const near=CITIES.filter(c=>hav(home,c)<=radius);
  const nc=[1,2,3,5][tier-1];
  const lic=[home.c];
  for(const c of near.sort((a,b)=>hav(home,a)-hav(home,b)))if(!lic.includes(c.c)&&lic.length<nc)lic.push(c.c);
  const pool=near.filter(c=>lic.includes(c.c));
  const nb=[3,6,11,18][tier-1]+Math.floor(rnd(0,3)),nl=[2,3,6,9][tier-1];
  const pairs=[];
  for(let i=0;i<pool.length;i++)for(let j=i+1;j<pool.length;j++){
    const L=lineDefaults(pool[i].id,pool[j].id);
    if(L.dist<60||L.dist>1500)continue;
    pairs.push([L,marketBase(L)]);
  }
  pairs.sort((x,y)=>y[1]-x[1]);
  const lines=pairs.slice(0,nl).map(([L])=>{L.comps=compsOf(L);L.rate=Math.round(optimalRate(L,1.5)*200)/200;return L;});
  if(!lines.length)return null;
  const buses=[];
  for(let i=0;i<nb;i++){
    const L=lines[i%lines.length];
    const b=newBus(autoSpec(L,tier),{cond:rnd(55,95),age:Math.floor(rnd(60,900)),line:L.id,state:'wait',dir:i%2});
    buses.push(b);
  }
  const g=Math.max(0,Math.ceil((nb-4)/8));
  const site=mkSite(home.id,true,0);site.hall=g;site.werk=tier>=2?1:0;
  const sites=[site];
  if(tier>=3&&pool.length>1){const c=pool.find(x=>x.id!==home.id);sites.push(mkSite(c.id,false,siteCost(c)));}
  const tech={};
  if(tier>=2)tech.app=1;if(tier>=3){tech.planung=1;tech.telematik=1;}if(tier>=4){tech.ertrag=1;tech.crm=1;}
  const rep=Math.round(rnd(40,70));
  const profit=Math.round(nb*rnd(280,420));
  const comp={name:'',hq:home.id,cash:0,loan:0,rep,lic,buses,lines,sites,tech,designs:[],bought:{},up:{}};
  const val=buses.reduce((s,b)=>s+busValue(b),0)+sites.reduce((s,x)=>s+siteVal(x),0)*0.6+lines.length*2500+rep*500+profit*200;
  return{name:pick(SELLER_NAMES),tier,profit,price:Math.round(val*rnd(0.95,1.15)/500)*500,comp};
}
function genOffers(){
  const used=new Set(),out=[];
  for(const t of [1,2,3,4]){
    let o=null,n=0;
    while(!o&&n++<6)o=makeOffer(t);
    if(!o)continue;
    let k=0;while(used.has(o.name)&&k++<12)o.name=pick(SELLER_NAMES);
    used.add(o.name);o.comp.name=o.name;out.push(o);
  }
  return out;
}

const gauss=()=>(Math.random()+Math.random()+Math.random()+Math.random()-2)/0.58;
const propFactor=cid=>clamp(0.55+cityById(cid).pop/2500,0.6,1.9);
const propPrice=(kind,cid)=>Math.round(PROPS[kind].base*propFactor(cid)*(S.landIdx[cid]||1)/1000)*1000;
const propValue=p=>p.base*((S.landIdx[p.city]||1)/p.idx0);
const luxVal=p=>Math.max(p.price*0.05,p.price*Math.pow(1+LUX[p.kind].drift,p.age/365));
const fundValue=()=>S.inv.fundUnits*S.inv.fundPrice;
const rivalById2=id=>S.rivals.find(r=>r.id===+id);
const stakesValue=()=>Object.entries(S.inv.stakes).reduce((t,[id,pc])=>t+pc*(rivalById2(id)?rivalById2(id).value:0),0);
const propsValue=()=>S.inv.props.reduce((t,p)=>t+propValue(p),0);
const luxTotal=()=>S.inv.lux.reduce((t,p)=>t+luxVal(p),0);
const investWorth=()=>fundValue()+stakesValue()+propsValue()+luxTotal();
const prestige=()=>S.inv.lux.reduce((t,p)=>t+LUX[p.kind].prestige,0);
const prestigeBonus=()=>Math.min(8,prestige()/40);
function updateWorld(){
  for(const c of CITIES){
    const old=S.landIdx[c.id]||1;
    const n=clamp(old*Math.exp((1-old)*0.02+rnd(-0.018,0.018)),0.55,2);
    S.landIdx[c.id]=n;
    const h=(S.landHist[c.id]=S.landHist[c.id]||[]);h.push(n);if(h.length>8)h.shift();
  }
  updateInvest();
}
function updateInvest(){
  const I=S.inv;
  I.fundPrice*=Math.exp(0.00025+0.011*gauss());
  I.fundHist.push(I.fundPrice);if(I.fundHist.length>120)I.fundHist.shift();
  for(const [id,pc] of Object.entries(I.stakes)){const r=rivalById2(id);if(r)S.wealth+=pc*r.value*0.00012;}
  for(const p of I.props)S.wealth+=propValue(p)*PROPS[p.kind].yld/365;
  for(const l of I.lux){
    l.age++;const up=LUX[l.kind].upkeep/365;
    if(up>0){if(S.wealth>=up)S.wealth-=up;else if(S.owned)S.cash-=up;}
  }
}
function buyFund(a){
  a=Math.min(a,S.wealth);
  if(a<1000)return say('Zu wenig Privatvermögen.','bad');
  S.wealth-=a;S.inv.fundUnits+=a/S.inv.fundPrice;say(`Fonds-Anteile für ${eur(a)} gekauft.`);
}
function sellFund(a){
  const v=fundValue();a=a==='all'?v:Math.min(+a,v);
  if(a<1)return;
  S.inv.fundUnits-=a/S.inv.fundPrice;S.wealth+=a;say(`Fonds-Anteile für ${eur(a)} verkauft.`);
}
function setStake(rid,d){
  const r=rivalById2(rid);if(!r)return;
  const cur=S.inv.stakes[rid]||0;
  if(d>0){
    const n=Math.min(0.49,Math.round((cur+d)*100)/100),dp=n-cur;
    if(dp<=0.0001)return say('Mehr als 49 % sind nicht möglich.','bad');
    const cost=dp*r.value*1.02;
    if(S.wealth<cost)return say('Dein Privatvermögen reicht dafür nicht.','bad');
    S.wealth-=cost;S.inv.stakes[rid]=n;
    say(`${num(dp*100)} % an ${r.name} gekauft (${eur(cost)}).`,'good');
  }else{
    const n=Math.max(0,Math.round((cur+d)*100)/100),dp=cur-n;
    if(dp<=0.0001)return;
    S.wealth+=dp*r.value*0.98;
    if(n<=0.0001)delete S.inv.stakes[rid];else S.inv.stakes[rid]=n;
    say(`${num(dp*100)} % an ${r.name} verkauft.`);
  }
}
function buyProp(kind,cid){

  if(S.wealth<fee)return say('Dein Privatvermögen reicht dafür nicht (inkl. 4 % Nebenkosten).','bad');

}
function sellProp(id){

function compTable(L,rate){
  const nb=Math.max(1,lineBuses(L).length);
  const a=attrUs(L,rate,nb);
  const rows=L.comps.map(c=>({name:rivalById(c.r).name,price:c.price,q:c.q,a:attrComp(c),war:rivalById(c.r).war>0,tech:c.tech}));
  const C=SUBST+rows.reduce((s,r)=>s+r.a,0),tot=a+C;
  let h=`<table><tr><th>Anbieter</th><th>Preis</th><th>Qual.</th><th>Anteil</th></tr>
   <tr class="me"><td>Du</td><td>${num(rate*100,1)} ct</td><td>${num(lineQ(L),1)}</td><td>${pct(a/tot)}</td></tr>`;
  for(const r of rows)h+=`<tr><td>${r.name}${r.war?' <span class="tag">Aktion</span>':''}<div class="mute small">Technik ${num(r.tech,1)}</div></td><td>${num(r.price*100,1)} ct</td><td>${num(r.q,1)}</td><td>${pct(r.a/tot)}</td></tr>`;
  h+=`<tr><td class="mute">Auto / Bahn</td><td class="mute">–</td><td class="mute">–</td><td class="mute">${pct(SUBST/tot)}</td></tr></table>`;
  return h;
}
function curveSvg(L){
  const pts=[];
  for(let r=3;r<=20;r++)pts.push([r,forecast(L,r/100).profit]);
  const ys=pts.map(p=>p[1]),mn=Math.min(0,...ys),mx=Math.max(0,...ys),rg=(mx-mn)||1;
  const X=r=>8+(r-3)/17*284,Y=v=>6+(1-(v-mn)/rg)*58;
  const best=pts.reduce((b,p)=>p[1]>b[1]?p:b,pts[0]);
  const cur=clamp(L.rate*100,3,20);
  const poly=pts.map(p=>`${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 300 84" width="100%" height="84" role="img" aria-label="Gewinn je Ticketpreis">
   <line x1="8" x2="292" y1="${Y(0).toFixed(1)}" y2="${Y(0).toFixed(1)}" stroke="#2a3b50" stroke-width="1"/>
   <polyline fill="none" stroke="#ffc233" stroke-width="2" points="${poly}"/>
   <circle cx="${X(best[0]).toFixed(1)}" cy="${Y(best[1]).toFixed(1)}" r="4" fill="#3ddc97"/>
   <circle cx="${X(cur).toFixed(1)}" cy="${Y(forecast(L,cur/100).profit).toFixed(1)}" r="4" fill="#ffffff"/>
   <text x="8" y="80" font-size="9" fill="#8da2b8">3 ct</text><text x="150" y="80" font-size="9" fill="#8da2b8" text-anchor="middle">11,5 ct</text><text x="292" y="80" font-size="9" fill="#8da2b8" text-anchor="end">20 ct</text>
  </svg>`;
}

  let h=`<div class="row"><b>Flotte ${S.buses.length} / ${cap()}</b><span class="mute small">Stellplätze: Reiter Standorte</span></div>
   <div class="toolbar">${chips('fleetView',[['mine','Meine Busse'],['buy','Kaufen'],['used','Gebraucht'],['own','Eigenbau']],view)}</div>`;
  if(view==='buy')return h+`<div class="card">${cfgHTML()}</div>`;
  if(view==='own')return h+designerHTML();
  if(view==='used'){
    h+=`<div class="mute small" style="margin-bottom:6px">Das Angebot wechselt alle 10 Tage. Gebrauchte sind günstig, aber oft älter und nicht so gut ausgestattet.</div>`;
    for(const u of S.used){
      const st=bStats(u.sp);
      h+=`<div class="card" style="padding:8px 10px"><div class="row" style="margin:0"><b style="color:${st.color}">${busName(st)}</b><button class="btn sm pri" data-act="buyused" data-id="${u.id}" ${S.cash<u.price||S.buses.length>=cap()?'disabled':''}>${eur(u.price)}</button></div>
       <div class="mute small">${st.seats} Plätze · Komfort ${num(st.cmf,1)} · Alter ${Math.round(u.age/365*10)/10} J. · Zustand ${u.cond} %</div>
       <div class="chips" style="margin-top:4px">${u.sp.feat.map(k=>`<span class="tag">${FEAT[k].icon} ${FEAT[k].n}</span>`).join('')||'<span class="mute small">Keine Extras</span>'}</div></div>`;
    }
    return h;
  }
  const f=ui.fleetFilter||'all',so=ui.fleetSort||'line';
  const weak=S.buses.filter(b=>b.cond<50).length;
  const lnOf=b=>b.line?lname(lineById(b.line)):'';
  const flt={all:()=>true,depot:b=>b.state==='depot',run:b=>b.state!=='depot',weak:b=>b.cond<50,broken:b=>b.state==='broken'||b.state==='service'}[f];
  const list=S.buses.filter(flt);
  list.sort(so==='cond'?(a,b)=>a.cond-b.cond:so==='id'?(a,b)=>a.id-b.id:so==='type'?(a,b)=>a.cls.localeCompare(b.cls)||a.id-b.id:(a,b)=>(a.line?0:1)-(b.line?0:1)||lnOf(a).localeCompare(lnOf(b))||a.id-b.id);
  h+=`<div class="toolbar">${chips('fleetFilter',[['all','Alle'],['run','Im Einsatz'],['depot','Im Depot'],['weak','Zustand &lt; 50 % ('+weak+')'],['broken','Panne/Werkstatt']],f)}</div>
   <div class="toolbar"><span class="mute small">Sortiert nach</span>${chips('fleetSort',[['line','Linie'],['cond','Zustand'],['type','Typ'],['id','Nr.']],so)}</div>
   <div class="toolbar"><button class="btn sm" data-act="repairall" data-lim="50" ${weak?'':'disabled'}>Alle unter 50 % reparieren</button><button class="btn sm" data-act="repairall" data-lim="80">Alle unter 80 % reparieren</button></div>`;
  if(!list.length)h+='<div class="mute small">Keine Busse für diesen Filter. Kaufe Busse im Reiter „Kaufen“ oder „Gebraucht“.</div>';
  let lastG=null;
  for(const b of list){
    if(so==='line'){const g=b.line?lname(lineById(b.line)):'Im Depot';if(g!==lastG){lastG=g;const cnt=list.filter(x=>(x.line?lname(lineById(x.line)):'Im Depot')===g).length;h+=`<div class="ghead">${g} · ${cnt}</div>`;}}
    h+=`<div class="brow ${ui.selBus===b.id?'sel':''}" data-act="selbus" data-id="${b.id}"><span style="color:${b.color}">●</span><b>#${b.id}</b><span class="n mute small">${busName(b)}${b.drive==='electric'?' ⚡':b.drive==='hybrid'?' 🌿':''}${so==='line'?'':' · '+(b.line?lnOf(b):'Depot')}</span>
      <span class="small ${b.cond<35?'bad':b.cond<60?'acc':'good'}">${Math.round(b.cond)} %</span><span title="${busStatus(b)}">${BST[b.state]}</span></div>`;
    if(ui.selBus===b.id){
      const opts=`<option value="">Depot</option>`+S.lines.map(L=>{const m=busMeets(b,L);return `<option value="${L.id}" ${b.line===L.id?'selected':''} ${m.length&&b.line!==L.id?'disabled':''}>${lname(L)}${m.length&&b.line!==L.id?' – fehlt: '+m.join(', '):''}</option>`;}).join('');
      h+=`<div class="detail"><div class="small mute" style="margin-bottom:4px">${busStatus(b)} · Alter ${b.age} Tage · ${b.seats} Plätze · Komfort ${num(comfort(b),1)}</div>
       <div class="chips" style="margin-bottom:4px">${b.feat.map(k=>`<span class="tag">${FEAT[k].icon} ${FEAT[k].n}</span>`).join('')||'<span class="mute small">Keine Extras</span>'}</div>${bar(b.cond,b.cond<35?'var(--bad)':b.cond<60?'var(--acc)':'')}
       <div class="row" style="margin-top:6px"><select data-in="assign" data-id="${b.id}" ${b.state==='charter'?'disabled':''}>${opts}</select>
       <span><button class="btn sm" data-act="repair" data-id="${b.id}" ${b.cond>=99||b.state==='move'?'disabled':''}>Reparatur ${eur(repairCost(b))}</button>
       <button class="btn sm danger" data-act="sell" data-id="${b.id}" ${b.state==='charter'?'disabled':''}>Verkauf ${eur(busValue(b))}</button></span></div></div>`;
    }
  }
  return h;
}
/* ----- Standorte ----- */
function areaEffect(a){
  const n=sumLv(a);
  return {hall:`${cap()} Busplätze gesamt`,werk:`Reparaturen −${Math.round((1-Math.pow(0.88,fxs(n)))*100)} %, Pannen −${Math.round((1-Math.pow(0.93,fxs(n)))*100)} %`,
    tank:`Speicher ${num(tankCap())} l · Dieselrabatt ${pct(stationDisc())} · Ladestrom −${Math.round(chargeDisc()*100)} %`,verw:`Nachfrage in der Stadt +${Math.min(30,3*n)} %`}[a];
}
function tabSites(){
  let h=`<div class="card"><div class="row"><b>Stellplätze ${S.buses.length} / ${cap()}</b><span class="tag">Miete ${eur(rentDay())}/Tag</span></div>
   <div class="mute small">Baue deine Standorte mit einem Klick aus. Ausbau ist unbegrenzt, jede Stufe kostet etwas mehr.</div></div>`;
  for(const s of S.sites){
    h+=`<div class="card"><div class="row"><b>${s.hq?'★ Hauptstandort':'Standort'} ${flagOf(s.city)} ${cname(s.city)}</b><span class="tag">+${Math.round(((s.hq?0.12:0.08)+Math.min(0.3,0.03*s.verw))*100)} % Nachfrage hier</span></div>`;
    for(const a of Object.keys(AREAS)){
      const A=AREAS[a],c=areaCost(a,s[a]);
      h+=`<div class="row" style="align-items:flex-start"><div style="min-width:0"><b>${A.icon} ${A.n}</b> <span class="tag">Stufe ${s[a]}</span><div class="mute small">${A.desc}</div></div>
       <button class="btn sm pri" data-act="area" data-site="${s.id}" data-a="${a}" ${S.cash<c?'disabled':''}>${eur(c)}</button></div>`;
    }
    if(!s.hq)h+=`<button class="btn sm danger" data-act="sellsite" data-id="${s.id}">Standort verkaufen (${eur(0.9*landValue(s)+0.5*(siteVal(s)-landValue(s)))})</button>`;
    h+='</div>';
  }
  h+=`<h2 class="s">Wirkung insgesamt</h2><div class="card"><table>${Object.keys(AREAS).map(a=>`<tr><td>${AREAS[a].icon} ${AREAS[a].n} (Σ ${sumLv(a)})</td><td class="small">${areaEffect(a)}</td></tr>`).join('')}</table></div>`;
  h+='<h2 class="s">Grundstücksmarkt</h2><div class="mute small" style="margin-bottom:6px">Neue Standorte in Städten deiner Lizenzländer. Die Preise schwanken täglich: kaufe günstig, verkaufe zum Marktpreis.</div>';
  const free=CITIES.filter(c=>hasLic(c.id)&&!S.sites.some(x=>x.city===c.id)).sort((a,b)=>landPrice(a)-landPrice(b));
  if(!free.length)h+='<div class="mute">In allen lizenzierten Städten hast du schon einen Standort.</div>';
  for(const c of free.slice(0,12)){
    const tr=landTrend(c.id),idx=S.landIdx[c.id]||1;
    h+=`<div class="card" style="padding:7px 10px"><div class="row" style="margin:0"><b>${c.name}</b><span class="small ${tr>=0?'bad':'good'}">${tr>=0?'▲':'▼'} ${num(Math.abs(tr)*100,1)} % (7 T)</span>
      <button class="btn sm pri" data-act="buysite" data-id="${c.id}" ${S.cash<landPrice(c)?'disabled':''}>${eur(landPrice(c))}</button></div>
      <div class="mute small">${num(c.pop)} Tsd. Einw. · Index ${num(idx*100)} %${idx<0.92?' · günstig':idx>1.15?' · teuer':''}</div></div>`;
  }
  return h;
}

function tabTech(){
  const total=Object.values(S.tech).reduce((a,b)=>a+b,0);
  const rivals=S.rivals.filter(r=>r.alive);
  const topR=rivals.slice().sort((a,b)=>b.tech-a.tech)[0];
  let h=`<div class="card"><div class="row"><b>Technik & Software</b><span class="tag">Σ Stufen ${total}</span></div>
   <div class="mute small">Investiere in Wettbewerbsvorteile. Jede Stufe wirkt, ohne Obergrenze, mit abnehmendem Zusatznutzen. Die Konkurrenz rüstet auch auf: Ø Technik der Rivalen ${num(avg(rivals.map(r=>r.tech)),1)}${topR?`, Spitze ${topR.name} (${num(topR.tech,1)})`:''}.</div></div>`;
  for(const [k,T] of Object.entries(TECH)){
    const lv=tl(k),c=techCost(k);
    h+=`<div class="card"><div class="row"><b>${T.icon} ${T.n}</b><span class="tag">Stufe ${lv}</span></div><div class="mute small">${T.desc}</div>
     <div class="row"><span class="mute small">${lv?'Aktuell Wirkung ×'+num(tfx(k),1):'Noch nicht freigeschaltet'}</span><button class="btn sm pri" data-act="tech" data-k="${k}" ${S.cash<c?'disabled':''}>${lv?'Stufe '+(lv+1):'Freischalten'} ${eur(c)}</button></div></div>`;
  }
  h+=`<h2 class="s">Entwicklung</h2><div class="card"><div class="row"><b>🏭 Konstruktionsbüro</b>${S.up.konstruktion?'<span class="good">✓ aktiv</span>':`<button class="btn sm pri" data-act="buykonst" ${S.cash<250000?'disabled':''}>${eur(250000)}</button>`}</div>
   <div class="mute small">Eigene Busmodelle entwickeln (Reiter Flotte → Eigenbau).</div></div>`;
  return h;

const cv=$('#cv'),ctx=cv.getContext('2d');
const view={W:300,H:300,dpr:1,s0:1};
const cam={x:MAP.w/2,y:MAP.h/2,k:1};
const landCv=document.createElement('canvas');
function hexA(hex,a){const n=parseInt(hex.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;}
function initLand(){
  const K=2;landCv.width=MAP.w*K;landCv.height=MAP.h*K;
  const c=landCv.getContext('2d');c.scale(K,K);
  const P=LAND.map(poly=>poly.map(([lon,lat])=>proj({lon,lat})));
  const path=()=>{c.beginPath();for(const poly of P){poly.forEach((q,i)=>i?c.lineTo(q.x,q.y):c.moveTo(q.x,q.y));c.closePath();}};
  c.save();path();c.clip();
  c.fillStyle='#223247';c.fillRect(0,0,MAP.w,MAP.h);
  const step=4,cols=Math.ceil(MAP.w/step),rows=Math.ceil(MAP.h/step),grid=new Array(cols*rows);
  for(let gy=0;gy<rows;gy++)for(let gx=0;gx<cols;gx++){
    const x=gx*step+step/2,y=gy*step+step/2;let best=1e9,bc=null;
    for(const ci of CITIES){const dx=ci.x-x,dy=ci.y-y,dd=dx*dx+dy*dy;if(dd<best){best=dd;bc=ci.c;}}
    grid[gy*cols+gx]=best<120*120?bc:null;
  }
  for(let gy=0;gy<rows;gy++)for(let gx=0;gx<cols;gx++){
    const g=grid[gy*cols+gx];if(!g)continue;
    c.fillStyle=hexA(COUNTRIES[g].col,0.24);c.fillRect(gx*step,gy*step,step,step);
  }
  c.strokeStyle='rgba(255,255,255,0.2)';c.lineWidth=0.8;c.beginPath();
  for(let gy=0;gy<rows-1;gy++)for(let gx=0;gx<cols-1;gx++){
    const g=grid[gy*cols+gx];
    const r=grid[gy*cols+gx+1],b=grid[(gy+1)*cols+gx];
    if(g!==r&&(g||r)){c.moveTo((gx+1)*step,gy*step);c.lineTo((gx+1)*step,(gy+1)*step);}
    if(g!==b&&(g||b)){c.moveTo(gx*step,(gy+1)*step);c.lineTo((gx+1)*step,(gy+1)*step);}
  }
  c.stroke();c.restore();
  path();c.strokeStyle='#5a7799';c.lineWidth=1.3;c.lineJoin='round';c.stroke();
}
const sc=()=>view.s0*cam.k;
const toWorld=(sx,sy)=>({x:(sx-view.W/2)/sc()+cam.x,y:(sy-view.H/2)/sc()+cam.y});
function clampCam(){cam.k=clamp(cam.k,1,12);cam.x=clamp(cam.x,0,MAP.w);cam.y=clamp(cam.y,0,MAP.h);}
function zoomAt(sx,sy,f){
  const w=toWorld(sx,sy);
  cam.k=clamp(cam.k*f,1,12);
  cam.x=w.x-(sx-view.W/2)/sc();cam.y=w.y-(sy-view.H/2)/sc();clampCam();
}
function focusCity(id){const c=cityById(id);if(!c)return;cam.x=c.x;cam.y=c.y;cam.k=Math.max(cam.k,2.2);clampCam();}
function resize(){
  const r=cv.getBoundingClientRect();
  view.dpr=window.devicePixelRatio||1;view.W=r.width;view.H=r.height;
  cv.width=Math.max(1,r.width*view.dpr);cv.height=Math.max(1,r.height*view.dpr);
  view.s0=Math.min(r.width/MAP.w,r.height/MAP.h)*0.98;clampCam();
}
new ResizeObserver(resize).observe(cv);
function segDist(p,a,b){
  const dx=b.x-a.x,dy=b.y-a.y,l2=dx*dx+dy*dy||1;
  const t=clamp(((p.x-a.x)*dx+(p.y-a.y)*dy)/l2,0,1);
  return Math.hypot(p.x-(a.x+dx*t),p.y-(a.y+dy*t));
}
function hitTest(p){
  const px=1/sc();
  if(S.owned)for(const b of S.buses){if(!b.line)continue;const q=busPos(b);if(q&&Math.hypot(q.x-p.x,q.y-p.y)<8*px)return{k:'bus',o:b};}
  let best=null,bd=1e9;
  for(const c of CITIES){const d=Math.hypot(c.x-p.x,c.y-p.y);if(d<16*px&&d<bd){bd=d;best=c;}}
  if(best)return{k:'city',o:best};
  if(S.owned)for(const L of S.lines)if(segDist(p,cityById(L.a),cityById(L.b))<7*px)return{k:'line',o:L};

/* Zeiger: ziehen, zoomen, tippen */
const ptrs=new Map();let gesture=null;
cv.addEventListener('pointerdown',e=>{
  cv.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY});
  gesture={moved:false,d0:null};
});
cv.addEventListener('pointermove',e=>{
  const p=ptrs.get(e.pointerId);
  if(!p){hover(e);return;}
  const prev={x:p.x,y:p.y};p.x=e.clientX;p.y=e.clientY;
  const r=cv.getBoundingClientRect();
  if(ptrs.size===1){
    if(Math.hypot(p.x-p.sx,p.y-p.sy)>6)gesture.moved=true;
    if(gesture.moved){cam.x-=(p.x-prev.x)/sc();cam.y-=(p.y-prev.y)/sc();clampCam();}
  }else if(ptrs.size===2){
    gesture.moved=true;
    const [a,b]=[...ptrs.values()];
    const d=Math.hypot(a.x-b.x,a.y-b.y);
    if(gesture.d0){zoomAt((a.x+b.x)/2-r.left,(a.y+b.y)/2-r.top,d/gesture.d0);}
    gesture.d0=d;
  }
});
function endPtr(e){
  const p=ptrs.get(e.pointerId);
  ptrs.delete(e.pointerId);
  if(gesture&&ptrs.size===0){
    if(!gesture.moved&&p&&e.type==='pointerup')mapClick(e);
    gesture=null;
  }else if(gesture)gesture.d0=null;
}
cv.addEventListener('pointerup',endPtr);cv.addEventListener('pointercancel',endPtr);
cv.addEventListener('wheel',e=>{
  e.preventDefault();

$('#zin').onclick=()=>{zoomAt(view.W/2,view.H/2,1.5);};
$('#zout').onclick=()=>{zoomAt(view.W/2,view.H/2,1/1.5);};
$('#zhome').onclick=()=>{cam.x=MAP.w/2;cam.y=MAP.h/2;cam.k=1;};
let mouse={x:0,y:0};
function hover(e){
  if(e.pointerType==='touch')return;
  const r=cv.getBoundingClientRect();
  mouse=toWorld(e.clientX-r.left,e.clientY-r.top);
  const h=hitTest(mouse),tip=$('#tip');
  cv.style.cursor=h?'pointer':'grab';
  if(!h){tip.style.display='none';return;}
  let t='';
  if(h.k==='city'){
    const c=h.o,C=COUNTRIES[c.c],own=S.owned&&S.lic.includes(c.c);
    const rv=S.rivals.filter(x=>x.alive&&x.cities.includes(c.id)).length;
    t=`<b>${C.flag} ${c.name}</b><br>${num(c.pop)} Tsd. Einwohner${c.t?' · 🏖':''}<br>${own?`Lizenz ✓${S.owned&&S.lines.length?` · Anteil ${pct(regionShare(c.id))}`:''}`:`<span class="mute">Keine Lizenz ${C.n}</span>`}<br><span class="mute">${rv} Rivalen vor Ort</span>`;
  }else if(h.k==='bus'){const b=h.o;t=`<b>#${b.id} ${busName(b)}</b><br>${busStatus(b)}<br>Zustand ${Math.round(b.cond)} %`;}
  else{const L=h.o;t=`<b>${lname(L)}</b><br>${L.dist} km · ${lineBuses(L).length} Busse<br>${L.fr?'Partnerlinie Fernflix':`Nachfrage ${num(L.D)}/Tag · Anteil ${pct(L.share)}<br>${L.comps.length} Konkurrent(en)`}`;}
  tip.innerHTML=t;tip.style.display='block';
  tip.style.left=Math.min(e.clientX-r.left+14,r.width-250)+'px';tip.style.top=(e.clientY-r.top+14)+'px';
}
cv.addEventListener('pointerleave',()=>{$('#tip').style.display='none';});
function mapClick(e){
  if(!S.owned)return;
  const r=cv.getBoundingClientRect(),p=toWorld(e.clientX-r.left,e.clientY-r.top),h=hitTest(p);
  if(!h){ui.city=null;updateHeader();return;}
  if(ui.mode==='newline'){
    if(h.k!=='city')return;
    if(!S.lic.includes(h.o.c)){buyLicenseModal(h.o.c);return;}
    if(!ui.first){ui.first=h.o.id;}
    else if(ui.first!==h.o.id){createLine(ui.first,h.o.id);ui.mode=null;ui.first=null;}

}
function drawMap(){
  ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);
  const s=sc(),k=s*view.dpr,px=1/s;
  ctx.setTransform(k,0,0,k,(view.W/2-cam.x*s)*view.dpr,(view.H/2-cam.y*s)*view.dpr);
  ctx.imageSmoothingEnabled=true;
  ctx.drawImage(landCv,0,0,MAP.w,MAP.h);
  const owned=S.owned;
  if(owned){
    for(const L of S.lines){
      const A=cityById(L.a),B=cityById(L.b);
      const n=lineBuses(L).length,p=L.h.length?avg(L.h):0;
      if(ui.selLine===L.id){ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.lineTo(B.x,B.y);ctx.strokeStyle='rgba(255,255,255,.28)';ctx.lineWidth=(6+n)*px;ctx.stroke();}
      ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.lineTo(B.x,B.y);
      ctx.strokeStyle=!n?'#7c8ea3':L.fr?'#6fa8ff':L.night?'#b78cff':(L.h.length&&p<0?'#ff6b6b':'#3ddc97');
      ctx.lineWidth=(1.6+Math.min(n,4)*0.7)*px;ctx.setLineDash(n?[]:[5*px,4*px]);ctx.stroke();ctx.setLineDash([]);
    }
    if(ui.mode==='newline'&&ui.first){
      const A=cityById(ui.first);
      ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.lineTo(mouse.x,mouse.y);
      ctx.strokeStyle='#ffc233';ctx.lineWidth=2*px;ctx.setLineDash([6*px,5*px]);ctx.stroke();ctx.setLineDash([]);
    }
  }
  const lim=cam.k<1.6?1100:cam.k<3?450:0;
  ctx.textAlign='center';
  for(const c of CITIES){
    const lic=owned&&S.lic.includes(c.c);
    const r=(2.4+Math.sqrt(c.pop)/15)*px;
    const showLabel=lic||c.pop>=lim||ui.first===c.id||ui.city===c.id;
    ctx.beginPath();ctx.arc(c.x,c.y,r,0,7);
    ctx.fillStyle=lic?'#fff':'#7d8ea3';ctx.fill();
    ctx.lineWidth=1.2*px;ctx.strokeStyle=ui.first===c.id||ui.city===c.id?'#ffc233':'#0f1720';ctx.stroke();
    if(owned&&ui.mode==='newline'&&lic){ctx.beginPath();ctx.arc(c.x,c.y,r+3*px,0,7);ctx.strokeStyle='rgba(255,194,51,.6)';ctx.lineWidth=1.5*px;ctx.stroke();}
    if(zoneOn(c.id)&&owned){ctx.beginPath();ctx.arc(c.x,c.y,r+2*px,0,7);ctx.strokeStyle='rgba(61,220,151,.9)';ctx.lineWidth=1.5*px;ctx.stroke();}
    if(showLabel){
      ctx.font=`600 ${(lic?11:10)*px}px system-ui,sans-serif`;
      ctx.fillStyle=lic?'#e8eef5':'#aab8c8';ctx.strokeStyle='rgba(10,16,24,.85)';ctx.lineWidth=3*px;
      ctx.strokeText(c.name,c.x,c.y-r-3*px);ctx.fillText(c.name,c.x,c.y-r-3*px);
    }
    if(owned){
      const st=S.sites.find(x=>x.city===c.id);
      if(st){ctx.font=`700 ${12*px}px system-ui`;ctx.textAlign='left';ctx.fillStyle=st.hq?'#ffc233':'#4da3ff';ctx.fillText(st.hq?'★':'■',c.x+r+1*px,c.y-r+3*px);ctx.textAlign='center';}
      const w=S.lines.filter(L=>!L.fr&&(L.a===c.id||L.b===c.id)).reduce((s,L)=>s+L.wait[L.a===c.id?0:1],0);
      if(w>=1&&cam.k>=1.6){ctx.font=`${10*px}px system-ui`;ctx.fillStyle=w>40?'#ff6b6b':'#ffc233';ctx.fillText('👥 '+Math.round(w),c.x,c.y+r+11*px);}
    }
  }
  const tm=performance.now()/1000;
  if(owned)for(const b of S.buses){
    if(!b.line)continue;
    const q=busPos(b);if(!q)continue;
    ctx.save();ctx.translate(q.x,q.y);
    if(b.state==='broken'){ctx.beginPath();ctx.arc(0,0,8*px,0,7);ctx.fillStyle=`rgba(255,107,107,${0.5+0.5*Math.sin(tm*8)})`;ctx.fill();}
    ctx.rotate(q.ang);
    ctx.fillStyle=b.state==='charter'?'#888':b.color;
    ctx.strokeStyle='#0f1720';ctx.lineWidth=1.2*px;
    const w=(5.5+b.seats/22)*px,hh=3.6*px;
    ctx.beginPath();ctx.roundRect(-w/2,-hh/2,w,hh,1.5*px);ctx.fill();ctx.stroke();
    ctx.restore();
  }
}
