<style>
:root{
  --bg:#f6f7fb;--card:#fff;--text:#0f172a;--muted:#64748b;--line:#e2e8f0;
  --blue:#2563eb;--blue-soft:#eaf0ff;--red:#dc2626;--red-soft:#fee2e2;--amber:#b45309;--amber-soft:#fef3c7;--green:#047857;--green-soft:#d1fae5;
  --radius:14px;--shadow:0 1px 2px rgba(15,23,42,.06),0 4px 14px rgba(15,23,42,.05);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0b1220;--card:#131c2e;--text:#e5e9f2;--muted:#94a3b8;--line:#243049;
  --blue:#6b9bff;--blue-soft:#17274a;--red:#f87171;--red-soft:#3b1717;--amber:#fbbf24;--amber-soft:#3a2c0b;--green:#34d399;--green-soft:#0d3326;--shadow:none}}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:92px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:max(14px,env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;justify-content:space-between}
h1{font-size:22px;letter-spacing:-.02em}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 0 8px;font-weight:600}
main{max-width:720px;margin:0 auto;padding:0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.item{display:flex;gap:12px;align-items:flex-start;padding:13px 14px;margin-bottom:8px;width:100%;text-align:left}
.item .t{font-weight:600}
.item .s{color:var(--muted);font-size:14px}
.check{width:24px;height:24px;flex:none;border:2px solid var(--line);border-radius:7px;margin-top:2px;display:grid;place-items:center;background:var(--card)}
.check.on{background:var(--green);border-color:var(--green);color:#fff}
.chip{display:inline-block;font-size:12.5px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--blue-soft);color:var(--blue);white-space:nowrap}
.chip.red{background:var(--red-soft);color:var(--red)}.chip.amber{background:var(--amber-soft);color:var(--amber)}.chip.green{background:var(--green-soft);color:var(--green)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border-radius:12px;font-weight:600;background:var(--blue);color:#fff;min-height:44px}
.btn.ghost{background:var(--blue-soft);color:var(--blue)}.btn.line{background:var(--card);border:1px solid var(--line);color:var(--text)}.btn.danger{background:var(--red-soft);color:var(--red)}
.btn:disabled{opacity:.55;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.empty{text-align:center;padding:36px 18px;color:var(--muted)}
.empty b{display:block;color:var(--text);font-size:18px;margin-bottom:6px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 8px max(8px,env(safe-area-inset-bottom));z-index:6}
nav button{flex:1;padding:6px 4px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;min-height:48px}
nav button.on{color:var(--blue);font-weight:700}
nav svg{width:22px;height:22px}
.scan{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:7;width:60px;height:60px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;box-shadow:0 8px 24px rgba(37,99,235,.45)}
.scan svg{width:28px;height:28px}
label.f{display:block;font-size:13px;color:var(--muted);margin:10px 0 3px;font-weight:600}
input,textarea,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);min-height:44px}
textarea{min-height:120px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:480px){.grid2{grid-template-columns:1fr}}
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;padding:0 16px 40px}
.sheet .bar{position:sticky;top:0;background:var(--bg);padding:max(14px,env(safe-area-inset-top)) 0 10px;display:flex;align-items:center;gap:10px;z-index:2}
.sheet .bar h1{flex:1;font-size:19px}
.sheet main{padding:0}
.fld{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.fld:last-child{border:0}.fld .k{color:var(--muted);font-size:13px}.fld .v{font-weight:600;word-break:break-all}
.note{font-size:13.5px;color:var(--muted);padding:10px 12px;border-radius:10px;background:var(--blue-soft);margin:10px 0}
.warn{background:var(--amber-soft);color:var(--amber)}
.thumb{width:100%;max-height:200px;object-fit:cover;border-radius:10px;margin-bottom:10px;border:1px solid var(--line)}
.cal{padding:12px}
.cal .head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal .head b{font-size:17px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.days .w{font-size:12px;color:var(--muted);padding:4px 0}
.days button{aspect-ratio:1;border-radius:10px;position:relative;font-size:15px}
.days button.today{border:1.5px solid var(--blue)}.days button.sel{background:var(--blue);color:#fff}
.days button.has::after{content:"";position:absolute;bottom:5px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--amber)}
.days button.has.late::after{background:var(--red)}.days button.sel::after{background:#fff}
.spin{width:44px;height:44px;border:4px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:r 1s linear infinite;margin:0 auto 14px}
@keyframes r{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 16px;border-radius:12px;z-index:50;font-size:14px;max-width:90%}
.seg{display:flex;background:var(--line);border-radius:12px;padding:3px;margin:2px 0 14px;gap:3px}
.seg button{flex:1;padding:9px 6px;border-radius:10px;font-weight:600;font-size:14px;color:var(--muted);min-height:40px}
.seg button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
.hide{display:none!important}

.paper{background:#fff;color:#1a1a1a;border-radius:6px;padding:22px 20px;font:14px/1.55 Georgia,"Times New Roman",serif;box-shadow:0 2px 6px rgba(0,0,0,.12),0 12px 32px rgba(0,0,0,.12);border:1px solid #e5e5e5}
.paper .abs{font-size:11px;color:#666;border-bottom:1px solid #ccc;display:inline-block;margin-bottom:12px}
.paper .dt{text-align:right;margin:6px 0 14px}.paper p{margin-bottom:10px}.paper h3{font-size:15px;margin:8px 0 10px}
.paper table{width:100%;border-collapse:collapse;margin:8px 0 12px;font-size:13.5px}.paper td{padding:3px 0;border-bottom:1px dotted #ccc}.paper td:last-child{text-align:right}
.paper mark{background:none;color:inherit;border-radius:3px;transition:background .3s,box-shadow .3s}
.paper mark.on{background:#fde68a;box-shadow:0 0 0 2px #fde68a}
.scanbar{position:relative;overflow:hidden}
.status{display:flex;align-items:center;gap:10px;padding:12px 14px;margin:14px 0}
.status .dot{width:10px;height:10px;border-radius:50%;background:var(--blue);flex:none}
.status.run .dot{animation:pulse 1s infinite}.status.done .dot{background:var(--green)}
@keyframes pulse{50%{opacity:.25}}
.brief-card{display:flex;gap:12px;align-items:center;padding:12px 14px;margin-bottom:8px}
.brief-card .ic{width:42px;height:54px;flex:none;background:#fff;border:1px solid var(--line);border-radius:4px;display:grid;place-items:center;font-size:20px}
@media print{body>*:not(#print){display:none!important}#print{display:block!important;white-space:pre-wrap;font:12pt/1.5 Georgia,serif;color:#000;padding:20mm}}
#print{display:none}
</style>

<body>
<header><h1 id="title">Heute</h1><button class="btn line" id="btnHelp" style="min-height:36px;padding:6px 12px" aria-label="Einstellungen">⚙︎ Einstellungen</button></header>
<main id="view"></main>

<button class="scan" id="scan" aria-label="Post scannen oder hochladen">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><path d="M4 12h16"/></svg>
</button>
<input type="file" id="file" accept="image/*,application/pdf" multiple class="hide">

<nav id="nav">
  <button data-tab="heute"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/></svg>Aufgaben</button>
  <button data-tab="post"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>Post</button>
  <button data-tab="kalender"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Kalender</button>
</nav>
<div id="print"></div>

<script>
/* Fristenlogik: deterministisch, ohne KI. Läuft im Browser und in Node. */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.Fristen = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  const pad = (n) => String(n).padStart(2, '0');
  const iso = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parse = (s) => {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || '');
    return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
  };
  const addDays = (d, n) => { const r = new Date(d); r.setDate(r.getDate() + n); return r; };
  const addMonths = (d, n) => {
    const r = new Date(d.getFullYear(), d.getMonth() + n, 1);
    const last = new Date(r.getFullYear(), r.getMonth() + 1, 0).getDate();
    r.setDate(Math.min(d.getDate(), last));
    return r;
  };
  // Fristende auf Samstag/Sonntag → nächster Werktag (§ 108 AO / § 193 BGB). Feiertage: siehe Hinweis in der UI.
  const nextWerktag = (d) => {
    const w = d.getDay();
    return w === 6 ? addDays(d, 2) : w === 0 ? addDays(d, 1) : d;
  };

  const REGELN = {
    // Bekanntgabe gilt 3 Tage nach Aufgabe zur Post (§ 122 Abs. 2 AO), Einspruch 1 Monat (§ 355 AO)
    einspruch_1m: { label: 'Einspruch: 1 Monat ab Bekanntgabe', bekanntgabeTage: 3, monate: 1 },
    widerspruch_1m: { label: 'Widerspruch: 1 Monat ab Bekanntgabe', bekanntgabeTage: 3, monate: 1 },
  };

  /**
   * @param {{datum?:string, frist_datum?:string, frist_regel?:string, frist_tage?:number}} f
   * @returns {{datum:string|null, quelle:'brief'|'regel'|'tage'|null, erklaerung:string}}
   */
  function berechne(f) {
    if (f.frist_datum && parse(f.frist_datum)) {
      return { datum: f.frist_datum, quelle: 'brief', erklaerung: 'Im Schreiben genannte Frist.' };
    }
    const brief = parse(f.datum);
    if (!brief) return { datum: null, quelle: null, erklaerung: 'Kein Briefdatum erkannt, Frist bitte manuell setzen.' };
    const regel = REGELN[f.frist_regel];
    if (regel) {
      const bekannt = addDays(brief, regel.bekanntgabeTage);
      const ende = nextWerktag(addMonths(bekannt, regel.monate));
      return {
        datum: iso(ende), quelle: 'regel',
        erklaerung: `${regel.label}. Briefdatum ${iso(brief)} + ${regel.bekanntgabeTage} Tage = Bekanntgabe ${iso(bekannt)}, +${regel.monate} Monat.`,
      };
    }
    if (f.frist_tage > 0) {
      const ende = nextWerktag(addDays(brief, f.frist_tage));
      return { datum: iso(ende), quelle: 'tage', erklaerung: `${f.frist_tage} Tage ab Briefdatum ${iso(brief)}.` };
    }
    return { datum: null, quelle: null, erklaerung: 'Keine Frist erkannt.' };
  }

  function tageBis(isoDatum, heute = new Date()) {
    const d = parse(isoDatum);
    if (!d) return null;
    const h = new Date(heute.getFullYear(), heute.getMonth(), heute.getDate());
    return Math.round((d - h) / 86400000);
  }

  return { berechne, tageBis, iso, parse, addDays, nextWerktag, REGELN };
});

</script>
<script>
'use strict';
/* ---------- Helfer ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const MONATE = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const fmtDatum = (iso) => { const d = Fristen.parse(iso); return d ? d.toLocaleDateString('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit', year: 'numeric' }) : '–'; };
const fmtBetrag = (n) => (n == null || n === '') ? '–' : Number(n).toLocaleString('de-DE', { style: 'currency', currency: 'EUR' });
const TYPEN = { steuerbescheid:'Steuerbescheid', mahnung:'Mahnung', rechnung:'Rechnung', vertrag:'Vertrag', kuendigung:'Kündigung', versicherung:'Versicherung', behoerde:'Behörde', bank:'Bank', sonstiges:'Sonstiges' };
const ARTEN = { zahlen:'Zahlen', antworten:'Antworten', pruefen:'Prüfen', unterschreiben:'Unterschreiben', einreichen:'Einreichen', aufbewahren:'Aufbewahren' };

/* ---------- Speicher (lokal im Browser) ---------- */
const KEY = 'postpilot.v1';
let db = { docs: [], settings: { name: '', adresse: '', email: '' } };
try { const raw = JSON.parse(localStorage.getItem(KEY) || 'null'); if (raw) db = { ...db, ...raw }; } catch (e) {}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(db)); }
  catch (e) { toast('Speicher voll – bitte alte Post löschen oder exportieren.'); }
}
function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t);
  setTimeout(() => t.remove(), 2600);
}

/* ---------- Dringlichkeit ---------- */
function dringlichkeit(isoDatum) {
  const t = Fristen.tageBis(isoDatum);
  if (t == null) return { text: 'ohne Frist', cls: '' };
  if (t < 0) return { text: `${-t} Tg. überfällig`, cls: 'red', t };
  if (t === 0) return { text: 'heute', cls: 'red', t };
  if (t <= 7) return { text: `in ${t} Tg.`, cls: 'amber', t };
  return { text: `in ${t} Tg.`, cls: '', t };
}
const allTasks = () => db.docs.flatMap((d) => d.aufgaben.map((a) => ({ a, d })));

/* ---------- Navigation ---------- */
let tab = 'heute', calMonth = new Date(), calSel = null;
function go(t) { tab = t; render(); window.scrollTo(0, 0); }
$('#nav').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) go(b.dataset.tab); });
$('#btnHelp').addEventListener('click', openSettings);
$('#scan').addEventListener('click', () => $('#file').click());
$('#file').addEventListener('change', async (e) => { const fs = [...e.target.files]; e.target.value = ''; if (fs.length) await analysiere(fs); });

function render() {
  document.querySelectorAll('#nav button').forEach((b) => b.classList.toggle('on', b.dataset.tab === tab));
  $('#title').textContent = { heute: 'Aufgaben', post: 'Post', kalender: 'Kalender' }[tab];
  const v = $('#view');
  v.innerHTML = tab === 'heute' ? viewHeute() : tab === 'post' ? viewPost() : viewKalender();
  bindView(v);
}

/* ---------- Ansicht: Aufgaben ---------- */
function taskHtml({ a, d }) {
  const u = dringlichkeit(d.frist?.datum);
  return `<div class="card item" data-doc="${d.id}">
    <span class="check ${a.erledigt ? 'on' : ''}" data-toggle="${d.id}:${a.id}" role="checkbox" aria-checked="${a.erledigt}" tabindex="0">${a.erledigt ? '✓' : ''}</span>
    <div style="flex:1;min-width:0"><div class="t" style="${a.erledigt ? 'text-decoration:line-through;color:var(--muted)' : ''}">${esc(a.titel)}</div>
    <div class="s">${esc(d.felder.absender || 'Unbekannt')} · ${esc(ARTEN[a.art] || '')}</div></div>
    <span class="chip ${u.cls}">${esc(u.text)}</span></div>`;
}
function viewHeute() {
  const offen = allTasks().filter((x) => !x.a.erledigt);
  const done = allTasks().filter((x) => x.a.erledigt).length;
  if (!db.docs.length) return emptyStart();
  const grp = { 'Überfällig': [], 'Diese Woche': [], 'Später': [], 'Ohne Frist': [] };
  offen.forEach((x) => {
    const t = Fristen.tageBis(x.d.frist?.datum);
    (t == null ? grp['Ohne Frist'] : t < 0 ? grp['Überfällig'] : t <= 7 ? grp['Diese Woche'] : grp['Später']).push(x);
  });
  Object.values(grp).forEach((l) => l.sort((p, q) => (p.d.frist?.datum || '9').localeCompare(q.d.frist?.datum || '9')));
  let h = '';
  for (const [k, l] of Object.entries(grp)) if (l.length) h += `<h2>${k} (${l.length})</h2>` + l.map(taskHtml).join('');
  if (!offen.length) h = `<div class="empty card"><b>Alles erledigt 🎉</b>Keine offenen Aufgaben. Neue Post mit dem Scan-Button hinzufügen.</div>`;
  if (done) h += `<p class="s" style="color:var(--muted);text-align:center;margin-top:14px">${done} erledigte Aufgabe${done > 1 ? 'n' : ''}</p>`;
  return h;
}
function emptyStart() {
  return `<div class="empty card" style="margin-top:16px"><b>Willkommen bei Postpilot</b>
  Foto oder PDF deiner Post hochladen – Absender, Aktenzeichen, Beträge und Fristen werden erkannt und als Aufgaben in den Kalender gelegt.
  <div class="row" style="justify-content:center;margin-top:16px"><button class="btn" id="scan2">Post scannen</button><button class="btn ghost" id="demo">Alle Demo-Daten laden</button></div></div>
  <h2>Beispielbriefe zum Ausprobieren</h2>${briefListe()}`;
}

/* ---------- Ansicht: Post ---------- */
let postSub = null; // 'meine' | 'beispiele'
function postKarte(d) {
  const u = dringlichkeit(d.frist?.datum), offen = d.aufgaben.filter((a) => !a.erledigt).length;
  return `<button class="card item" data-doc="${d.id}"><div style="flex:1;min-width:0">
      <div class="t">${esc(d.felder.absender || 'Unbekannt')}</div>
      <div class="s">${esc(d.felder.betreff || TYPEN[d.felder.typ] || '')}</div>
      <div class="row" style="margin-top:6px"><span class="chip">${esc(TYPEN[d.felder.typ] || 'Sonstiges')}</span>${d.felder.betrag != null ? `<span class="chip">${fmtBetrag(d.felder.betrag)}</span>` : ''}${d.frist?.datum ? `<span class="chip ${u.cls}">${esc(u.text)}</span>` : ''}</div></div>
      <span class="s">${offen ? offen + ' offen' : '✓'}</span></button>`;
}
function viewPost() {
  const sub = postSub || (db.docs.length ? 'meine' : 'beispiele');
  const seg = `<div class="seg" role="tablist"><button role="tab" aria-selected="${sub === 'meine'}" class="${sub === 'meine' ? 'on' : ''}" data-sub="meine">Meine Post (${db.docs.length})</button><button role="tab" aria-selected="${sub === 'beispiele'}" class="${sub === 'beispiele' ? 'on' : ''}" data-sub="beispiele">Beispielbriefe</button></div>`;
  if (sub === 'beispiele') return seg + `<p class="note">Öffne einen Brief und lass ihn auslesen. Danach landet er unter „Meine Post".</p>` + briefListe();
  if (!db.docs.length) return seg + `<div class="empty card"><b>Noch keine Post</b>Scanne einen Brief mit dem blauen Button oder probiere die Beispielbriefe aus.<div class="row" style="justify-content:center;margin-top:14px"><button class="btn" data-sub="beispiele">Beispielbriefe ansehen</button></div></div>`;
  return seg + [...db.docs].sort((a, b) => b.erstellt - a.erstellt).map(postKarte).join('');
}

/* ---------- Ansicht: Kalender ---------- */
function fristenNachTag() {
  const m = {};
  db.docs.forEach((d) => { if (d.frist?.datum) (m[d.frist.datum] ||= []).push(d); });
  return m;
}
function viewKalender() {
  const y = calMonth.getFullYear(), mo = calMonth.getMonth(), map = fristenNachTag();
  const first = new Date(y, mo, 1), lead = (first.getDay() + 6) % 7, days = new Date(y, mo + 1, 0).getDate();
  const heute = Fristen.iso(new Date());
  let cells = ['Mo','Di','Mi','Do','Fr','Sa','So'].map((w) => `<div class="w">${w}</div>`).join('') + '<span></span>'.repeat(lead);
  for (let i = 1; i <= days; i++) {
    const iso = `${y}-${String(mo + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
    const has = map[iso]?.some((d) => d.aufgaben.some((a) => !a.erledigt));
    cells += `<button data-day="${iso}" class="${iso === heute ? 'today' : ''} ${has ? 'has' : ''} ${has && iso < heute ? 'late' : ''} ${iso === calSel ? 'sel' : ''}">${i}</button>`;
  }
  const list = (calSel ? (map[calSel] || []).map((d) => [calSel, d]) : Object.entries(map).filter(([k]) => k >= heute).sort().flatMap(([k, ds]) => ds.map((d) => [k, d])));
  return `<div class="card cal"><div class="head"><button class="btn line" data-m="-1" aria-label="Vorheriger Monat">‹</button><b>${MONATE[mo]} ${y}</b><button class="btn line" data-m="1" aria-label="Nächster Monat">›</button></div><div class="days">${cells}</div></div>
  <h2>${calSel ? fmtDatum(calSel) : 'Anstehende Fristen'}</h2>
  ${list.length ? list.map(([k, d]) => `<button class="card item" data-doc="${d.id}"><div style="flex:1"><div class="t">${esc(d.felder.absender)}</div><div class="s">${esc(d.felder.betreff || '')}</div></div><span class="chip ${dringlichkeit(k).cls}">${esc(fmtDatum(k))}</span></button>`).join('') : '<div class="empty card">Keine Fristen.</div>'}
  <div class="row" style="margin-top:14px"><button class="btn ghost" id="icsAll">Alle Fristen in meinen Kalender (.ics)</button>${calSel ? '<button class="btn line" id="calAll">Alle anzeigen</button>' : ''}</div>
  <p class="note">Tipp: Die .ics-Datei öffnet sich in Apple, Google und Outlook Kalender und erinnert dich dort 7 und 1 Tag vorher.</p>`;
}
function bindView(v) {
  v.querySelectorAll('[data-toggle]').forEach((el) => el.addEventListener('click', (e) => {
    e.stopPropagation(); const [d, a] = el.dataset.toggle.split(':');
    const task = db.docs.find((x) => x.id === d)?.aufgaben.find((x) => x.id === a); if (task) { task.erledigt = !task.erledigt; save(); render(); }
  }));
  v.querySelectorAll('[data-doc]').forEach((el) => el.addEventListener('click', () => openDoc(el.dataset.doc)));
  v.querySelectorAll('[data-day]').forEach((el) => el.addEventListener('click', () => { calSel = calSel === el.dataset.day ? null : el.dataset.day; render(); }));
  v.querySelectorAll('[data-m]').forEach((el) => el.addEventListener('click', () => { calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + +el.dataset.m, 1); render(); }));
  $('#icsAll', v)?.addEventListener('click', () => exportIcs(db.docs.filter((d) => d.frist?.datum)));
  $('#calAll', v)?.addEventListener('click', () => { calSel = null; render(); });
  $('#scan2', v)?.addEventListener('click', () => $('#file').click());
  $('#demo', v)?.addEventListener('click', ladeDemo);
  v.querySelectorAll('[data-sub]').forEach((el) => el.addEventListener('click', () => { postSub = el.dataset.sub; render(); }));
  v.querySelectorAll('[data-brief]').forEach((el) => el.addEventListener('click', () => openBrief(+el.dataset.brief)));
}

/* ---------- Kalender-Export (.ics) ---------- */
function exportIcs(docs) {
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
  const fold = (s) => s.replace(/([,;\\])/g, '\\$1').replace(/\n/g, '\\n');
  const ev = docs.map((d) => {
    const day = d.frist.datum.replace(/-/g, ''), next = Fristen.iso(Fristen.addDays(Fristen.parse(d.frist.datum), 1)).replace(/-/g, '');
    const title = `Frist: ${d.felder.absender || 'Post'}${d.felder.betreff ? ' – ' + d.felder.betreff : ''}`;
    const desc = [d.felder.aktenzeichen && `Az: ${d.felder.aktenzeichen}`, d.felder.betrag != null && `Betrag: ${fmtBetrag(d.felder.betrag)}`, ...d.aufgaben.map((a) => `• ${a.titel}`)].filter(Boolean).join('\n');
    return ['BEGIN:VEVENT', `UID:${d.id}@postpilot`, `DTSTAMP:${stamp}`, `DTSTART;VALUE=DATE:${day}`, `DTEND;VALUE=DATE:${next}`, `SUMMARY:${fold(title)}`, `DESCRIPTION:${fold(desc)}`,
      'BEGIN:VALARM', 'TRIGGER:-P7D', 'ACTION:DISPLAY', 'DESCRIPTION:Frist in 7 Tagen', 'END:VALARM', 'BEGIN:VALARM', 'TRIGGER:-P1D', 'ACTION:DISPLAY', 'DESCRIPTION:Frist morgen', 'END:VALARM', 'END:VEVENT'].join('\r\n');
  });
  if (!ev.length) return toast('Keine Fristen vorhanden.');
  const ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Postpilot//DE', ...ev, 'END:VCALENDAR'].join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([ics], { type: 'text/calendar' })); a.download = 'postpilot-fristen.ics'; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ---------- Upload & Analyse ---------- */
function sheet(title, inner, onClose) {
  const s = document.createElement('div'); s.className = 'sheet';
  s.innerHTML = `<div class="bar"><button class="btn line" data-close aria-label="Schließen" style="min-height:40px">‹ Zurück</button><h1>${esc(title)}</h1></div><main>${inner}</main>`;
  const close = () => { s.remove(); onClose?.(); render(); };
  s.querySelector('[data-close]').addEventListener('click', close);
  document.body.appendChild(s); s.close = close; return s;
}
function toBase64(file) {
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(file); });
}
function resizeImage(file, max = 1600) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      const t = document.createElement('canvas'), kt = 360 / Math.max(img.width, img.height); t.width = Math.round(img.width * kt); t.height = Math.round(img.height * kt);
      t.getContext('2d').drawImage(img, 0, 0, t.width, t.height); URL.revokeObjectURL(url);
      res({ base64: c.toDataURL('image/jpeg', .82).split(',')[1], mime: 'image/jpeg', thumb: t.toDataURL('image/jpeg', .6) });
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Bild nicht lesbar')); };
    img.src = url;
  });
}
async function analysiere(files) {
  const s = sheet('Wird gelesen …', `<div class="empty"><div class="spin"></div><b>Schreiben wird analysiert</b>Absender, Beträge und Fristen werden erkannt.</div>`);
  try {
    const dateien = []; let thumb = null;
    for (const f of files) {
      if (f.type === 'application/pdf') {
        if (f.size > 3e6) throw new Error('PDF ist größer als 3 MB. Bitte als Foto hochladen oder komprimieren.');
        dateien.push({ mime: 'application/pdf', base64: await toBase64(f) });
      } else { const r = await resizeImage(f); dateien.push({ mime: r.mime, base64: r.base64 }); thumb ||= r.thumb; }
    }
    const r = await fetch('/api/post-analyze', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ dateien }) }).catch(() => ({ status: 503, ok: false, json: async () => ({}) }));
    const j = await r.json().catch(() => ({}));
    s.remove();
    if ([404, 501, 503].includes(r.status)) {
      toast('Demo-Modus: KI nicht verbunden – bitte Daten manuell erfassen.');
      return pruefen({ typ: 'sonstiges', absender: '', betreff: '', unsicher: ['Alles manuell erfassen (KI nicht verbunden)'] }, thumb);
    }
    if (!r.ok) throw new Error(j.error || 'Analyse fehlgeschlagen');
    pruefen(j.ergebnis, thumb);
  } catch (e) { s.remove(); toast(e.message || 'Fehler beim Lesen'); }
}

      ${fld('iban', 'IBAN')}${fld('verwendungszweck', 'Verwendungszweck')}
      <label class="f" for="f_frist">Frist</label><input id="f_frist" type="date">
      <div class="note" id="fristInfo"></div>
    </div>
    <h2>Aufgaben</h2><div id="aufg"></div>
    <div class="row"><input id="neuA" placeholder="Aufgabe hinzufügen …" style="flex:1"><button class="btn ghost" id="addA">+</button></div>
    <div class="row" style="margin-top:20px"><button class="btn" id="ok" style="flex:1">Speichern</button></div>`);
  const val = (k) => $(`#f_${k}`, s).value.trim() || null;
  let fristManuell = false;
  const calc = () => {
    const b = Fristen.berechne({ datum: val('datum'), frist_datum: erg.frist_datum, frist_regel: erg.frist_regel, frist_tage: erg.frist_tage });
    if (!fristManuell) $('#f_frist', s).value = b.datum || '';
    $('#fristInfo', s).textContent = fristManuell ? 'Manuell gesetzt.' : b.erklaerung + (b.datum ? ' Feiertage werden nicht berücksichtigt – bitte bei Bedarf prüfen. Keine Rechtsberatung.' : '');
  };
  $('#f_frist', s).addEventListener('input', () => { fristManuell = true; calc(); });
  $('#f_datum', s).addEventListener('input', calc);
  const drawA = () => {
    $('#aufg', s).innerHTML = aufgaben.map((a, i) => `<div class="card item" style="align-items:center"><div style="flex:1">${esc(a.titel)} <span class="chip">${esc(ARTEN[a.art] || 'Aufgabe')}</span></div><button data-rm="${i}" class="btn line" style="min-height:36px;padding:4px 10px" aria-label="Entfernen">✕</button></div>`).join('') || '<p class="s" style="color:var(--muted)">Keine Aufgaben.</p>';

  $('#ok', s).addEventListener('click', () => {
    const felder = { typ: $('#f_typ', s).value, absender: val('absender'), betreff: val('betreff'), datum: val('datum'), aktenzeichen: val('aktenzeichen'), kundennummer: val('kundennummer'), betrag: val('betrag') != null ? Number(val('betrag')) : null, iban: val('iban'), verwendungszweck: val('verwendungszweck'), steuernummer: f.steuernummer || null, rechnungsnummer: f.rechnungsnummer || null, absender_adresse: f.absender_adresse || null };

  });
  drawA(); calc();
}

function briefListe() {
  return beispielBriefe().map((b, i) => `<div class="card brief-card"><div class="ic">${b.icon}</div><div style="flex:1;min-width:0"><div class="t" style="font-weight:600">${esc(b.titel)}</div><div class="s" style="color:var(--muted);font-size:14px">${esc(b.sub)}</div></div><button class="btn" data-brief="${i}" style="min-height:40px;padding:8px 14px">Brief öffnen</button></div>`).join('');
}
function openBrief(i) {
  const b = beispielBriefe()[i];
  const s = sheet(b.titel, `<div class="paper">${b.html}</div>
    <div class="card status" id="st"><span class="dot"></span><span id="stt">Brief liegt bereit. Tippe auf „Auslesen“.</span></div>
    <div class="row"><button class="btn" id="go" style="flex:1">Brief auslesen</button></div>`);
  const marks = [...s.querySelectorAll('mark')], st = $('#st', s), stt = $('#stt', s), go = $('#go', s);
  let running = false, fertig = false;
  go.addEventListener('click', async () => {
    if (fertig) { s.remove(); return pruefen(b.erg, null); }
    if (running) return; running = true; go.disabled = true; st.className = 'card status run';
    for (const m of marks) { m.classList.add('on'); stt.textContent = `Erkannt: ${m.dataset.l}`; m.scrollIntoView({ block: 'center', behavior: 'smooth' }); await new Promise((r) => setTimeout(r, 650)); }
    const fr = Fristen.berechne({ datum: b.erg.datum, frist_datum: b.erg.frist_datum, frist_regel: b.erg.frist_regel, frist_tage: b.erg.frist_tage });
    stt.textContent = `Fertig: ${marks.length} Felder erkannt${fr.datum ? ', Frist ' + fmtDatum(fr.datum) : ''}.`; st.className = 'card status done';
    go.disabled = false; go.textContent = 'Vorschläge ansehen →'; fertig = true; running = false; go.scrollIntoView({ block: 'center', behavior: 'smooth' });
  });
}
