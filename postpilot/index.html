<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>Postpilot – Post rein, Fristen raus</title>
<meta name="description" content="Post scannen, Fristen automatisch erkennen, Aufgaben und Antworten erledigen.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563eb'/%3E%3Cpath d='M7 11h18v11H7z M7 11l9 7 9-7' fill='none' stroke='white' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f6f7fb;--card:#fff;--text:#0f172a;--muted:#64748b;--line:#e2e8f0;
  --blue:#2563eb;--blue-soft:#eaf0ff;--red:#dc2626;--red-soft:#fee2e2;--amber:#b45309;--amber-soft:#fef3c7;--green:#047857;--green-soft:#d1fae5;
  --radius:14px;--shadow:0 1px 2px rgba(15,23,42,.06),0 4px 14px rgba(15,23,42,.05);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0b1220;--card:#131c2e;--text:#e5e9f2;--muted:#94a3b8;--line:#243049;
  --blue:#6b9bff;--blue-soft:#17274a;--red:#f87171;--red-soft:#3b1717;--amber:#fbbf24;--amber-soft:#3a2c0b;--green:#34d399;--green-soft:#0d3326;--shadow:none}}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:92px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:max(14px,env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;justify-content:space-between}
h1{font-size:22px;letter-spacing:-.02em}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 0 8px;font-weight:600}
main{max-width:720px;margin:0 auto;padding:0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.item{display:flex;gap:12px;align-items:flex-start;padding:13px 14px;margin-bottom:8px;width:100%;text-align:left}
.item .t{font-weight:600}
.item .s{color:var(--muted);font-size:14px}
.check{width:24px;height:24px;flex:none;border:2px solid var(--line);border-radius:7px;margin-top:2px;display:grid;place-items:center;background:var(--card)}
.check.on{background:var(--green);border-color:var(--green);color:#fff}
.chip{display:inline-block;font-size:12.5px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--blue-soft);color:var(--blue);white-space:nowrap}
.chip.red{background:var(--red-soft);color:var(--red)}.chip.amber{background:var(--amber-soft);color:var(--amber)}.chip.green{background:var(--green-soft);color:var(--green)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border-radius:12px;font-weight:600;background:var(--blue);color:#fff;min-height:44px}
.btn.ghost{background:var(--blue-soft);color:var(--blue)}.btn.line{background:var(--card);border:1px solid var(--line);color:var(--text)}.btn.danger{background:var(--red-soft);color:var(--red)}
.btn:disabled{opacity:.55;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.empty{text-align:center;padding:36px 18px;color:var(--muted)}
.empty b{display:block;color:var(--text);font-size:18px;margin-bottom:6px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 8px max(8px,env(safe-area-inset-bottom));z-index:6}
nav button{flex:1;padding:6px 4px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;min-height:48px}
nav button.on{color:var(--blue);font-weight:700}
nav svg{width:22px;height:22px}
.scan{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:7;width:60px;height:60px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;box-shadow:0 8px 24px rgba(37,99,235,.45)}
.scan svg{width:28px;height:28px}
label.f{display:block;font-size:13px;color:var(--muted);margin:10px 0 3px;font-weight:600}
input,textarea,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);min-height:44px}
textarea{min-height:120px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:480px){.grid2{grid-template-columns:1fr}}
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;padding:0 16px 40px}
.sheet .bar{position:sticky;top:0;background:var(--bg);padding:max(14px,env(safe-area-inset-top)) 0 10px;display:flex;align-items:center;gap:10px;z-index:2}
.sheet .bar h1{flex:1;font-size:19px}
.sheet main{padding:0}
.fld{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.fld:last-child{border:0}.fld .k{color:var(--muted);font-size:13px}.fld .v{font-weight:600;word-break:break-all}
.note{font-size:13.5px;color:var(--muted);padding:10px 12px;border-radius:10px;background:var(--blue-soft);margin:10px 0}
.warn{background:var(--amber-soft);color:var(--amber)}
.thumb{width:100%;max-height:200px;object-fit:cover;border-radius:10px;margin-bottom:10px;border:1px solid var(--line)}
.spin{width:44px;height:44px;border:4px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:r 1s linear infinite;margin:0 auto 14px}
@keyframes r{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;width:max-content;max-width:min(92vw,420px);bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 16px;border-radius:12px;z-index:50;font-size:14px;max-width:90%}
.seg{display:flex;background:var(--line);border-radius:12px;padding:3px;margin:2px 0 14px;gap:3px}
.seg button{flex:1;padding:9px 6px;border-radius:10px;font-weight:600;font-size:14px;color:var(--muted);min-height:40px}
.seg button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
.toast{display:flex;align-items:center;gap:12px}
.toast button{font-weight:700;color:inherit;text-decoration:underline;min-height:32px;padding:0 4px}
.task{padding:14px;margin-bottom:10px}
.task .tt{cursor:pointer}.task .tt .t{font-size:17px;line-height:1.3}
.task .row{margin-top:12px}.task .btn{flex:1}
.frage{background:var(--amber-soft);border-color:transparent;padding:13px 14px;margin-bottom:8px}
.frage .t{font-weight:600}.frage .row{margin-top:10px}.frage .btn{flex:1;min-height:40px;padding:8px 12px}
.more summary{cursor:pointer;color:var(--muted);font-weight:600;padding:10px 2px;list-style:none}
.more summary::-webkit-details-marker{display:none}
.big{width:100%;justify-content:flex-start;text-align:left;margin-bottom:8px;min-height:52px}
.sum{display:grid;gap:0}.sum .fld{cursor:default}
.hide{display:none!important}

.paper{background:#fff;color:#1a1a1a;border-radius:6px;padding:22px 20px;font:14px/1.55 Georgia,"Times New Roman",serif;box-shadow:0 2px 6px rgba(0,0,0,.12),0 12px 32px rgba(0,0,0,.12);border:1px solid #e5e5e5}
.paper .abs{font-size:11px;color:#666;border-bottom:1px solid #ccc;display:inline-block;margin-bottom:12px}
.paper .dt{text-align:right;margin:6px 0 14px}.paper p{margin-bottom:10px}.paper h3{font-size:15px;margin:8px 0 10px}
.paper table{width:100%;border-collapse:collapse;margin:8px 0 12px;font-size:13.5px}.paper td{padding:3px 0;border-bottom:1px dotted #ccc}.paper td:last-child{text-align:right}
.paper mark{background:none;color:inherit;border-radius:3px;transition:background .3s,box-shadow .3s}
.paper mark.on{background:#fde68a;box-shadow:0 0 0 2px #fde68a}
.scanbar{position:relative;overflow:hidden}
.status{display:flex;align-items:center;gap:10px;padding:12px 14px;margin:14px 0}
.status .dot{width:10px;height:10px;border-radius:50%;background:var(--blue);flex:none}
.status.run .dot{animation:pulse 1s infinite}.status.done .dot{background:var(--green)}
@keyframes pulse{50%{opacity:.25}}
.brief-card{display:flex;gap:12px;align-items:center;padding:12px 14px;margin-bottom:8px}
.brief-card .ic{width:42px;height:54px;flex:none;background:#fff;border:1px solid var(--line);border-radius:4px;display:grid;place-items:center;font-size:20px}
</style>
</head>
<body>
<header><h1 id="title">Heute</h1><button class="btn line" id="btnHelp" style="min-height:36px;padding:6px 12px" aria-label="Einstellungen">⚙︎ Einstellungen</button></header>
<main id="view"></main>

<button class="scan" id="scan" aria-label="Post scannen oder hochladen">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><path d="M4 12h16"/></svg>
</button>
<input type="file" id="file" accept="image/*,application/pdf" multiple class="hide">

<nav id="nav">
  <button data-tab="heute"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/></svg>Aufgaben</button>
  <button data-tab="post"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>Post</button>
</nav>

<script src="fristen.js"></script>
<script>
'use strict';
/* ---------- Helfer ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const MONATE = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const fmtDatum = (iso) => { const d = Fristen.parse(iso); return d ? d.toLocaleDateString('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit', year: 'numeric' }) : '–'; };
const fmtBetrag = (n) => (n == null || n === '') ? '–' : Number(n).toLocaleString('de-DE', { style: 'currency', currency: 'EUR' });
const TYPEN = { steuerbescheid:'Steuerbescheid', mahnung:'Mahnung', rechnung:'Rechnung', vertrag:'Vertrag', kuendigung:'Kündigung', versicherung:'Versicherung', behoerde:'Behörde', bank:'Bank', sonstiges:'Sonstiges' };
const ARTEN = { zahlen:'Zahlen', antworten:'Antworten', pruefen:'Prüfen', unterschreiben:'Unterschreiben', einreichen:'Einreichen', aufbewahren:'Aufbewahren' };

/* ---------- Speicher (lokal im Browser) ---------- */
const KEY = 'postpilot.v1';
let db = { docs: [], settings: { name: '', adresse: '', rueck: '', email: '', inboxToken: '' } };
try { const raw = JSON.parse(localStorage.getItem(KEY) || 'null'); if (raw) db = { ...db, ...raw }; } catch (e) {}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(db)); }
  catch (e) { toast('Speicher voll – bitte alte Post löschen oder exportieren.'); }
}
function toast(msg) {
  document.querySelectorAll('.toast').forEach((x) => x.remove());
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t);
  setTimeout(() => t.remove(), 2600);
}

function toastUndo(msg, undo) {
  document.querySelectorAll('.toast').forEach((x) => x.remove());
  const t = document.createElement('div'); t.className = 'toast'; t.innerHTML = '<span></span><button type="button">Rückgängig</button>';
  t.firstChild.textContent = msg; document.body.appendChild(t);
  const weg = setTimeout(() => t.remove(), 6000);
  t.querySelector('button').addEventListener('click', () => { clearTimeout(weg); t.remove(); undo(); });
}

/* ---------- Dringlichkeit ---------- */
function dringlichkeit(isoDatum) {
  const t = Fristen.tageBis(isoDatum);
  if (t == null) return { text: 'ohne Frist', cls: '' };
  if (t < 0) return { text: `${-t} Tg. überfällig`, cls: 'red', t };
  if (t === 0) return { text: 'heute', cls: 'red', t };
  if (t <= 7) return { text: `in ${t} Tg.`, cls: 'amber', t };
  return { text: `in ${t} Tg.`, cls: '', t };
}
const allTasks = () => db.docs.flatMap((d) => d.aufgaben.map((a) => ({ a, d })));

/* ---------- Navigation ---------- */
let tab = 'heute';
function go(t) { tab = t; render(); window.scrollTo(0, 0); }
$('#nav').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) go(b.dataset.tab); });
$('#btnHelp').addEventListener('click', openSettings);
$('#scan').addEventListener('click', () => $('#file').click());
$('#file').addEventListener('change', async (e) => { const fs = [...e.target.files]; e.target.value = ''; if (fs.length) await analysiere(fs); });

function render() {
  document.querySelectorAll('#nav button').forEach((b) => b.classList.toggle('on', b.dataset.tab === tab));
  $('#title').textContent = { heute: 'Aufgaben', post: 'Post' }[tab];
  const v = $('#view');
  v.innerHTML = tab === 'heute' ? viewHeute() : viewPost();
  bindView(v);
}

/* ---------- Ansicht: Aufgaben ---------- */
const PRIO = { zahlen: 0, antworten: 1, pruefen: 2, unterschreiben: 2, einreichen: 2, aufbewahren: 3 };
function offeneSortiert() {
  const tage = (x) => { const t = Fristen.tageBis(x.d.frist?.datum); return t == null ? 9999 : t; };
  return allTasks().filter((x) => !x.a.erledigt).sort((p, q) => tage(p) - tage(q) || (PRIO[p.a.art] ?? 5) - (PRIO[q.a.art] ?? 5));
}
const AKTION = { zahlen: ['Zahlen', 'pay'], antworten: ['Antworten', 'reply'], aufbewahren: ['Ablegen', 'done'], pruefen: ['Ansehen', 'open'] };
function heldHtml({ a, d }) {
  const u = dringlichkeit(d.frist?.datum), [label, act] = AKTION[a.art] || ['Erledigt', 'done'];
  return `<div class="card task"><div class="tt" data-doc="${d.id}"><div class="row" style="justify-content:space-between;flex-wrap:nowrap;align-items:flex-start"><div class="t">${esc(a.titel)}</div><span class="chip ${u.cls}">${esc(u.text)}</span></div><div class="s">${esc(d.felder.absender || 'Unbekannt')}${d.felder.betrag != null ? ' · ' + fmtBetrag(d.felder.betrag) : ''}</div></div>
    <div class="row"><button class="btn" data-act="${act}:${d.id}:${a.id}">${label}</button>${act !== 'done' ? `<button class="btn line" data-act="done:${d.id}:${a.id}" aria-label="Als erledigt markieren">✓ Erledigt</button>` : ''}</div></div>`;
}
function taskHtml({ a, d }) {
  const u = dringlichkeit(d.frist?.datum);
  return `<div class="card item" data-doc="${d.id}">
    <span class="check" data-toggle="${d.id}:${a.id}" role="checkbox" aria-checked="false" tabindex="0"></span>
    <div style="flex:1;min-width:0"><div class="t">${esc(a.titel)}</div><div class="s">${esc(d.felder.absender || 'Unbekannt')} · ${esc(ARTEN[a.art] || '')}</div></div>
    <span class="chip ${u.cls}">${esc(u.text)}</span></div>`;
}
function frageHtml(d) {
  return `<div class="card frage"><div class="t">${esc(d.felder.absender)}${d.felder.betreff ? ' · ' + esc(d.felder.betreff) : ''}</div><div class="s">${esc(d.frage.text)}</div>
    <div class="row"><button class="btn" data-fr="ok:${d.id}">Passt</button><button class="btn line" data-fr="edit:${d.id}">${d.frage.art === 'frist' ? 'Frist ändern' : 'Ansehen'}</button></div></div>`;
}
function viewHeute() {
  if (!db.docs.length) return emptyStart();
  const fragen = db.docs.filter((d) => d.frage), offen = offeneSortiert(), top = offen.slice(0, 3), rest = offen.slice(3);
  let h = '';
  if (fragen.length) h += `<h2>Kurz prüfen</h2>` + frageHtml(fragen[0]) + (fragen.length > 1 ? `<details class="more"><summary>Weitere Rückfragen (${fragen.length - 1})</summary>${fragen.slice(1).map(frageHtml).join('')}</details>` : '');
  h += offen.length ? `<h2>Als Nächstes</h2>` + top.map(heldHtml).join('') : `<div class="empty card"><b>Alles erledigt</b>Keine offenen Aufgaben. Neue Post kommt automatisch hier an.</div>`;
  if (rest.length) {
    const gruppen = [['In den nächsten 30 Tagen', (t) => t != null && t <= 30], ['Später', (t) => t != null && t > 30], ['Ohne Frist', (t) => t == null]];
    const liste = gruppen.map(([name, test]) => [name, rest.filter((x) => test(Fristen.tageBis(x.d.frist?.datum)))]).filter(([, l]) => l.length);
    h += `<details class="more" open><summary>Weitere Aufgaben (${rest.length})</summary>${liste.map(([name, l]) => `<h2>${name}</h2>` + l.map(taskHtml).join('')).join('')}</details>`;
  }
  if (db.docs.some((d) => d.frist?.datum)) h += `<div class="row" style="margin-top:18px"><button class="btn line" id="icsAll">Alle Fristen in meinen Kalender</button></div>`;
  return h;
}
function emptyStart() {
  return `<div class="empty card" style="margin-top:16px"><b>Willkommen bei Postpilot</b>
  Foto oder PDF deiner Post hochladen – Absender, Aktenzeichen, Beträge und Fristen werden erkannt und als Aufgaben mit Frist angelegt.
  <div class="row" style="justify-content:center;margin-top:16px"><button class="btn" id="scan2">Post scannen</button><button class="btn ghost" id="demo">Alle Demo-Daten laden</button></div></div>
  <h2>Beispielbriefe zum Ausprobieren</h2>${briefListe()}`;
}

/* ---------- Ansicht: Post ---------- */
let postSub = null; // 'meine' | 'beispiele'
function postKarte(d) {
  const u = dringlichkeit(d.frist?.datum), offen = d.aufgaben.filter((a) => !a.erledigt).length;
  return `<button class="card item" data-doc="${d.id}"><div style="flex:1;min-width:0">
      <div class="t">${esc(d.felder.absender || 'Unbekannt')}</div>
      <div class="s">${esc(d.felder.betreff || TYPEN[d.felder.typ] || '')}</div>
      <div class="row" style="margin-top:6px"><span class="chip">${esc(TYPEN[d.felder.typ] || 'Sonstiges')}</span>${d.felder.betrag != null ? `<span class="chip">${fmtBetrag(d.felder.betrag)}</span>` : ''}${d.frist?.datum ? `<span class="chip ${u.cls}">${esc(u.text)}</span>` : ''}</div></div>
      <span class="s">${offen ? offen + ' offen' : '✓'}</span></button>`;
}
function viewPost() {
  const sub = postSub || (db.docs.length ? 'meine' : 'beispiele');
  const seg = `<div class="seg" role="tablist"><button role="tab" aria-selected="${sub === 'meine'}" class="${sub === 'meine' ? 'on' : ''}" data-sub="meine">Meine Post (${db.docs.length})</button><button role="tab" aria-selected="${sub === 'beispiele'}" class="${sub === 'beispiele' ? 'on' : ''}" data-sub="beispiele">Beispielbriefe</button></div>`;
  if (sub === 'beispiele') return seg + `<p class="note">Öffne einen Brief und lass ihn auslesen. Danach landet er unter „Meine Post".</p>` + briefListe();
  if (!db.docs.length) return seg + `<div class="empty card"><b>Noch keine Post</b>Scanne einen Brief mit dem blauen Button oder probiere die Beispielbriefe aus.<div class="row" style="justify-content:center;margin-top:14px"><button class="btn" data-sub="beispiele">Beispielbriefe ansehen</button></div></div>`;
  return seg + [...db.docs].sort((a, b) => b.erstellt - a.erstellt).map(postKarte).join('');
}

function bindView(v) {
  v.querySelectorAll('[data-toggle]').forEach((el) => el.addEventListener('click', (e) => {
    e.stopPropagation(); const [d, a] = el.dataset.toggle.split(':');
    const task = db.docs.find((x) => x.id === d)?.aufgaben.find((x) => x.id === a); if (task) { task.erledigt = !task.erledigt; save(); render(); }
  }));
  v.querySelectorAll('[data-doc]').forEach((el) => el.addEventListener('click', () => openDoc(el.dataset.doc)));
  v.querySelectorAll('[data-act]').forEach((el) => el.addEventListener('click', () => {
    const [act, did, aid] = el.dataset.act.split(':'), d = db.docs.find((x) => x.id === did); if (!d) return;
    if (act === 'pay') openZahlen(d, aid); else if (act === 'reply') openAntwort(d); else if (act === 'open') openDoc(did);
    else { const a = d.aufgaben.find((x) => x.id === aid); a.erledigt = true; save(); render(); toastUndo('Erledigt', () => { a.erledigt = false; save(); render(); }); }
  }));
  v.querySelectorAll('[data-fr]').forEach((el) => el.addEventListener('click', () => {
    const [act, did] = el.dataset.fr.split(':'), d = db.docs.find((x) => x.id === did); if (!d) return;
    if (act === 'ok') { d.frage = null; save(); render(); toast('Bestätigt ✓'); } else if (d.frage.art === 'frist') openFristAendern(d); else openDoc(did);
  }));
  $('#icsAll', v)?.addEventListener('click', () => exportIcs(db.docs.filter((d) => d.frist?.datum)));
  $('#scan2', v)?.addEventListener('click', () => $('#file').click());
  $('#demo', v)?.addEventListener('click', ladeDemo);

/* ---------- Kalender-Export ---------- */
function exportIcs(docs) {
  docs = docs.filter((d) => d.frist?.datum);
  if (!docs.length) return toast('Keine Fristen vorhanden.');
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
  const fold = (t) => t.replace(/([,;\\])/g, '\\$1').replace(/\n/g, '\\n');
  const titel = (d) => `Frist: ${d.felder.absender || 'Post'}${d.felder.betreff ? ' – ' + d.felder.betreff : ''}`;
  const beschr = (d) => [d.felder.aktenzeichen && `Az: ${d.felder.aktenzeichen}`, d.felder.betrag != null && `Betrag: ${fmtBetrag(d.felder.betrag)}`, ...d.aufgaben.map((a) => `• ${a.titel}`)].filter(Boolean).join('\n');
  const tag = (iso) => iso.replace(/-/g, ''), nach = (iso) => tag(Fristen.iso(Fristen.addDays(Fristen.parse(iso), 1)));
  const ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Postpilot//DE', ...docs.map((d) => ['BEGIN:VEVENT', `UID:${d.id}@postpilot`, `DTSTAMP:${stamp}`, `DTSTART;VALUE=DATE:${tag(d.frist.datum)}`, `DTEND;VALUE=DATE:${nach(d.frist.datum)}`, `SUMMARY:${fold(titel(d))}`, `DESCRIPTION:${fold(beschr(d))}`, 'BEGIN:VALARM', 'TRIGGER:-P7D', 'ACTION:DISPLAY', 'DESCRIPTION:Frist in 7 Tagen', 'END:VALARM', 'BEGIN:VALARM', 'TRIGGER:-P1D', 'ACTION:DISPLAY', 'DESCRIPTION:Frist morgen', 'END:VALARM', 'END:VEVENT'].join('\r\n')), 'END:VCALENDAR'].join('\r\n');
  const gcal = (d) => `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(titel(d))}&dates=${tag(d.frist.datum)}/${nach(d.frist.datum)}&details=${encodeURIComponent(beschr(d))}`;
  const s = sheet('In den Kalender', `<p class="note">Jede Frist lässt sich mit einem Tipp in Google Kalender eintragen. Für Apple oder Outlook kopierst du den Kalendertext und speicherst ihn in einer Datei mit der Endung .ics.</p>
    ${docs.map((d) => `<div class="card item" style="align-items:center"><div style="flex:1;min-width:0"><div class="t">${esc(d.felder.absender)}</div><div class="s">${esc(fmtDatum(d.frist.datum))}</div></div><a class="btn ghost" style="min-height:40px;padding:8px 14px;text-decoration:none" href="${esc(gcal(d))}" target="_blank" rel="noopener">Google Kalender</a></div>`).join('')}
    <div class="row" style="margin-top:14px"><button class="btn line" id="icsCopy">Kalendertext (.ics) kopieren</button></div>`);
  $('#icsCopy', s).addEventListener('click', () => kopieren(ics));
}

function sheet(title, inner, onClose) {
  const s = document.createElement('div'); s.className = 'sheet';
  s.innerHTML = `<div class="bar"><button class="btn line" data-close aria-label="Schließen" style="min-height:40px">‹ Zurück</button><h1>${esc(title)}</h1></div><main>${inner}</main>`;
  const close = () => { s.remove(); onClose?.(); render(); };
  s.querySelector('[data-close]').addEventListener('click', close);
  document.body.appendChild(s); s.close = close; return s;
}
function toBase64(file) {
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(file); });
}
function resizeImage(file, max = 1600) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      const t = document.createElement('canvas'), kt = 360 / Math.max(img.width, img.height); t.width = Math.round(img.width * kt); t.height = Math.round(img.height * kt);
      t.getContext('2d').drawImage(img, 0, 0, t.width, t.height); URL.revokeObjectURL(url);
      res({ base64: c.toDataURL('image/jpeg', .82).split(',')[1], mime: 'image/jpeg', thumb: t.toDataURL('image/jpeg', .6) });
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Bild nicht lesbar')); };
    img.src = url;
  });
}
async function analysiere(files) {
  const s = sheet('Wird gelesen …', `<div class="empty"><div class="spin"></div><b>Schreiben wird analysiert</b>Absender, Beträge und Fristen werden erkannt.</div>`);
  try {
    const dateien = []; let thumb = null;
    for (const f of files) {
      if (f.type === 'application/pdf') {
        if (f.size > 3e6) throw new Error('PDF ist größer als 3 MB. Bitte als Foto hochladen oder komprimieren.');
        dateien.push({ mime: 'application/pdf', base64: await toBase64(f) });
      } else { const r = await resizeImage(f); dateien.push({ mime: r.mime, base64: r.base64 }); thumb ||= r.thumb; }
    }
    const r = await fetch('/api/post-analyze', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ dateien }) }).catch(() => ({ status: 503, ok: false, json: async () => ({}) }));
    const j = await r.json().catch(() => ({}));
    s.remove();
    if ([404, 501, 503].includes(r.status)) {
      toast('Demo-Modus: KI nicht verbunden – bitte Daten manuell erfassen.');
      return pruefen({ typ: 'sonstiges', absender: '', betreff: '', unsicher: ['Alles manuell erfassen (KI nicht verbunden)'] }, thumb);
    }
    if (!r.ok) throw new Error(j.error || 'Analyse fehlgeschlagen');
    uebernehmen(j.ergebnis, { thumb });
  } catch (e) { s.remove(); toast(e.message || 'Fehler beim Lesen'); }
}

/* ---------- Automatisch speichern ---------- */
const HOCH = ['steuerbescheid', 'mahnung', 'behoerde'];
function dokumentAus(erg, opts = {}) {
  const fr = Fristen.berechne({ datum: erg.datum, frist_datum: erg.frist_datum, frist_regel: erg.frist_regel, frist_tage: erg.frist_tage });
  const felder = { typ: erg.typ || 'sonstiges', absender: erg.absender || 'Unbekannter Absender', absender_adresse: erg.absender_adresse || null, betreff: erg.betreff || null, datum: erg.datum || null,
    aktenzeichen: erg.aktenzeichen || null, kundennummer: erg.kundennummer || null, steuernummer: erg.steuernummer || null, rechnungsnummer: erg.rechnungsnummer || null,
    betrag: erg.betrag ?? null, iban: erg.iban || null, verwendungszweck: erg.verwendungszweck || null };
  const aufgaben = (erg.aufgaben || []).map((a) => ({ id: uid(), titel: a.titel, art: a.art, erledigt: false }));
  if (!aufgaben.length) aufgaben.push({ id: uid(), titel: 'Schreiben prüfen', art: 'pruefen', erledigt: false });
  const unsicher = erg.unsicher || [];
  // Nur nachfragen, wenn nötig: bei Unsicherheit oder bei Post mit Rechtsfolgen (ein Tipp)
  let frage = null;
  if (unsicher.length) frage = { art: 'unsicher', text: `Unsicher: ${unsicher.join(', ')}. Passt das so?` };
  else if (HOCH.includes(felder.typ)) frage = { art: 'frist', text: fr.datum ? `Frist ${fmtDatum(fr.datum)}. Stimmt das?` : 'Keine Frist erkannt. Stimmt das?' };
  return { id: uid(), erstellt: Date.now(), thumb: opts.thumb || null, quelle: opts.quelle || 'scan', felder, frist: fr.datum ? { datum: fr.datum, erklaerung: fr.erklaerung } : null,
    aufgaben, zusammenfassung: erg.zusammenfassung || null, antwortNoetig: !!erg.antwort_noetig, frage, entwurf: '' };
}
function uebernehmen(erg, opts = {}) {
  const doc = dokumentAus(erg, opts);
  db.docs.push(doc); save(); postSub = 'meine';
  if (!opts.still) toastUndo(`${doc.felder.absender} gespeichert`, () => { db.docs = db.docs.filter((x) => x.id !== doc.id); save(); render(); });
  render(); return doc;
}

function vorlage(d, anliegen) {
  const f = d.felder, bezug = `Ihr Schreiben${f.datum ? ' vom ' + new Date(f.datum).toLocaleDateString('de-DE') : ''}${f.aktenzeichen ? ' (Aktenzeichen ' + f.aktenzeichen + ')' : ''}`;
  const kern = BAUSTEIN[anliegen];
  return `Sehr geehrte Damen und Herren,\n\n${kern ? 'bezugnehmend auf ' + bezug + ': ' + kern : 'bezugnehmend auf ' + bezug + ' teile ich Ihnen Folgendes mit: ' + anliegen}\n\nFür Rückfragen stehe ich Ihnen gern zur Verfügung.`;
}
async function entwurf(d, anliegen) {
  try {
    const r = await fetch('/api/post-reply', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ dokument: d.felder, anliegen, absender: db.settings }) }).catch(() => ({ ok: false, status: 503 }));
    if (r.ok) return { text: (await r.json()).brief, ki: true };
  } catch (e) {}
  return { text: vorlage(d, anliegen), ki: false };
}
const zeilenAus = (t) => String(t || '').split('\n').map((x) => x.trim()).filter(Boolean);
function briefDaten(d, anliegen, text) {
  const st = db.settings, f = d.felder, rueck = zeilenAus(st.rueck || st.adresse);
  return { absender: [st.name || '[Dein Name]', ...(rueck.length ? rueck : ['[Deine Adresse]'])], empfaenger: [f.absender, ...(f.absender_adresse || '').split(/,\s*/).filter(Boolean)],
    datum: new Date().toLocaleDateString('de-DE'), betreff: `${anliegen}${f.betreff ? ' – ' + f.betreff : ''}`,
    bezug: [f.aktenzeichen && `Aktenzeichen: ${f.aktenzeichen}`, f.kundennummer && `Kundennummer: ${f.kundennummer}`, f.datum && `Ihr Schreiben vom ${new Date(f.datum).toLocaleDateString('de-DE')}`].filter(Boolean),
    text, unterschrift: st.name || '' };
}
function briefHtml(b) {
  return `<div class="paper"><div class="abs">${esc(b.absender.join(' · '))}</div><p>${b.empfaenger.map(esc).join('<br>')}</p><div class="dt">${esc(b.datum)}</div>
    ${b.bezug.length ? `<p style="font-size:12px;color:#555">${b.bezug.map(esc).join('<br>')}</p>` : ''}<h3>${esc(b.betreff)}</h3><p style="white-space:pre-wrap">${esc(b.text)}</p><p>Mit freundlichen Grüßen<br><br>${esc(b.unterschrift)}</p></div>`;
}
function openAntwort(d) {
  const s = sheet('Antworten', ''), main = $('main', s), liste = INTENTS[d.felder.typ] || INTENTS_STANDARD;
  let anliegen = '', text = '';
  const auswahl = () => {
    main.innerHTML = `<p class="note">Antwort an ${esc(d.felder.absender)}. Was möchtest du erreichen?</p>
      ${liste.map((l, i) => `<button class="btn ghost big" data-i="${i}">${esc(l)}</button>`).join('')}
      <label class="f" for="eig">Oder in eigenen Worten</label><textarea id="eig" style="min-height:80px" placeholder="z. B. Ich bitte um Zahlungsaufschub bis zum …"></textarea>
      <div class="row" style="margin-top:10px"><button class="btn line" id="eigGo">Entwurf erstellen</button></div>`;
    main.querySelectorAll('[data-i]').forEach((b) => b.addEventListener('click', () => erzeuge(liste[+b.dataset.i])));
    $('#eigGo', main).addEventListener('click', () => { const v = $('#eig', main).value.trim(); if (v) erzeuge(v); else toast('Bitte kurz beschreiben.'); });
  };
  const erzeuge = async (a) => {
    anliegen = a; main.innerHTML = '<div class="empty"><div class="spin"></div><b>Brief wird geschrieben</b></div>';
    const r = await entwurf(d, a); text = r.text; vorschau(r.ki);
  };
  const vorschau = (ki) => {
    const b = briefDaten(d, anliegen, text), fehlt = !db.settings.name || !(db.settings.rueck || db.settings.adresse);
    main.innerHTML = `${fehlt ? '<p class="note warn">Trage Name und Adresse in den Einstellungen ein, damit sie im Briefkopf stehen.</p>' : ''}
      ${briefHtml(b)}
      <div id="ed" class="hide"><label class="f" for="txt">Brieftext</label><textarea id="txt" style="min-height:220px">${esc(text)}</textarea></div>
      ${ki ? '' : '<p class="note">Einfacher Textbaustein. Mit verbundener KI formuliert die App den Brief individuell.</p>'}
      <div class="row" style="margin-top:14px"><button class="btn" id="weiter" style="flex:1 1 100%">Weiter zum Versand</button></div>
      <div class="row" style="margin-top:8px"><button class="btn line" id="edit" style="flex:1">Bearbeiten</button><button class="btn line" id="cp" style="flex:1">Kopieren</button><button class="btn line" id="neu" style="flex:1">Anderes Anliegen</button></div>`;
    $('#edit', main).addEventListener('click', () => {
      const ed = $('#ed', main); if (!ed.classList.contains('hide')) { text = $('#txt', main).value; return vorschau(ki); }
      ed.classList.remove('hide'); $('#edit', main).textContent = 'Fertig';
    });
    $('#cp', main).addEventListener('click', () => kopieren(b.text));
    $('#neu', main).addEventListener('click', auswahl);
    $('#weiter', main).addEventListener('click', () => { if (!$('#ed', main).classList.contains('hide')) text = $('#txt', main).value; versand(); });
  };
  const versand = () => {
    const b = briefDaten(d, anliegen, text);
    main.innerHTML = `<h2 style="margin-top:6px">Versand prüfen</h2>
      <div class="card sum"><div class="fld"><span class="k">An</span><span class="v">${esc(b.empfaenger[0])}</span></div><div class="fld"><span class="k">Von</span><span class="v">${esc(b.absender[0])}</span></div>
      <div class="fld"><span class="k">Rückantwort an</span><span class="v">${esc(b.absender.slice(1).join(', '))}</span></div><div class="fld"><span class="k">Versandart</span><span class="v">Standardbrief</span></div>
      <div class="fld"><span class="k">Kosten</span><span class="v">noch offen</span></div></div>
      <p class="note warn">Trockenlauf: Der Brief wird fertig erzeugt, aber noch nicht verschickt. Einschreiben und echter Versand folgen mit einem Postdienstleister.</p>
      <div class="row" style="margin-top:14px"><button class="btn" id="send" style="flex:1">Trockenlauf starten</button><button class="btn line" id="zur">Zurück</button></div>`;
    $('#zur', main).addEventListener('click', () => vorschau(true));
    $('#send', main).addEventListener('click', async () => {
      const btn = $('#send', main); btn.disabled = true; btn.textContent = 'Erzeuge …';
      let info = 'Vorschau erstellt, nichts versendet.', pdf = null;
      try {
        const r = await fetch('/api/post-letter', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(b) }).catch(() => null);
        if (r?.ok) { const j = await r.json(); pdf = j.pdf_base64; info = `Brief als PDF erzeugt (${j.seiten} Seite${j.seiten > 1 ? 'n' : ''}), nichts versendet.`; }
      } catch (e) {}
      d.antwort = { am: Date.now(), anliegen, text, status: 'Trockenlauf' }; save();
      main.innerHTML = `<div class="empty card"><b>Trockenlauf fertig</b>${esc(info)}${pdf ? `<div class="row" style="justify-content:center;margin-top:14px"><a class="btn ghost" id="pdfLink" href="data:application/pdf;base64,${pdf}" target="_blank" rel="noopener" style="text-decoration:none">PDF ansehen</a></div>` : ''}</div>
        <div class="row" style="margin-top:14px"><button class="btn" id="fertig" style="flex:1">Schließen</button></div>`;
      $('#fertig', main).addEventListener('click', () => s.close());
    });
  };
  if (d.antwort?.text) { anliegen = d.antwort.anliegen; text = d.antwort.text; vorschau(true); } else auswahl();
}

  );

/* ---------- Posteingang: neue Post per E-Mail abholen ---------- */
let holt = false;
async function holePost() {
  const tok = db.settings.inboxToken; if (!tok || holt) return; holt = true;
  try {
    const r = await fetch('/api/inbox', { headers: { authorization: 'Bearer ' + tok } });
    if (!r.ok) return;
    const { items = [] } = await r.json();
    items.forEach((i) => uebernehmen(i.ergebnis, { quelle: 'mail', still: true }));
    if (items.length) toast(`${items.length} neue Post`);
  } catch (e) {} finally { holt = false; }
}
holePost(); setInterval(holePost, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) holePost(); });
render();
