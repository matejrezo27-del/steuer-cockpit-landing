<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brand Tycoon – Supplement-Marke aufbauen</title>
<style>
:root{--bg:#0a0e14;--panel:#111822;--panel2:#172130;--line:#223047;--text:#e8eef6;--muted:#8697ad;--acc:#b6ff3b;--acc2:#2ee6c5;--bad:#ff5d6c;--warn:#ffb020;--good:#3ddc84;--r:14px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,select,input{font:inherit;color:inherit}
.shell{display:grid;grid-template-columns:190px 1fr;grid-template-rows:auto 1fr auto;height:100vh}
header{grid-column:1/3;display:flex;align-items:center;gap:14px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;min-width:150px}
.brand .logo{font-size:26px}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:11px}
.stat{display:flex;flex-direction:column;min-width:78px}
.stat b{font-size:16px}.stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.speed{margin-left:auto;display:flex;gap:4px}
.speed button{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
.speed button.on{background:var(--acc);color:#10200a;border-color:var(--acc);font-weight:700}
nav{background:var(--panel);border-right:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:4px;overflow:auto}
nav button{text-align:left;background:none;border:0;border-radius:10px;padding:10px 12px;cursor:pointer;color:var(--muted);font-weight:600}
nav button:hover{background:var(--panel2);color:var(--text)}
nav button.on{background:var(--panel2);color:var(--acc)}
nav .badge{float:right;background:var(--bad);color:#fff;border-radius:99px;font-size:11px;padding:0 7px}
main{overflow:auto;padding:18px;min-height:0}
.logbar{grid-column:1/3;background:var(--panel);border-top:1px solid var(--line);padding:6px 16px;height:92px;overflow:auto;font-size:12.5px}
.logbar div{padding:1px 0;color:var(--muted)}.logbar .t{color:var(--acc2);margin-right:6px}
.logbar .bad{color:var(--bad)}.logbar .good{color:var(--good)}.logbar .warn{color:var(--warn)}
h2{margin:0 0 12px;font-size:20px}h3{margin:0 0 8px;font-size:15px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.g6{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card.hl{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.kpi b{display:block;font-size:22px;margin-top:2px}.kpi span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.muted{color:var(--muted)}.small{font-size:12px}.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;font-weight:600}
.btn:hover:not(:disabled){border-color:var(--acc2)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#10200a}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:8px}
.pill{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:1px 9px;font-size:11px;color:var(--muted)}
.bar{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc2),var(--acc))}
.bar.red i{background:var(--bad)}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tabs button{background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:6px 14px;cursor:pointer;color:var(--muted);font-weight:600}
.tabs button.on{background:var(--acc);border-color:var(--acc);color:#10200a}
input[type=range]{width:100%;accent-color:var(--acc)}
input[type=text]{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px}
select{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:5px 8px}
table{width:100%;border-collapse:collapse}td,th{padding:5px 6px;text-align:right;border-bottom:1px solid var(--line)}td:first-child,th:first-child{text-align:left}
.modal{position:fixed;inset:0;background:rgba(3,6,10,.75);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.hidden{display:none}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;max-width:520px;width:100%;max-height:92vh;overflow:auto}
.modal .box h2{font-size:22px}
.choice{display:block;width:100%;text-align:left;margin-top:8px}
#toasts{position:fixed;right:14px;top:70px;display:flex;flex-direction:column;gap:8px;z-index:60;max-width:340px}
.toast{background:var(--panel2);border:1px solid var(--acc2);border-radius:12px;padding:10px 14px;box-shadow:0 8px 30px #0008;animation:in .25s}
@keyframes in{from{transform:translateY(-8px);opacity:0}to{opacity:1}}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:8px;cursor:pointer;background:var(--panel2)}
.opt.on{border-color:var(--acc)}
.emojis{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.emojis button{font-size:22px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:4px 9px;cursor:pointer}.emojis button.on{border-color:var(--acc)}
@media(max-width:760px){
 .shell{grid-template-columns:1fr;grid-template-rows:auto auto 1fr auto}
 header,nav,.logbar{grid-column:1}
 nav{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}
 nav button{white-space:nowrap}
 .speed{margin-left:0}
}
</style>
</head>
<body>
<div class="shell">
 <header id="hdr"></header>
 <nav id="nav"></nav>
 <main id="main"></main>
 <div class="logbar" id="log"></div>
</div>
<div class="modal hidden" id="modal"></div>
<div id="toasts"></div>
<script>
'use strict';
/* ================= Helfer ================= */
const $=s=>document.querySelector(s);
const nf=(o)=>new Intl.NumberFormat('de-DE',o);
const F0=nf({style:'currency',currency:'EUR',maximumFractionDigits:0}), F2=nf({style:'currency',currency:'EUR',minimumFractionDigits:2,maximumFractionDigits:2}), N0=nf({maximumFractionDigits:0}), N1=nf({minimumFractionDigits:1,maximumFractionDigits:1});
const fmt=n=>F0.format(Math.round(n)), fmt2=n=>F2.format(n), num=n=>N0.format(Math.round(n));
const pc=(x,d=1)=>(x*100).toFixed(d).replace('.',',')+' %';
const rnd=(a,b)=>a+Math.random()*(b-a), clamp=(x,a,b)=>Math.max(a,Math.min(b,x)), pick=a=>a[Math.floor(Math.random()*a.length)];
const MONTHS=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
const SEASON=[1.35,1.1,1.05,1.1,1.1,1.05,1.0,.95,1.0,1.0,1.05,1.1];
const GOAL=5000000;

/* ================= Spieldaten ================= */
const PRODUCTS={
 whey:{n:'Whey Protein 1 kg',e:'🥛',cost:9,ref:29.9,pop:1.0,rd:0},
 creatine:{n:'Creatine Monohydrat',e:'💪',cost:5,ref:19.9,pop:.9,rd:1500},
 omega:{n:'Omega-3 Kapseln',e:'🐟',cost:4,ref:17.9,pop:.6,rd:2500},
 d3k2:{n:'Vitamin D3 + K2',e:'☀️',cost:2.5,ref:14.9,pop:.6,rd:3000},
 pre:{n:'Pre-Workout Booster',e:'⚡',cost:7,ref:29.9,pop:.7,rd:4500},
 collagen:{n:'Collagen Beauty',e:'✨',cost:8,ref:27.9,pop:.6,rd:6000},
 ashwa:{n:'Ashwagandha KSM-66',e:'🌿',cost:3.5,ref:19.9,pop:.5,rd:8000},
 bar:{n:'Protein Riegel 12er',e:'🍫',cost:9.5,ref:24.9,pop:.7,rd:12000},
};
const TIERS=[null,{n:'Standard',c:1,lead:4},{n:'Premium',c:1.55,lead:5},{n:'Bio-Lab',c:2.2,lead:7}];
const BATCHES=[{q:100,m:1.4},{q:300,m:1.12},{q:1000,m:.92},{q:3000,m:.78},{q:10000,m:.64}];
const ARCH={
 hardcore:{n:'Fitness-Hardcore',e:'🦍',d:'Whey, Creatine, Pre-Workout & Riegel laufen +20 % besser. TikTok-Posts bringen mehr Fans.',cogs:1,ref:1,el:1.5,tt:1.3,liked:['Fitness','Bodybuilding'],boost:['whey','creatine','pre','bar']},
 clean:{n:'Clean & Wellness',e:'🌿',d:'Vitamine, Omega, Collagen & Ashwagandha +25 % gefragt. Kundschaft zahlt 8 % mehr.',cogs:1,ref:1.08,el:1.5,tt:1,liked:['Wellness','Lifestyle','Food'],boost:['omega','d3k2','collagen','ashwa']},
 budget:{n:'Budget-Disruptor',e:'💸',d:'Produktion 8 % günstiger – dafür sind Kunden deutlich preissensibler.',cogs:.92,ref:1,el:1.9,tt:1,liked:['Fitness','Lifestyle'],boost:[]},
};
const FORMATS={
 photo:{n:'Produktfoto',e:'📸',cost:15,base:12,viral:.02,aw:.12,d:'Solide Basis'},
 reel:{n:'Reel / Short',e:'🎬',cost:60,base:35,viral:.08,aw:.3,d:'Hohe Viral-Chance'},
 edu:{n:'Education-Carousel',e:'🎓',cost:25,base:18,viral:.03,aw:.15,d:'Baut Vertrauen auf (+Rating)'},
 give:{n:'Giveaway',e:'🎁',cost:150,base:160,viral:.05,aw:.25,d:'Viele Follower, kaum Verkäufe'},
 ugc:{n:'Kundenvideo (UGC)',e:'🙌',cost:40,base:30,viral:.06,aw:.25,need:20,d:'Braucht 20+ Kunden'},
 story:{n:'Founder-Story',e:'🧑‍💻',cost:0,base:20,viral:.06,aw:.2,d:'Kostenlos & authentisch'},
};
const PLAT={ig:{n:'Instagram',e:'📷',m:1,v:1,co:.006},tt:{n:'TikTok',e:'🎵',m:1.2,v:1.7,co:.009},yt:{n:'YouTube',e:'▶️',m:.7,v:.8,co:.007}};
const ADCH={meta:{n:'Meta Ads',e:'📘',d:'Instagram & Facebook',cpc:.55,cm:1,aw:.0010},tt:{n:'TikTok Ads',e:'🎵',d:'Billig, aber weniger Kaufabsicht',cpc:.38,cm:.8,aw:.0016},google:{n:'Google Shopping & Search',e:'🔎',d:'Teuer, aber hohe Kaufabsicht',cpc:.85,cm:1.45,aw:.0004}};
const ITIERS=[
 {n:'Nano',f:[4000,15000],pp:[.025,.04],eng:[.05,.09]},
 {n:'Micro',f:[30000,90000],pp:[.018,.028],eng:[.035,.06]},
 {n:'Mid',f:[150000,400000],pp:[.014,.02],eng:[.025,.045]},
 {n:'Macro',f:[700000,1500000],pp:[.011,.016],eng:[.018,.03]},
 {n:'Mega',f:[3000000,6000000],pp:[.008,.012],eng:[.012,.02]},
];
const HANDLES=['fitwithlena','maxpower','gymbro_jonas','clean.eats.mia','sarah.lifts','coach.kevin','nina.balance','muskel.marco','healthy.hannah','tim.trains','vegan.vivi','lukas.lean','bulk.bastian','yoga.yasmin','kraftkarl','fit.fabi','jule.jumps','protein.paul','mindful.mara','deadlift.dani'];
const NICHES=['Fitness','Bodybuilding','Wellness','Lifestyle','Food'];
const STAFF=[
 {k:'creator',n:'Content Creator',e:'🎤',s:2200,d:'+1 Content-Punkt Kapazität, schnellere Regeneration, +25 % Follower pro Post'},
 {k:'support',n:'Customer Success',e:'🎧',s:1800,d:'Rating +0,1, weniger Retouren, weniger Ärger bei Krisen'},
 {k:'perf',n:'Performance-Marketer',e:'📊',s:3200,d:'Werbe-CPC −20 %'},
 {k:'wh',n:'Lager & Versand',e:'📦',s:2000,d:'Versandkosten −12 %'},
];
const UPS=[
 {k:'design',n:'Shop-Design Pro',e:'🎨',c:1200,d:'+15 % Conversion'},
 {k:'checkout',n:'1-Klick-Checkout',e:'⚡',c:800,d:'+10 % Conversion',req:'design'},
 {k:'trusted',n:'Trusted-Shops-Siegel',e:'🛡️',c:600,d:'+8 % Conversion, schützt vor Abmahnungen'},
 {k:'email',n:'E-Mail-Flows & Popup',e:'📧',c:1500,d:'Doppelt so viele Newsletter-Anmeldungen, mehr Wiederkäufe'},
 {k:'abo',n:'Abo-System',e:'🔁',c:2500,d:'Viel höhere Wiederkaufrate, weniger Kundenschwund'},
 {k:'lab',n:'Laborzertifikat',e:'🔬',c:3000,d:'Schaltet Bio-Lab-Qualität frei, Rating +0,12'},
 {k:'seo',n:'SEO-Blog & Ratgeber',e:'📝',c:2000,d:'Dauerhaft mehr organische Besucher'},
 {k:'amazon',n:'Amazon-Store',e:'📦',c:1800,d:'Neuer Traffic-Kanal (15 % Gebühr)'},
 {k:'studio',n:'Content-Studio',e:'🎥',c:8000,d:'+1 Content-Punkt, +15 % Follower pro Post (900 €/Monat Miete)'},
 {k:'tpl',n:'3PL-Logistikpartner',e:'🚚',c:6000,d:'Versandkosten −35 %'},
 {k:'fabrik',n:'Eigene Produktionslinie',e:'🏭',c:40000,d:'Herstellkosten −18 %'},
 {k:'retail',n:'Retail-Listung (DM, Rossmann …)',e:'🏬',c:25000,d:'Stetiger Großabnehmer-Absatz zum Großhandelspreis',need:()=>S.awareness>=35&&unlockedIds().length>=3,needTxt:'Bekanntheit ≥ 35 und 3 Produkte'},
];
const LOANS=[5000,20000,100000];
const ROUNDS=[{min:60000,pct:.15,n:'Pre-Seed'},{min:400000,pct:.12,n:'Seed'},{min:1500000,pct:.10,n:'Series A'}];
const ACH=[
 ['first','🛒','Erster Verkauf',()=>S.totalOrders>=1],
 ['o100','📦','100 Bestellungen',()=>S.totalOrders>=100],
 ['o1k','🚀','1.000 Bestellungen',()=>S.totalOrders>=1000],
 ['o10k','🏆','10.000 Bestellungen',()=>S.totalOrders>=10000],
 ['f1k','👥','1.000 Follower',()=>folTotal()>=1000],
 ['f10k','🌟','10.000 Follower',()=>folTotal()>=10000],
 ['f100k','👑','100.000 Follower',()=>folTotal()>=100000],
 ['viral','🔥','Erster viraler Post',()=>S.stats.viral>=1],
 ['rev10k','💶','10.000 € Umsatz',()=>S.totalRev>=10000],
 ['rev100k','💰','100.000 € Umsatz',()=>S.totalRev>=100000],
 ['rev1m','🤑','1 Mio. € Umsatz',()=>S.totalRev>=1e6],
 ['prod5','🧪','5 Produkte im Sortiment',()=>unlockedIds().length>=5],
 ['infl','🤝','Erste Influencer-Kampagne',()=>S.stats.infl>=1],
 ['mega','📣','Mega-Influencer gebucht',()=>S.stats.mega>=1],
 ['star','⭐','Rating ≥ 4,7',()=>S.rating>=4.7],
 ['aware','🌍','Bekanntheit ≥ 50',()=>S.awareness>=50],
 ['seed','📈','Erste Finanzierungsrunde',()=>S.rounds>=1],
];

/* ================= State ================= */
let S=null;
const ui={tab:'ueber',mtab:'social',speed:0,order:{},modal:null,interacting:false,ev:null};
function newState(brand,emoji,arch){
 const prod={};
 Object.keys(PRODUCTS).forEach(id=>prod[id]={unlocked:id==='whey',price:PRODUCTS[id].ref,stock:0,qsum:0,costSum:0,lastQ:1,oos:false,ema:0});
 return {v:1,brand,emoji,arch,day:0,cash:8000,loan:0,owned:1,rounds:0,
  fol:{ig:120,tt:0,yt:0},email:0,awareness:2,rating:4.0,customers:0,
  totalOrders:0,totalRev:0,prod,batches:[],frac:{},fracR:{},
  cp:3,postScore:0,staff:{},up:{},ads:{meta:{budget:0,fat:0},tt:{budget:0,fat:0},google:{budget:0,fat:0}},
  infl:[],camps:[],bursts:[],promo:{pct:0,days:0,cool:0},mailCool:0,mkt:{ref:1,until:0},cogMod:{m:1,until:0},
  hist:[],log:[],ach:{},stats:{ordered:0,posts:0,infl:0,mails:0,viral:0,mega:0},last:{},ch:{},lastSrc:[],
  evCool:8,inflHeat:0,negDays:0,exited:false,over:false,val:0,dayMkt:0};
}
const A=()=>ARCH[S.arch];
const unlockedIds=()=>Object.keys(PRODUCTS).filter(id=>S.prod[id].unlocked);
const folTotal=()=>S.fol.ig+S.fol.tt+S.fol.yt;
const monthIdx=()=>Math.floor((S.day%360)/30);
const dateStr=()=>`Jahr ${Math.floor(S.day/360)+1} · ${MONTHS[monthIdx()]} · Tag ${S.day%30+1}`;
function save(){try{localStorage.setItem('brandTycoon.v1',JSON.stringify(S));}catch(e){}}
function loadSave(){try{const s=localStorage.getItem('brandTycoon.v1');return s?JSON.parse(s):null;}catch(e){return null;}}

/* ================= Ökonomie ================= */
const popOf=id=>PRODUCTS[id].pop*(A().boost.includes(id)?(S.arch==='clean'?1.25:1.2):1);
const qualMult=q=>1+(q-1)*.21;
const ratingFromQ=q=>3.9+(q-1)*.425;
const season=()=>SEASON[monthIdx()];
const trust=()=>clamp(.75+(S.rating-3.6)*.4,.5,1.3);
const shopMult=()=>1+(S.up.design?.15:0)+(S.up.checkout?.10:0)+(S.up.trusted?.08:0);
const baseCR=()=>.03*season()*shopMult()*trust()*(1+S.awareness*.004)*(1+.02*(unlockedIds().length-1))*(S.promo.days>0?1.12:1);
function avgQ(id){const p=S.prod[id];return p.stock>0?p.qsum/p.stock:(p.lastQ||1);}
const refPrice=id=>PRODUCTS[id].ref*qualMult(avgQ(id))*(1+S.awareness*.003)*A().ref*S.mkt.ref;
const effPrice=id=>S.prod[id].price*(S.promo.days>0?1-S.promo.pct:1);
const priceFactor=id=>clamp(Math.pow(refPrice(id)/effPrice(id),A().el),.05,3);
const unitCost=(id,t,bi)=>PRODUCTS[id].cost*TIERS[t].c*BATCHES[bi].m*A().cogs*S.cogMod.m*(S.up.fabrik?.82:1);
const repeatRate=()=>.008+(S.up.abo?.008:0)+(S.up.email?.003:0)+clamp(S.rating-4,-.5,.8)*.006;
const fulfilCost=()=>3.6*(S.up.tpl?.65:1)*(S.staff.wh?.88:1);
const cpCap=()=>3+(S.staff.creator?1:0)+(S.up.studio?1:0);
const cpRegen=()=>.5+(S.staff.creator?.35:0);
const postMult=()=>(S.staff.creator?1.25:1)*(S.up.studio?1.15:1);
function adCPC(k){const a=S.ads[k];return ADCH[k].cpc*Math.pow(1+a.budget/400,.6)*(1+a.fat*.8)*(S.staff.perf?.8:1);}
const inTransit=id=>S.batches.filter(b=>b.pid===id).reduce((a,b)=>a+b.qty,0);
const invValue=()=>Object.values(S.prod).reduce((a,p)=>a+p.costSum,0);
function runRate(){const h=S.hist.slice(-60);return h.length?h.reduce((a,x)=>a+x.rev,0)/h.length*365:0;}
function sum(n,key){return S.hist.slice(-n).reduce((a,x)=>a+x[key],0);}
function valuation(){
 const rr=runRate(),h=S.hist.slice(-60),prof=h.reduce((a,x)=>a+x.profit,0),margin=rr?prof/h.length*365/rr:0;
 const m=clamp(.3+S.awareness/110+clamp(S.rating-4,-.5,.8)*.8+(margin>.1?.6:margin>0?.2:-.3),.3,3);
 return Math.max(0,rr*m+Math.max(0,S.cash)*.8+invValue()*.6-S.loan);
}
const stage=()=>{const v=S.val;return v<25000?'🏠 Garage':v<150000?'🚀 Startup':v<1e6?'📈 Scale-up':v<GOAL?'🏢 Marktführer':'🦄 Einhorn';};

/* ================= Log / Toast ================= */
function log(msg,type=''){S.log.push({d:S.day,msg,type});if(S.log.length>80)S.log.shift();}
function toast(msg){const el=document.createElement('div');el.className='toast';el.innerHTML=msg;const tb=$('#toasts');tb.appendChild(el);while(tb.children.length>4)tb.firstChild.remove();setTimeout(()=>el.remove(),4200);}
function addAw(x){S.awareness=clamp(S.awareness+x*(1-S.awareness/100),0,100);}
function pay(c){if(S.cash<c){toast('❌ Nicht genug Cash ('+fmt(c)+' nötig)');return false;}S.cash-=c;return true;}

/* ================= Influencer ================= */
function genInfluencers(){
 S.infl=[];
 const n=6,maxT=Math.min(4,Math.floor(S.day/60)+1+(S.awareness>25?1:0)+(S.awareness>50?1:0));
 for(let i=0;i<n;i++){
  const ti=i<2?0:Math.floor(Math.random()*(maxT+1));const T=ITIERS[Math.min(ti,4)];
  const f=Math.round(rnd(...T.f)),niche=pick(NICHES),liked=A().liked.includes(niche);
  const fit=clamp(rnd(.75,1.1)*(liked?1.25:.9),.5,1.5);
  S.infl.push({id:Math.random().toString(36).slice(2,8),handle:'@'+pick(HANDLES)+(Math.random()<.5?Math.floor(rnd(1,99)):''),tier:ITIERS.indexOf(T),followers:f,niche,fit,eng:rnd(...T.eng),price:Math.round(f*rnd(...T.pp)/10)*10,plat:pick(['ig','tt','yt'])});
 }
}
function hireInfl(id){
 const o=S.infl.find(x=>x.id===id);if(!o)return;
 if(!unlockedIds().some(p=>S.prod[p].stock>=20)){toast('📦 Ohne Ware (min. 20 Stück) lohnt sich keine Kampagne!');return;}
 if(!pay(o.price))return;
 S.infl=S.infl.filter(x=>x!==o);
 const flop=rnd(.4,1.7);let tv=o.followers*o.eng*.5*o.fit*flop/(1+S.inflHeat*.12),scandal=Math.random()<.04;

 // Wareneingang
 const arr=S.batches.filter(b=>b.arrive<=S.day);S.batches=S.batches.filter(b=>b.arrive>S.day);
 arr.forEach(b=>{const p=S.prod[b.pid];p.stock+=b.qty;p.qsum+=b.qty*b.tier;p.costSum+=b.cost;p.lastQ=b.tier;p.oos=false;log(`📦 Wareneingang: ${num(b.qty)}× ${PRODUCTS[b.pid].n} (${TIERS[b.tier].n})`,'good');});
 if(S.day%7===1||!S.infl.length)genInfluencers();
 // Quellen
 const src=[],act=.35+.65*Math.min(1,S.postScore/3),aw=S.awareness;
 src.push({k:'social',l:'Social organisch',v:(S.fol.ig*PLAT.ig.co+S.fol.tt*PLAT.tt.co+S.fol.yt*PLAT.yt.co)*act*(1+aw*.004),cm:1});
 src.push({k:'direct',l:'Direkt & Mundpropaganda',v:3+S.customers*.012+aw*.3+(S.up.seo?12+aw*.5:0),cm:1.15});
 if(S.up.amazon)src.push({k:'amazon',l:'Amazon',v:15+aw*2.5,cm:1.1,fee:.15});
 let avail=Math.max(0,S.cash);const totB=Object.values(S.ads).reduce((a,x)=>a+x.budget,0),sc=totB>avail?avail/totB:1;
 for(const k in ADCH){const a=S.ads[k];if(a.budget>0&&sc>0){const b=a.budget*sc,cpc=ADCH[k].cpc*Math.pow(1+a.budget/400,.6)*(1+a.fat*.8)*(S.staff.perf?.8:1);src.push({k:'ad_'+k,l:ADCH[k].n,v:b/cpc,cm:ADCH[k].cm*(1-a.fat*.3),spend:b,ad:k});D.ads+=b;a.fat=Math.min(1,a.fat+.012);}else a.fat=Math.max(0,a.fat-.02);}
 S.bursts=S.bursts.filter(b=>b.days>0);S.bursts.forEach(b=>{src.push({k:'burst',l:b.label,v:b.per,cm:b.cm});b.days--;});
 S.camps.forEach(c=>{const sh=SHAPE[c.day]||0;src.push({k:'infl',l:'Influencer '+c.handle,v:c.tv*sh,cm:.8*c.fit,camp:c});});
 const CR=baseCR();let totalV=0,demO=0;
 const sat=Math.max(.1,1-S.totalOrders*.9/150000);
 src.forEach(s=>{s.o=s.v*s.cm*CR*sat;totalV+=s.v;demO+=s.o;});
 // Verkauf
 const unl=unlockedIds(),popSum=unl.reduce((a,id)=>a+popOf(id),0),cross=1+.1*(unl.length-1),rate=repeatRate();
 let soldU=0,soldNewU=0,revNew=0,qSum=0,stockouts=0,retailRev=0;
 for(const id of unl){
  const p=S.prod[id],w=popOf(id)/popSum,pf=priceFactor(id),ep=effPrice(id);
  const dN=demO*cross*w*pf*rnd(.8,1.2),dR=S.customers*rate*w*Math.pow(pf,.7)*rnd(.85,1.15);
  const fN=(S.frac[id]||0)+dN,fR=(S.fracR[id]||0)+dR,uN=Math.floor(fN),uR=Math.floor(fR);S.frac[id]=fN-uN;S.fracR[id]=fR-uR;
  const want=uN+uR,sold=Math.min(want,Math.floor(p.stock));D.missed+=want-sold;
  if(p.stock<1){stockouts++;if(!p.oos&&S.totalOrders>0){p.oos=true;log(`⚠️ Ausverkauft: ${PRODUCTS[id].n}!`,'bad');}}
  if(sold>0){
   const ac=p.costSum/p.stock,aq=p.qsum/p.stock,sN=want?Math.round(sold*uN/want):0;
   p.stock-=sold;p.costSum=Math.max(0,p.costSum-ac*sold);p.qsum=Math.max(0,p.qsum-aq*sold);if(p.stock<1){p.stock=0;p.costSum=0;p.qsum=0;}
   D.rev+=sold*ep;D.cogs+=sold*ac;soldU+=sold;soldNewU+=sN;revNew+=sN*ep;qSum+=aq*sold;
  }
  p.ema=p.ema*.9+sold*.1;
  // Retail
  if(S.up.retail&&p.stock>=1){const rq=Math.min(Math.floor(p.stock),Math.round(S.awareness*.6*trust()*w*rnd(.8,1.2)));if(rq>0){const ac=p.costSum/p.stock,aq=p.qsum/p.stock,rp=refPrice(id)*.5;p.stock-=rq;p.costSum=Math.max(0,p.costSum-ac*rq);p.qsum=Math.max(0,p.qsum-aq*rq);if(p.stock<1){p.stock=0;p.costSum=0;p.qsum=0;}D.rev+=rq*rp;D.cogs+=rq*ac;retailRev+=rq*rp;D.units+=rq;qSum+=aq*rq;soldU+=rq;}}
 }
 const online=D.rev-retailRev,onlineU=soldU-(S.up.retail?D.units:0);D.units+=onlineU;
 const orders=onlineU/cross,newOrders=soldNewU/cross;D.orders=orders;D.visitors=totalV;
 // Kosten
 let amzShare=0;
 src.forEach(s=>{const sh=demO>0?s.o/demO:0;s.ord=newOrders*sh;s.rev=revNew*sh;if(s.fee)amzShare+=sh;});
 D.fees=orders*(fulfilCost()+.25)+online*(.019+(S.staff.support?.012:.025))+revNew*amzShare*.15;
 // Attribution & Wachstum
 src.forEach(s=>{const c=S.ch[s.k]||(S.ch[s.k]={v:0,o:0,r:0,sp:0});c.v+=s.v;c.o+=s.ord;c.r+=s.rev;c.sp+=s.spend||0;
  if(s.camp){s.camp.visitors+=s.v;s.camp.orders+=s.ord;s.camp.rev+=s.rev;const g=s.camp.gain*(SHAPE[s.camp.day]||0);S.fol[s.camp.plat]+=g;s.camp.fol+=g;addAw(s.camp.aw*.6*(SHAPE[s.camp.day]||0));}
  if(s.ad){const a=ADCH[s.ad];addAw(s.v*a.aw*.6);if(s.ad==='meta')S.fol.ig+=s.v*.008;if(s.ad==='tt')S.fol.tt+=s.v*.01;}});
 S.camps.forEach(c=>{c.day++;});
 const done=S.camps.filter(c=>c.day>=5);S.camps=S.camps.filter(c=>c.day<5);
 done.forEach(c=>{const roi=c.rev/c.price;log(`🤝 ${c.handle}: ${num(c.visitors)} Besucher, ~${num(c.orders)} Bestellungen (≈${fmt(c.rev)} Umsatz), +${num(c.fol)} Follower – ${c.scandal?'Skandal! 😬':roi>=1.5?'Volltreffer 🎯':roi>=.8?'okay 👍':'Flop 📉'}`,roi>=.8?'good':'warn');});
 S.customers=(S.customers+newOrders*.92)*(1-(.009-(S.up.abo?.002:0)));
 S.email=S.email*.999+totalV*(S.up.email?.045:.015);
 addAw(newOrders*.005);S.awareness*=.992;
 S.fol.ig*=.9995;S.fol.tt*=.9995;S.fol.yt*=.9995;
 S.totalOrders+=orders;S.totalRev+=D.rev;
 // Rating
 const aq2=soldU>0?qSum/soldU:unl.reduce((a,id)=>a+avgQ(id),0)/unl.length;
 const tgt=ratingFromQ(aq2)+(S.up.lab?.12:0)+(S.staff.support?.1:0)+(S.up.trusted?.05:0)-Math.min(.3,stockouts*.1);
 S.rating=clamp(S.rating+(tgt-S.rating)*.03,1,5);
 // Fixkosten (monatlich)
 if(S.day%30===0){
  let f=79;STAFF.forEach(s=>{if(S.staff[s.k])f+=s.s;});if(S.up.studio)f+=900;
  const intr=S.loan*.015;f+=intr;D.fixed=f;
  log(`🧾 Monatsabrechnung: ${fmt(f)} (Tools, Gehälter, Miete${intr?', Zinsen':''})`,'warn');
 }
 S.cash+=D.rev-D.fees-D.ads-D.mkt-D.fixed;
 const profit=D.rev-D.cogs-D.fees-D.ads-D.mkt-D.fixed;
 S.hist.push({d:S.day,rev:D.rev,cogs:D.cogs,fees:D.fees,ads:D.ads,mkt:D.mkt,fixed:D.fixed,orders:D.orders,visitors:D.visitors,units:D.units,profit,cash:S.cash});
 if(S.hist.length>420)S.hist.shift();

}

 invest(){const r=ROUNDS[S.rounds];if(!r||S.val<r.min)return;const cash=S.val*r.pct*.9;S.cash+=cash;S.owned*=(1-r.pct);S.rounds++;log(`📈 ${r.n}-Runde: ${fmt(cash)} für ${Math.round(r.pct*100)} % der Anteile`,'good');save();render(true);},

 const rows=[['Umsatz','rev',1],['Wareneinsatz','cogs',-1],['Versand & Gebühren','fees',-1],['Werbung','ads',-1],['Content & Aktionen','mkt',-1],['Fixkosten (Gehälter, Tools, Zinsen)','fixed',-1]];
 const lim=5000+runRate()*.25,r=ROUNDS[S.rounds];
 return `<h2>💶 Finanzen</h2><div class="grid g2"><div class="card"><h3>GuV – letzte 30 Tage</h3><table>${rows.map(([l,k,s])=>`<tr><td>${l}</td><td class="${s<0?'bad':''}">${fmt(sum(30,k)*s)}</td></tr>`).join('')}<tr><td><b>Ergebnis</b></td><td><b class="${sum(30,'profit')>=0?'good':'bad'}">${fmt(sum(30,'profit'))}</b></td></tr></table>
 <div class="small muted" style="margin-top:8px">Wareneinkäufe werden beim Bestellen bezahlt, der Wareneinsatz erst beim Verkauf gebucht – deshalb kann dein Cash trotz Gewinn schrumpfen.</div></div>
 <div class="card"><h3>🏷️ Unternehmenswert</h3><b style="font-size:26px">${fmt(S.val)}</b><div class="small muted">Run-Rate ${fmt(runRate())}/Jahr × Multiple (Bekanntheit, Rating, Profitabilität) + Cash + Lager − Schulden</div>
  <div style="margin:10px 0">${bar(S.val,GOAL)}</div><div class="small muted">Dein Anteil: ${pc(S.owned,0)} → ${fmt(S.val*S.owned)} bei Exit</div></div>
 <div class="card"><h3>🏦 Kredit</h3><div class="small muted">Offen: <b>${fmt(S.loan)}</b> · Limit ${fmt(lim)} · 1,5 % Zinsen pro Monat</div>
  <div class="row" style="margin-top:8px">${LOANS.map(a=>`<button class="btn sm" data-a="loan" data-amt="${a}">+${fmt(a)}</button>`).join('')}</div>
  <div class="row" style="margin-top:8px">${[1000,5000,20000].map(a=>`<button class="btn sm" data-a="repay" data-amt="${a}" ${S.loan<=0||S.cash<Math.min(a,S.loan)?'disabled':''}>Tilgen ${fmt(a)}</button>`).join('')}</div></div>
 <div class="card"><h3>📈 Investoren</h3>${r?`<div class="small muted">${r.n}-Runde: ${pc(r.pct,0)} der Anteile verkaufen ab ${fmt(r.min)} Unternehmenswert.</div><div style="margin-top:8px"><button class="btn primary" data-a="invest" ${S.val<r.min?'disabled':''}>${fmt(S.val*r.pct*.9)} einsammeln</button></div>${S.val<r.min?`<div class="small warn">Noch ${fmt(r.min-S.val)} bis zur Runde.</div>`:''}`:'<div class="muted">Alle Runden abgeschlossen.</div>'}</div></div>`;
}
function vErf(){
 return `<h2>🏆 Ziele & Hilfe</h2><div class="grid g2"><div class="card"><h3>🏁 Dein Ziel</h3><p class="muted">Baue ${S.brand} zu einer Marke mit <b>${fmt(GOAL)} Unternehmenswert</b> auf und gehe auf Exit – ohne vorher pleite zu gehen (10 Tage im Minus = Insolvenz).</p>
 <h3>So funktioniert der Shop</h3><div class="small muted">
 <b>Besucher</b> kommen über Social Media, Ads, Influencer, Newsletter & SEO →<br><b>Conversion</b> (Preis, Bewertungen, Shop-Design, Bekanntheit) macht daraus <b>Bestellungen</b> →<br>Kunden kaufen <b>wieder</b> (Abo, E-Mail, Qualität). Ohne Ware auf Lager verpufft jeder Besucher!<br><br>
 Gewinn = Preis − Herstellung − Versand − <b>CAC</b> (Kosten pro Neukunde). Wiederkäufe sind dein Hebel für Profit.</div>
 <div style="margin-top:14px"><button class="btn danger" data-a="newgame">Neues Spiel starten</button></div></div>
 <div class="card"><h3>Erfolge (${Object.keys(S.ach).length}/${ACH.length})</h3>${ACH.map(a=>`<div class="small" style="padding:3px 0;${S.ach[a[0]]?'':'opacity:.4'}">${a[1]} ${a[2]}${S.ach[a[0]]?` <span class="muted">· Tag ${S.ach[a[0]]}</span>`:''}</div>`).join('')}</div></div>`;
}
function renderMain(){
 const v={ueber:vOver,sort:vSort,mkt:vMkt,team:vTeam,fin:vFin,erf:vErf}[ui.tab];$('#main').innerHTML=v();
}
function render(force){
 if(!S)return;renderHeader();renderNav();renderLog();
 if(force||!ui.interacting)renderMain();
}
/* ================= Modals ================= */
function showModal(h){const m=$('#modal');m.innerHTML=`<div class="box">${h}</div>`;m.classList.remove('hidden');ui.modal=true;}
function hideModal(){$('#modal').classList.add('hidden');ui.modal=false;}
function showStart(keep){
 if(!keep&&!ui.pa)ui.pa='hardcore';if(!ui.pe)ui.pe='🔥';
 const sv=loadSave(),name=($('#sn')&&$('#sn').value)||'NovaFuel';
 showModal(`<h2>🚀 Brand Tycoon</h2><p class="muted">Baue von der Garage aus eine Supplement-Marke auf: Produkte herstellen, Social Media bespielen, Influencer buchen, Ads schalten – bis zum Exit.</p>
 <div class="small muted">Markenname</div><input type="text" id="sn" value="${name.replace(/"/g,'')}" maxlength="22">
 <div class="emojis">${['🔥','💎','⚡','🌿','🦍','🧬','🏔️','🍋'].map(e=>`<button data-a="pe" data-e="${e}" class="${ui.pe===e?'on':''}">${e}</button>`).join('')}</div>
 <div class="small muted" style="margin-top:12px">Marken-Typ</div>
 ${Object.keys(ARCH).map(k=>`<div class="opt ${ui.pa===k?'on':''}" data-a="pa" data-k="${k}"><div style="font-size:24px">${ARCH[k].e}</div><div><b>${ARCH[k].n}</b><div class="small muted">${ARCH[k].d}</div></div></div>`).join('')}
 <div class="row" style="margin-top:16px"><button class="btn primary" data-a="start">Gründen (8.000 € Startkapital)</button>${sv&&!keep?`<button class="btn" data-a="cont">Spielstand laden</button>`:''}${keep&&S?`<button class="btn" data-a="keep">Abbrechen</button>`:''}</div>`);
}
function showWin(){
 showModal(`<h2>🦄 EXIT!</h2><p>Ein Konzern will <b>${S.brand}</b> kaufen. Unternehmenswert: <b>${fmt(S.val)}</b>.</p><p>Dein Anteil (${pc(S.owned,0)}): <b class="good">${fmt(S.val*S.owned+Math.max(0,S.cash)*0)}</b></p>
 <p class="muted">Nach ${S.day} Tagen (${(S.day/360).toFixed(1).replace('.',',')} Jahren), ${num(S.totalOrders)} Bestellungen und ${fmt(S.totalRev)} Umsatz.</p>
 <div class="row"><button class="btn primary" data-a="keep">Weiterspielen (Sandbox)</button><button class="btn" data-a="newgame">Neues Spiel</button></div>`);
}
function showOver(){
 showModal(`<h2>💥 Insolvenz</h2><p>${S.brand} war zu lange im Minus – die Bank dreht den Geldhahn zu.</p><p class="muted">${S.day} Tage · ${num(S.totalOrders)} Bestellungen · ${fmt(S.totalRev)} Umsatz.</p>
 <p class="small muted">Tipp: Halte Ware auf Lager, beobachte den ROAS und plane Cash für die Monatsabrechnung ein.</p><button class="btn primary" data-a="newgame">Nochmal versuchen</button>`);
}

/* ================= Game-Loop ================= */
const SPEEDS=[0,1000,450,160,50];let timer=null;
function schedule(){clearTimeout(timer);if(!S||ui.speed===0||S.over)return;timer=setTimeout(loop,SPEEDS[ui.speed]);}
function loop(){
 if(!ui.modal&&S&&!S.over){stepDay();render();}
 schedule();
}
window.addEventListener('beforeunload',()=>{if(S&&!S.over)save();});

/* ================= Start ================= */
window.G={get S(){return S;},ACT,ui,stepDay,unitCost,hireInfl,genInfluencers,newState,setS(s){S=s;},valuation};
(function init(){
 ui.pa='hardcore';ui.pe='🔥';
 const sv=loadSave();
 S=newState('NovaFuel','🔥','hardcore');genInfluencers();render(true);
 showStart();
})();
</script>
</body>
</html>
