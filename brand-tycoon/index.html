 const viral=Math.random()<F.viral*P.v;if(viral){g*=rnd(10,30);S.stats.viral++;}
 g=Math.round(g);S.fol[plat]+=g;addAw(F.aw*(viral?4:1));if(fk==='edu')S.rating=Math.min(5,S.rating+.01);
 S.postScore+=1;S.stats.posts++;S.dayMkt+=F.cost;
 S.feed.unshift({d:S.day,p:plat,f:fk,g,viral,auto:!!auto});if(S.feed.length>14)S.feed.pop();
 if(viral){toast(`🔥 <b>VIRAL!</b> ${F.e} ${F.n} auf ${P.n}: +${num(g)} Follower`);log(`🔥 Viral auf ${P.n}: +${num(g)} Follower`,'good');sfx('win');buzz(40);confetti(18);}
 else if(!auto){toast(`${F.e} ${P.n}: <b>+${num(g)}</b> Follower`);sfx('pop');}

function autoPosts(){
 if(!S.staff.creator)return;
 for(const p in S.plan){const pl=S.plan[p];if(!pl.n)continue;pl.acc=Math.min(3,pl.acc+pl.n/7);
  while(pl.acc>=1){pl.acc-=1;const fk=pl.f==='mix'?pick(['photo','reel','edu','story','reel']):pl.f,F=FORMATS[fk];
   if(F.need&&S.customers<F.need)continue;if(S.cash<F.cost+500)break;S.cash-=F.cost;makePost(p,fk,true);}}

function chartSVG(){

 const office=`<div class="card ${N?'':'hl'}"><div class="row sp"><h3 style="margin:0">${O.e} ${O.n}</h3><span class="pill">${O.rent?fmt(O.rent)+'/Monat':'mietfrei'}</span></div><div class="small muted" style="margin:6px 0">${O.d}</div>
  <div class="row small"><span>🪑 ${seatsUsed()}/${O.seats} Plätze</span><span>📦 Lager ${num(stockCap())}</span></div>
  ${N?`<hr><div class="row sp"><div style="flex:1;min-width:200px"><b>Nächste Stufe: ${N.e} ${N.n}</b><div class="small muted">${N.seats} Plätze · Lager ${num(N.cap*(S.up.tpl?3:1))} · ${fmt(N.rent)}/Monat</div></div><button class="btn primary" data-a="office" ${S.cash<N.cost?'disabled':''}>Umziehen ${fmt(N.cost)}</button></div>`:'<div class="small good" style="margin-top:8px">Höchste Stufe erreicht 🏰</div>'}</div>`;
 const team=ROLES.map(R=>{const e=S.staff[R.k];
  if(e){const T=TRAITS[e.trait],col=e.mood>66?'var(--mint)':e.mood>35?'var(--warn)':'var(--bad)';
   return `<div class="card"><div class="emp"><div class="av">${e.av}</div><div style="min-width:0"><div class="row sp"><b>${esc(e.name)}</b><span class="stars">${stars(e.lvl)}</span></div><div class="small muted">${R.e} ${R.n} · <span class="pill">${T.n}</span></div></div></div>
   <div class="small" style="margin:8px 0 4px">${effText(R,e)}</div><div class="row sp small"><span class="muted">Stimmung ${Math.round(e.mood)} %</span><span class="muted">${fmt(e.sal)}/Monat</span></div><div class="bar"><i style="width:${e.mood}%;background:${col}"></i></div>
   <div class="small muted" style="margin-top:6px">${e.lvl<3?`Nächster Aufstieg in ~${Math.max(0,e.promoAt-S.day)} Tagen (bei guter Stimmung)`:'Maximales Level'}</div>
   <div class="row" style="margin-top:10px"><button class="btn sm" data-a="raise" data-role="${R.k}" ${e.raise>=12?'disabled':''}>💸 Gehalt +10 %</button><button class="btn sm danger" data-a="fire" data-role="${R.k}">Kündigen</button></div></div>`;}
  return `<div class="card" style="border-style:dashed"><div class="emp"><div class="av" style="opacity:.5">${R.e}</div><div><b>${R.n}</b><div class="small muted">${R.d}</div></div></div><div class="row sp" style="margin-top:10px"><span class="small muted">ab ca. ${fmt(R.base*.72)}/Monat</span><button class="btn sm primary" data-a="openhire" data-role="${R.k}" ${free<=0?'disabled':''}>${free<=0?'Kein Platz':'Bewerber ansehen'}</button></div></div>`;}).join('');
 const perks=PERKS.map(p=>`<div class="card ${S.perks[p.k]?'hl':''}"><div class="row sp"><b>${p.e} ${p.n}</b>${p.up?`<span class="pill">${fmt(p.up)}/Monat</span>`:''}</div><div class="small muted" style="margin:4px 0 8px">Stimmung +${p.mood} für das ganze Team</div>${S.perks[p.k]?'<span class="good">✔ Eingebaut</span>':`<button class="btn sm primary" data-a="perk" data-k="${p.k}" ${S.cash<p.c?'disabled':''}>${fmt(p.c)}</button>`}</div>`).join('');
 const evOn=(S.teamEvent||0)>S.day;
 const ups=UPS.map(u=>{const has=S.up[u.k],reqOk=!u.req||S.up[u.req],needOk=!u.need||u.need(),dis=has||!reqOk||!needOk||S.cash<u.c;
  return `<div class="card ${has?'hl':''}"><h3>${u.e} ${u.n}</h3><div class="small muted" style="margin-bottom:8px">${u.d}</div>${has?'<span class="good">✔ Aktiv</span>':`<button class="btn primary sm" data-a="up" data-k="${u.k}" ${dis?'disabled':''}>${fmt(u.c)}</button>${!reqOk?`<div class="small warn">Braucht: ${UPS.find(x=>x.k===u.req).n}</div>`:''}${!needOk?`<div class="small warn">Braucht: ${u.needTxt}</div>`:''}`}</div>`;}).join('');
 return `<h2>👥 Firma</h2>${office}
 <div class="sec"><span>Team</span><span class="small muted">${fmt(Object.values(S.staff).reduce((a,e)=>a+e.sal,0))}/Monat</span></div><div class="grid g2">${team}</div>
 <div class="sec"><span>🛋️ Büro-Extras</span></div><div class="grid g3">${perks}
  <div class="card"><b>🎳 Team-Event</b><div class="small muted" style="margin:4px 0 8px">Stimmung steigt sofort und bleibt 30 Tage erhöht.${evOn?' (läuft)':''}</div><div class="row"><button class="btn sm" data-a="teamevent" data-c="600" ${evOn||S.cash<600||!Object.keys(S.staff).length?'disabled':''}>Grillen 600 €</button><button class="btn sm" data-a="teamevent" data-c="2500" ${evOn||S.cash<2500||!Object.keys(S.staff).length?'disabled':''}>Offsite 2.500 €</button></div></div></div>
 <div class="sec"><span>🔧 Ausbau</span></div><div class="grid g3">${ups}</div>`;
}
/* ---- Zahlen ---- */
function vFin(){
 const rows=[['Umsatz','rev',1],['Wareneinsatz','cogs',-1],['Versand & Gebühren','fees',-1],['Werbung','ads',-1],['Content & Aktionen','mkt',-1],['Fixkosten & Steuern','fixed',-1]];
 const lim=5000+runRate()*.25,r=ROUNDS[S.rounds],L=billLines(),tot=L.reduce((a,x)=>a+x[1],0);
 const det=(id,title,inner)=>`<details data-d="${id}" ${ui.open[id]?'open':''}><summary>${title}</summary><div style="margin-top:10px">${inner}</div></details>`;
 return `<h2>💶 Zahlen</h2><div class="grid g2">
 <div class="card"><h3>GuV · letzte 30 Tage</h3><table>${rows.map(([l,k,s])=>`<tr><td>${l}</td><td class="${s<0?'bad':''}">${fmt(sum(30,k)*s)}</td></tr>`).join('')}<tr><td><b>Ergebnis</b></td><td><b class="${sum(30,'profit')>=0?'good':'bad'}">${fmt(sum(30,'profit'))}</b></td></tr></table>
 <div class="small muted" style="margin-top:8px">Wareneinkauf zahlst du beim Bestellen, gebucht wird er erst beim Verkauf. Deshalb kann Cash trotz Gewinn schrumpfen.</div></div>
 <div class="card"><h3>🧾 Fixkosten pro Monat</h3><table>${L.map(([l,v])=>`<tr><td>${l}</td><td>${fmt(v)}</td></tr>`).join('')}<tr><td><b>Summe</b></td><td><b>${fmt(tot)}</b></td></tr></table><div class="small muted" style="margin-top:8px">Dazu kommen 20 % Steuern auf den Monatsgewinn. Abrechnung alle 30 Tage${S.bill?`, zuletzt Tag ${S.bill.day}: ${fmt(S.bill.total)}`:''}.</div></div>
 <div class="card"><h3>🏷️ Unternehmenswert</h3><b style="font-family:var(--fd);font-weight:400;font-size:30px" class="coin">${fmt(S.val)}</b><div class="small muted">Run-Rate ${fmt(runRate())}/Jahr × Multiple (Bekanntheit, Rating, Profit) + Cash + Lager − Schulden</div><div style="margin:10px 0">${bar(S.val,GOAL)}</div><div class="small muted">Dein Anteil ${pc(S.owned,0)} → ${fmt(S.val*S.owned)} bei Exit (Ziel ${fmt(GOAL)})</div></div>
 <div class="card"><h3>🏦 Kredit</h3><div class="small muted">Offen <b>${fmt(S.loan)}</b> · Limit ${fmt(lim)} · 1,5 % Zinsen pro Monat</div><div class="row" style="margin-top:10px">${LOANS.map(a=>`<button class="btn sm" data-a="loan" data-amt="${a}">+${fmt(a)}</button>`).join('')}</div><div class="row" style="margin-top:8px">${[1000,5000,20000].map(a=>`<button class="btn sm" data-a="repay" data-amt="${a}" ${S.loan<=0||S.cash<Math.min(a,S.loan)?'disabled':''}>Tilgen ${fmt(a)}</button>`).join('')}</div></div>
 <div class="card"><h3>📈 Investoren</h3>${r?`<div class="small muted">${r.n}-Runde: ${pc(r.pct,0)} der Anteile ab ${fmt(r.min)} Unternehmenswert.</div><div style="margin-top:10px"><button class="btn primary" data-a="invest" ${S.val<r.min?'disabled':''}>${fmt(S.val*r.pct*.9)} einsammeln</button></div>${S.val<r.min?`<div class="small warn" style="margin-top:6px">Noch ${fmt(r.min-S.val)} bis zur Runde.</div>`:''}`:'<div class="muted">Alle Runden abgeschlossen.</div>'}</div></div>
 ${det('ach',`🏆 Erfolge (${Object.keys(S.ach).length}/${ACH.length})`,ACH.map(a=>`<div class="small" style="padding:3px 0;${S.ach[a[0]]?'':'opacity:.4'}">${a[1]} ${a[2]}${S.ach[a[0]]?` <span class="muted">· Tag ${S.ach[a[0]]}</span>`:''}</div>`).join(''))}
 ${det('how','❓ So funktioniert der Shop',`<div class="small muted"><b>Besucher</b> kommen über Social Media, Ads, Influencer, Newsletter & SEO. Die <b>Conversion</b> (Preis, Bewertungen, Shop-Design, Bekanntheit) macht daraus <b>Bestellungen</b>. Kunden kaufen <b>wieder</b> (Abo, Qualität). Ohne Ware verpufft jeder Besucher.<br><br>Gewinn = Preis − Herstellung − Versand − <b>CAC</b> (Kosten pro Neukunde) − Fixkosten. Dein Team kostet jeden Monat Geld, bringt aber Automatik und Boni. Zufriedene Mitarbeiter arbeiten besser und steigen auf.</div>`)}
 ${det('set','⚙️ Einstellungen',`<div class="row"><button class="btn sm ${S.weekStop?'primary':''}" data-a="weekstop">📅 Wochen-Stopp: ${S.weekStop?'AN':'AUS'}</button><button class="btn sm" data-a="snd">${ui.sound?'🔊 Ton an':'🔇 Ton aus'}</button><button class="btn sm danger" data-a="newgame">Neues Spiel</button></div>`)}`;
}
/* ================= Sheets ================= */
function openSheet(kind,lock){ui.sheetKind=kind;ui.sheetLock=lock===true?false:['event','start','win','over'].includes(kind);ui.modal=true;$('#sheet').classList.remove('hidden');renderSheet();}
function closeSheet(){ui.modal=false;ui.sheetKind=null;$('#sheet').classList.add('hidden');$('#sheet').innerHTML='';}
function renderSheet(){
 const k=ui.sheetKind;if(!k)return;let h='';
 if(k==='start'){
  const nm=$('#sn')?$('#sn').value:'NovaFuel',sv=loadSave();
  h=`<div class="title">BRAND TYCOON</div><p class="muted" style="text-align:center;margin:0 0 12px">Baue von der Garage aus eine Supplement-Marke auf: Produkte, Social Media, Influencer, Team, Büro bis zum Exit.</p>
  <div class="small muted">Markenname</div><input type="text" id="sn" value="${esc(nm)}" maxlength="20" autocomplete="off">
  <div class="small muted" style="margin-top:12px">Logo</div><div class="emo">${['🔥','💎','⚡','🌿','🦍','🧬','🏔️','🍋'].map(e=>`<button data-a="pe" data-e="${e}" class="${ui.pe===e?'on':''}">${e}</button>`).join('')}</div>
  <div class="small muted" style="margin-top:12px">Markenfarbe</div><div class="sw">${['#ff6a3d','#35e0a8','#5cb9ff','#c77dff','#ffc83d','#ff4fa3'].map(c=>`<button data-a="pc" data-c="${c}" class="${ui.pcol===c?'on':''}" style="background:${c}" aria-label="Farbe"></button>`).join('')}</div>
  <div class="small muted" style="margin-top:12px">Du</div><div class="emo">${['🧑‍💼','👩‍💼','👨‍💼','🧑‍🚀','👩‍🔬','👨‍🍳'].map(e=>`<button data-a="pf" data-e="${e}" class="${ui.pfo===e?'on':''}">${e}</button>`).join('')}</div>
  <div class="small muted" style="margin-top:12px">Marken-Typ</div>
  ${Object.keys(ARCH).map(k=>`<div class="opt ${ui.pa===k?'on':''}" data-a="pa" data-k="${k}"><div style="font-size:26px">${ARCH[k].e}</div><div><b>${ARCH[k].n}</b><div class="small muted">${ARCH[k].d}</div></div></div>`).join('')}
  <div class="col" style="margin-top:16px"><button class="btn primary" data-a="start" style="font-size:17px">🚀 Gründen · 8.000 € Startkapital</button>${sv?`<button class="btn" data-a="cont">Spielstand laden</button>`:''}${S&&S.day>0&&!S.over?`<button class="btn" data-a="close">Abbrechen</button>`:''}</div>`;
 }else if(k==='order'){
  const id=ui.sh.id,P=PRODUCTS[id],p=S.prod[id],t=ui.sh.tier,bi=ui.sh.bi,q=BATCHES[bi].q,uc=unitCost(id,t,bi),cost=uc*q,after=stockTotal()+q;
  h=`<div class="big">${P.e}</div><h2 style="text-align:center">${P.n} bestellen</h2>
  <div class="small muted">Qualität</div><div class="seg" style="margin:6px 0 12px">${[1,2,3].map(x=>`<button data-a="ot" data-v="${x}" class="${t===x?'on':''}" ${x===3&&!S.up.lab?'disabled':''}>${TIERS[x].n}${x===3&&!S.up.lab?' 🔒':''}</button>`).join('')}</div>
  <div class="small muted">Menge (größere Chargen sind günstiger pro Stück)</div><div class="seg" style="margin:6px 0 12px">${BATCHES.map((b,i)=>`<button data-a="ob" data-v="${i}" class="${bi===i?'on':''}">${num(b.q)}</button>`).join('')}</div>
  <div class="card" style="background:var(--panel2)"><table><tr><td>Preis pro Stück</td><td>${fmt2(uc)}</td></tr><tr><td>Gesamt</td><td><b class="coin">${fmt(cost)}</b></td></tr><tr><td>Lieferung</td><td>in ${TIERS[t].lead} Tagen</td></tr><tr><td>Lager danach</td><td class="${after>stockCap()?'bad':''}">${num(after)} / ${num(stockCap())}</td></tr></table></div>
  ${t===3&&!S.up.lab?'':''}<div class="col" style="margin-top:14px"><button class="btn primary" data-a="buy" ${S.cash<cost||after>stockCap()?'disabled':''}>Bestellen · ${fmt(cost)}</button><button class="btn" data-a="close">Abbrechen</button></div>
  <div class="small muted" style="margin-top:8px">${S.staff.buyer?'Diese Auswahl gilt auch als Standard für den Einkäufer.':'Tipp: Mit „⚡“ bestellst du später per Klick dasselbe nochmal.'}</div>`;
 }else if(k==='hire'){
  const R=ROLES.find(r=>r.k===ui.sh.role),list=cands(R.k);
  h=`<div class="big">${R.e}</div><h2 style="text-align:center">${R.n} einstellen</h2><div class="small muted" style="text-align:center;margin-bottom:6px">${R.d}</div>
  ${list.map(c=>{const T=TRAITS[c.trait];return `<div class="cand"><div class="av">${c.av}</div><div style="min-width:0"><b>${esc(c.name)}</b> <span class="stars">${stars(c.lvl)}</span><div class="small"><span class="pill">${T.n}</span></div><div class="small muted">${T.d}</div><div class="small">${R.fx(LVLF[c.lvl]*T.eff*1.0)}</div></div><div style="text-align:right"><div class="small muted">${fmt(c.sal)}/Monat</div><button class="btn sm primary" data-a="hire" data-role="${R.k}" data-id="${c.id}" ${S.cash<c.sal?'disabled':''}>Einstellen</button></div></div>`;}).join('')}
  <div class="small muted" style="margin-top:8px">Neue Bewerber alle 14 Tage. Hohes Level und gute Stimmung machen den Effekt stärker.</div><div class="col" style="margin-top:12px"><button class="btn" data-a="close">Schließen</button></div>`;
 }else if(k==='event'){
  const ev=ui.ev,em=ev.title.split(' ')[0],ti=ev.title.slice(em.length).trim();
  h=`<div class="big">${em}</div><h2 style="text-align:center">${ti}</h2><p class="muted" style="text-align:center">${ev.text}</p>${ev.choices.map((c,i)=>`<button class="btn block" style="margin-top:8px" data-a="choice" data-i="${i}">${c.t}</button>`).join('')}`;
 }else if(k==='win'){
  h=`<div class="big">🦄</div><div class="title">EXIT!</div><p style="text-align:center">Ein Konzern kauft <b>${esc(S.brand)}</b>. Unternehmenswert <b class="coin">${fmt(S.val)}</b>.</p><p style="text-align:center">Dein Anteil (${pc(S.owned,0)}): <b class="good" style="font-size:22px">${fmt(S.val*S.owned)}</b></p><p class="muted small" style="text-align:center">Nach ${S.day} Tagen (${f1(S.day/360)} Jahren), ${num(S.totalOrders)} Bestellungen und ${fmt(S.totalRev)} Umsatz.</p><div class="col"><button class="btn primary" data-a="keep">Weiterspielen (Sandbox)</button><button class="btn" data-a="newgame">Neues Spiel</button></div>`;
 }else if(k==='over'){
  h=`<div class="big">💥</div><div class="title" style="color:var(--bad);text-shadow:none">INSOLVENZ</div><p style="text-align:center">${esc(S.brand)} war zu lange im Minus. Die Bank dreht den Geldhahn zu.</p><p class="muted small" style="text-align:center">${S.day} Tage · ${num(S.totalOrders)} Bestellungen · ${fmt(S.totalRev)} Umsatz.<br>Tipp: Halte Ware auf Lager, beobachte den ROAS und plane Cash für die Monatsabrechnung ein.</p><button class="btn primary block" data-a="newgame" style="text-align:center">Nochmal versuchen</button>`;
 }else if(k==='log'){
  h=`<h2>📜 Verlauf</h2>${S.log.slice(-40).reverse().map(l=>`<div class="small ${l.type}" style="padding:4px 0;border-bottom:1px solid var(--line)"><span class="muted">T${l.d}</span> ${l.msg}</div>`).join('')}<div class="col" style="margin-top:12px"><button class="btn" data-a="close">Schließen</button></div>`;
 }
 $('#sheet').innerHTML=`<div class="sbox">${h}</div>`;
 if(k==='start'){const i=$('#sn');if(i&&document.activeElement!==i&&!ui.sheetTouched){}}
}

/* ================= Render ================= */
function renderMain(force){
 const m=$('#main'),wb=`<div id="wb">${weekBanner()}</div>`;
 if(ui.tab==='home'){
  const sig=homeSig();
  if(!force&&ui.homeSig===sig&&$('#h-dyn')){$('#wb').innerHTML=weekBanner();$('#h-dyn').innerHTML=homeDyn();return;}
  ui.homeSig=sig;m.innerHTML=wb+vHome();return;
 }
 const v={prod:vProd,mkt:vMkt,firma:vFirma,fin:vFin}[ui.tab];m.innerHTML=wb+v();
}
function render(force){
 if(!S)return;updateHud();renderNav();
 if(ui.interacting)return;
 renderMain(force);
 if(ui.celebrate){ui.celebrate=0;confetti(24);sfx('win');}
}

/* ================= Game-Loop ================= */
const SPEEDS=[0,2200,900,350];let timer=null;
function schedule(){clearTimeout(timer);if(!S||ui.speed===0||S.over)return;timer=setTimeout(loop,SPEEDS[ui.speed]);}
function loop(){
 if(!ui.modal&&S&&!S.over){stepDay();dayFx();render();}
 schedule();
}
window.addEventListener('beforeunload',()=>{if(S&&!S.over)save();});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&ui.speed>0&&!ui.modal){setSpeed(0);}});
window.G={get S(){return S;},ACT,ui,stepDay,unitCost,newState,setS(s){S=s;},valuation,render,misCur,misDone,migrate};
(function init(){
 try{ui.sound=localStorage.getItem('bt.sound')!=='0';}catch(e){}
 ui.pa='hardcore';ui.pe='🔥';ui.pcol='#ff6a3d';ui.pfo='🧑‍💼';
 S=newState('NovaFuel','🔥','hardcore');genInfluencers();
 updateHud();render(true);openSheet('start');
})();

</script>
</body></html>
