<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Disco Manager</title>
<style>
:root{color-scheme:dark;--bg:#0b0618;--panel:#150c2b;--panel2:#1d1239;--line:#2e1f57;--txt:#efeaff;--dim:#9b8fc4;--pink:#ff2bd6;--cyan:#22e6ff;--yel:#ffe14d;--grn:#3dffa0;--red:#ff4d6d;--gold:#f5c04a}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 600px at 20% -10%,#2a0f55 0%,var(--bg) 60%);background-color:var(--bg);color:var(--txt);font:15px/1.4 system-ui,Segoe UI,Roboto,sans-serif;min-height:100vh}
header{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:10px 16px;background:#0e0820ee;border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
h1{margin:0;font-size:19px;letter-spacing:1px;background:linear-gradient(90deg,var(--pink),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
.stat{display:flex;flex-direction:column;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px}
.stat b{font-size:15px;color:var(--txt);text-transform:none;letter-spacing:0;font-variant-numeric:tabular-nums}
.spacer{flex:1}
main{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px;padding:14px 16px;max-width:1400px;margin:0 auto}
@media(max-width:900px){main{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}
canvas{width:100%;height:auto;border-radius:10px;background:#07040f;display:block;touch-action:pan-y}
canvas.edit{cursor:crosshair;touch-action:none}
button,select,input[type=text]{font:inherit;color:var(--txt);background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:6px 11px}
button{cursor:pointer}
button:hover:not(:disabled){border-color:var(--cyan)}
button:disabled{opacity:.4;cursor:not-allowed}
button.pri{background:linear-gradient(90deg,var(--pink),#8a3dff);border:0;font-weight:700}
button.on{border-color:var(--grn);color:var(--grn)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:1px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bars{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:8px;margin-top:10px}
.bar{background:#0a0616;border-radius:8px;padding:6px 8px;font-size:12px;color:var(--dim)}
.bar i{display:block;height:6px;border-radius:4px;background:#2a1d4d;margin-top:4px;overflow:hidden}
.bar i u{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--pink))}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tabs button.act{background:var(--pink);border-color:var(--pink);font-weight:700}
.item{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.item>div:first-child{min-width:0;flex:1 1 180px}
.item:last-child{border:0}
.item small{color:var(--dim);display:block}
.dim{color:var(--dim)}
.note{background:#0a0616;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:0 0 10px;font-size:13px;color:var(--dim)}
#news{margin-top:8px;font-size:13px;color:var(--yel)}
#log{height:140px;overflow:auto;font-size:13px;color:var(--dim);margin-top:10px}
#log div{padding:2px 0;border-bottom:1px dashed #241846}
.good{color:var(--grn)}.bad{color:var(--red)}.warn{color:var(--yel)}.gold{color:var(--gold)}
#modal{position:fixed;inset:0;background:#000b;display:none;align-items:flex-start;justify-content:center;z-index:10;padding:16px;overflow:auto}
#modal .box{background:var(--panel);border:1px solid var(--pink);border-radius:16px;padding:18px;max-width:560px;width:100%;box-shadow:0 0 40px #ff2bd655;margin:auto}
#modal h2{margin:0 0 10px}
table{width:100%;border-collapse:collapse}td{padding:4px 0;vertical-align:top}td:last-child{text-align:right}
.pm{display:flex;align-items:center;gap:8px}.pm b{min-width:62px;text-align:center}
.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:8px 0}
.pick button{text-align:left;padding:8px 10px}
.pick button small{display:block;color:var(--dim);font-size:11px}
.pick button.on small{color:var(--grn)}
.tool.sel button:first-child{border-color:var(--pink);background:#2d1250}
.iq{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px;background:#100824}
.iq.whale{border-color:var(--gold);box-shadow:0 0 14px #f5c04a33}
.iq h4{margin:0 0 2px;font-size:15px}
.sels{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px;margin:8px 0}
.sels label{font-size:11px;color:var(--dim);display:flex;flex-direction:column;gap:2px;min-width:0}
.sels select,.sels input{width:100%}
.chip{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:20px;padding:1px 8px;color:var(--dim)}
.meter{height:6px;border-radius:4px;background:#2a1d4d;margin:4px 0;overflow:hidden}.meter u{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--pink))}
.mini{display:inline-block;width:90px;height:6px;border-radius:4px;background:#2a1d4d;overflow:hidden;vertical-align:middle}.mini u{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--pink))}
.mini.me u{background:linear-gradient(90deg,var(--gold),var(--grn))}
</style>
</head>
<body>
<header>
  <h1>🪩 DISCO MANAGER</h1>
  <div class="stat">Geld<b id="hMoney"></b></div>

  <div class="stat">Hype<b id="hHype"></b></div>
  <div class="stat">Marktanteil<b id="hShare"></b></div>

  <div class="stat">Tag<b id="hDay"></b></div>
  <div class="stat">Uhrzeit<b id="hTime"></b></div>
  <div class="spacer"></div>
  <div class="row">
    <button id="bSound" title="Beat an/aus">🔇</button>
    <button data-sp="1">1×</button><button data-sp="2">2×</button><button data-sp="4">4×</button>
    <button id="bSkip" title="Club bleibt zu, Zeit vergeht">💤 Ruhetag</button>
    <button class="pri" id="bGo">🌙 Club öffnen</button>

</header>
<main>
  <section>
    <div class="card">

      <div id="news"></div>
      <div class="bars" id="bars"></div>
      <div id="log"></div>
    </div>
  </section>
  <section class="card">
    <div class="tabs" id="tabs"></div>
    <div id="panel"></div>
  </section>
</main>
<div id="modal"><div class="box" id="mbox"></div></div>

// ---------- Markt, Ansehen, Vermögen ----------
function marketM(){
  const ex=exclusivity(),Zc=.35+S.hype/32;let sw=0,sz=0,all=Zc;
  const add=(h,e,k)=>{const z=(.35+h/32)*k,w=Math.exp(-Math.pow((e-ex)/35,2));sw+=w;sz+=w*z;all+=z};
  S.rivals.forEach(r=>add(r.h,r.ex,.85));
  S.clubs.forEach((c,i)=>{if(i!==S.ci)add(c.hype,c.exc||50,.5)});
  return{m:Zc/(Zc+sz)*(1+sw)*1.1,share:Zc/all};
}
const clubHype=i=>i===S.ci?S.hype:S.clubs[i].hype;
function ansehen(){
  const avg=S.clubs.reduce((a,c,i)=>a+clubHype(i),0)/S.clubs.length;
  const as=ASSETS.reduce((a,x)=>a+(S.assets[x.id]?x.a:0),0);
  return clamp(as+S.fame+avg*.35+(S.clubs.length-1)*1.5+marketM().share*30,0,100);
}
function clubValue(i){

  return Math.round(l.price*.6+gridCost(c.grid)*.5+c.hype*l.price*.01);

// ---------- Layout ----------
function layoutPlan(gw,gh,c){
  const g=emptyGrid(gw,gh),cx=Math.floor(gw/2);
  const free=(x,y)=>x>=0&&y>=0&&x<gw&&y<gh&&!g[y][x];
  const put=(t,n,cands)=>{let k=0;for(const[x,y]of cands){if(k>=n)break;if(free(x,y)){g[y][x]=t;k++}}
    for(let y=0;y<gh&&k<n;y++)for(let x=0;x<gw&&k<n;x++)if(free(x,y)){g[y][x]=t;k++}};
  const xs=[...Array(gw).keys()],byC=xs.slice().sort((a,b)=>Math.abs(a-cx)-Math.abs(b-cx)),far=byC.slice().reverse();
  const col=(x,y0,y1)=>{const r=[];for(let y=y0;y<=y1;y++)r.push([x,y]);return r};
  put('dj',1,[[cx,0]]);
  put('speaker',Math.ceil(c/70),far.map(x=>[x,0]).concat(far.map(x=>[x,1])));
  put('light',Math.ceil(c/90),byC.map(x=>[x,0]).concat(byC.map(x=>[x,1])));
  put('bar',Math.max(1,Math.ceil(c/60)),col(0,2,gh-2).concat(col(1,2,gh-2)));
  put('vip',clamp(Math.round(c/45),1,16),col(gw-1,2,gh-2).concat(col(gw-2,2,gh-2)));
  put('toilet',Math.ceil(c/50),xs.map(x=>[x,gh-1]).concat(xs.map(x=>[x,gh-2])));
  put('sofa',Math.ceil(c/30),far.map(x=>[x,gh-1]).concat(xs.map(x=>[x,gh-2])));
  put('coat',1,[[cx,gh-1]]);
  const mid=[];for(let y=2;y<=gh-3;y++)for(let x=2;x<=gw-3;x++)mid.push([x,y]);
  mid.sort((a,b)=>Math.hypot(a[0]-gw/2,a[1]-gh/2)-Math.hypot(b[0]-gw/2,b[1]-gh/2));
  put('floor',Math.ceil(c/8),mid);
  return g;
}
const gridCost=g=>g.reduce((a,r)=>a+r.reduce((b,t)=>b+(t?ITEMS[t].c:0),0),0);
function furnish(){
  if(S.phase!=='plan')return;
  const plan=layoutPlan(S.gw,S.gh,cap()),net=gridCost(plan)-gridCost(S.grid)*.5;
  if(S.book.length){log('Mit Reservierungen geht Neuaufbau nicht: Tische sind vergeben.','warn');return}
  if(S.setup&&net>S.money){log('Nicht genug Geld für die Grundausstattung ('+eur(net)+').','bad');return}
  if(S.setup)S.money-=net;
  S.grid=plan;calcLayout();save();log('Club eingerichtet.','good');renderAll();
}
function clearClub(){
  if(S.phase!=='plan'||S.book.length)return;
  S.money+=gridCost(S.grid)*.5;S.grid=emptyGrid(S.gw,S.gh);calcLayout();save();renderAll();
}
function setTool(t){tool=tool===t?null:t;renderAll()}
function editCell(x,y){
  if(S.phase!=='plan'||!tool)return;
  if(x<0||y<0||x>=S.gw||y>=S.gh)return;
  const cur=S.grid[y][x];
  if(tool==='erase'){
    if(!cur)return;
    if(cur==='vip'&&S.book.some(b=>b.tx===x&&b.ty===y)){log('Dieser VIP-Tisch ist reserviert.','warn');return}
    S.money+=ITEMS[cur].c*.5;S.grid[y][x]=null;
  }else{
    if(cur)return;
    const it=ITEMS[tool];
    if(it.max&&L[tool]>=it.max){log(it.n+': nur '+it.max+' möglich.','warn');return}
    if(S.money<it.c){log('Zu wenig Geld für '+it.n+'.','warn');return}
    S.money-=it.c;S.grid[y][x]=tool;
  }
  calcLayout();save();renderHeader();renderBars();renderPanelSoft();
}
function resizeClub(dw,dh){
  if(S.phase!=='plan')return;
  const nw=clamp(S.gw+dw,MINW,MAXW),nh=clamp(S.gh+dh,MINH,MAXH);
  if(nw===S.gw&&nh===S.gh)return;
  const wasFull=S.limit>=maxCap();
  let cost=0;const g=emptyGrid(nw,nh);
  if(nw*nh>S.gw*S.gh)cost=(nw*nh-S.gw*S.gh)*150;
  for(let y=0;y<S.gh;y++)for(let x=0;x<S.gw;x++){
    const t=S.grid[y][x];
    if(x<nw&&y<nh)g[y][x]=t;
    else{ if(t==='vip'&&S.book.some(b=>b.tx===x&&b.ty===y)){log('Umbau blockiert: VIP-Tisch im Abrissbereich ist reserviert.','warn');return}
      if(t)cost-=ITEMS[t].c*.5}
  }
  if(nw*nh<S.gw*S.gh)cost-=(S.gw*S.gh-nw*nh)*30;
  if(cost>S.money){log('Zu wenig Geld für den Anbau ('+eur(cost)+').','bad');return}
  S.money-=cost;S.gw=nw;S.gh=nh;S.grid=g;
  S.limit=wasFull?maxCap():Math.min(S.limit,maxCap());
  calcLayout();save();
  log((cost>=0?'Umbau: ':'Rückbau: ')+nw+'×'+nh+' Felder, Kapazität '+maxCap()+(cost?' ('+(cost>0?'Kosten ':'Erlös ')+eur(Math.abs(cost))+')':''),cost>0?'warn':'good');renderAll();
}

function limitTo(f){S.limit=clamp(Math.round(maxCap()*f/10)*10,20,maxCap());calcLayout();if(S.phase==='plan')save();renderAll()}

const chFit=k=>CH[k].fit[S.cli];
function campEffect(c){
  const ch=CH[c.ch],f=chFit(c.ch);
  if(c.target==='club'){S.hype=clamp(S.hype+ch.b*f*(1-S.hype/110),0,100)}
  else{const e=S.events.find(x=>x.id===+c.target);if(e)e.buzz=clamp(e.buzz+ch.b*f*7*(1-e.buzz/110),0,100)}
  S.list+=ch.l*f*(c.ch==='list'?(.5+S.hype/40):.8);
}
function processCamp(c){
  const ch=CH[c.ch];
  if(c.target!=='club'&&!S.events.some(x=>x.id===+c.target)){c.left=0;return}
  if(S.money<ch.c){c.left=0;log('Kampagne „'+ch.n+'“ gestoppt: kein Geld.','bad');return}
  S.money-=ch.c;campEffect(c);c.left--;
}
function startCamp(){
  if(S.phase!=='plan')return;
  const ch=$('cpCh').value,tg=$('cpTg').value,days=+$('cpDays').value;
  if(S.camps.some(c=>c.ch===ch&&c.target===tg)){log('Diese Kampagne läuft schon.','warn');return}
  if(S.money<CH[ch].c){log('Zu wenig Geld.','bad');return}
  const c={id:S.cId++,ch,target:tg,left:days};
  processCamp(c);if(c.left>0)S.camps.push(c);
  log('Kampagne gestartet: '+CH[ch].n+' ('+days+' Tage).','good');save();renderAll();
}
function stopCamp(id){S.camps=S.camps.filter(c=>c.id!==id);save();renderAll()}

function planEvent(){
  if(S.phase!=='plan')return;
  const ty=ETYPE[ef.type],day=+(ef.day||S.day),nm=($('evName').value||'').trim()||ty.n;
  if(ty.minH&&S.hype<ty.minH){log(ty.n+' erst ab Hype '+ty.minH+'.','warn');return}
  if(S.money<ty.c){log('Zu wenig Geld für das Event.','bad');return}
  if(S.events.some(e=>e.day===day)){log('An dem Tag ist schon ein Event.','warn');return}
  S.money-=ty.c;
  S.events.push({id:S.evId++,type:ef.type,name:nm,day,acts:[],buzz:ty.b,series:ef.series,lvl:0});
  S.events.sort((a,b)=>a.day-b.day);ef.day=null;
  log('Event geplant: '+nm+' ('+wd(day)+', Tag '+day+').','good');save();renderAll();
}
function cancelEvent(id){

function bookAct(eid){

  const avail=ACTS.filter(a=>!e.acts.includes(a.id)),aid=UI['act'+eid]||(avail[0]&&avail[0].id),a=ACTS.find(x=>x.id===aid);

function genInquiries(){
  const base=vipBase(),out=[],ans=ansehen();
  const mk=(day,buzz,evId)=>{
    const pool=IQ.filter(t=>t.minH<=S.hype+8&&(t.minAns||0)<=ans),whales=pool.filter(t=>t.whale),normal=pool.filter(t=>!t.whale);
    const ty=(whales.length&&Math.random()<.22)?pick(whales):pick(normal),size=ri(ty.size[0],ty.size[1]);
    out.push({id:S.iqId++,day,ev:evId,whale:!!ty.whale,name:ty.n+' '+pick(NAMES),size,genre:pick(Object.keys(GENRES)),budget:Math.max(250,Math.round(base*ty.mult*rnd(.8,1.8)*size/6*(1+buzz/60)/50)*50)});
  };
  const n=clamp(Math.round(rnd(0,2)+S.hype/30+CLI[S.cli].vipRate*1.5),0,6);
  for(let i=0;i<n;i++)mk(S.day,0,null);
  for(const e of S.events){
    if(e.day===S.day){for(let i=0;i<Math.round(e.buzz/30);i++)mk(S.day,e.buzz,e.id)}
    else if(e.day>S.day&&e.day-S.day<=10&&Math.random()<e.buzz/90+.1)mk(e.day,e.buzz,e.id);
  }
  return out.slice(0,12);
}

// ---------- Nächtliche Extra-Wünsche ----------
function makeReq(g){
  const head=g.bud-g.price-g.up;if(head<150)return;
  let kind='bot',key,qty=1;
  const shows=Object.keys(SHW).filter(k=>k!=='none'&&S.own[k]&&sp(k)<=head&&(!SHW[k].host||S.staff.host>0));
  if(shows.length&&Math.random()<.35){kind='show';key=pick(shows)}

      const tg=55+(g.genre===gen?18:0)+L.soundF*10+hostF()*14+L.sofaF*5+(L.style||0)*.5-S.mess*.3-(L.toiletF<1?5:0)-(G.length/c>.9?8:0)+gm;
      g.mood+=(tg-g.mood)*.25;g.sum+=g.mood;g.n++;
      if(!g.showDone&&g.show!=='none'&&S.t>=g.at){g.showDone=true;doShow(g,SHW[g.show])}
      if(S.staff.host>0&&S.t<36&&g.mood>55&&!S.reqs.some(r=>r.gid===g.id)&&Math.random()<.14*hostF()){

  }

  if(S.t>=6&&S.t<=30&&L.vip){
    const ft=freeTables(S.day).filter(([x,y])=>!S.groups.some(g=>g.tx===x&&g.ty===y)),wf=clamp(1.3-S.vipWalk/vipBase(),.05,1.2);
    if(ft.length&&Math.random()<.05*C.vipRate*(1+S.hype/50)*wf*(.5+fit/2)){
      const t=pick(ft);
      S.groups.push({id:'w'+S.t+t[0]+t[1],walk:true,name:'Spontane Gäste',size:ri(3,6),genre:pick(Object.keys(GENRES)),tx:t[0],ty:t[1],pkg:'basic',qty:1,show:'none',at:99,price:S.vipWalk,bud:S.vipWalk*2.5,up:0,cost:S.vipWalk*.3,dep:0,arrive:S.t,state:'seated',mood:60,sum:0,n:0,showDone:false});
      log('👑 Spontane Gäste mieten einen VIP-Tisch ('+eur(S.vipWalk)+').','gold');
    }
  }
  const hourF=Math.exp(-Math.pow((S.t-20)/14,2))*.9+.1;
  const r=S.price.entry/C.entry,priceF=r<=1?1+(1-r)*.3:Math.max(.1,1-(r-1)*.7);
  const boost=S.boost>0?2:1;if(S.boost>0)S.boost--;
  const mk=marketM();
  const want=c*.04*mk.m*LOC[S.loc].dem*seasonF()*hourF*priceF*C.arr*(.3+.7*fit)*D.arr*evMult(e)*S.news.arr*(.6+.4*S.trend[gen])*boost*(L.dj?1:.8)*wdF(S.day)*rnd(.8,1.2);
  const door=Math.floor(6+S.staff.sec*5+c/40);
  const people=G.length+seated().reduce((a,g)=>a+g.size,0);

  N.wanted+=w0;N.turned+=Math.max(0,w0-arrive);N.queue=N.queue*.7+Math.max(0,w0-arrive);
  for(let i=0;i<arrive;i++){G.push(newGuest(false));N.guests++;N.entry+=S.price.entry;S.money+=S.price.entry;
    if(L.coat){const cc=2*L.coatF;N.coat+=cc;S.money+=cc}}
  if(S.t<32)N.pool+=N.coming*N.w[S.t]/N.wsum;
  let la=Math.floor(N.pool);const lw=la;N.pool-=la;
  la=S.doorClosed?0:Math.max(0,Math.min(la,door-arrive,c-people-arrive));N.turned+=Math.max(0,lw-la);
  for(let i=0;i<la;i++){G.push(newGuest(true));N.guests++;N.listIn++;const p=S.price.entry*.5;N.entry+=p;S.money+=p;
    if(L.coat){const cc=2*L.coatF;N.coat+=cc;S.money+=cc}}

    if(dens>.85)tg-=(dens-.85)*80*(1+ex/100);

    }
  }
  if(fights){G.forEach(g=>{if(Math.random()<.15)g.mood-=12});S.hype=clamp(S.hype-.5,0,100);log('👊 Schlägerei! Hype sinkt.','bad')}
  let slots=Math.min(S.staff.bar*7,L.bar*6+2);const cost=1.2+ex/70;

function settle(){
  const N=S.night,e=todayEvent(),avg=N.moodN?N.moodSum/N.moodN:50,costs=nightCosts();
  let vipLines='',vH=0;
  for(const g of S.groups){

    const sat=(g.n?g.sum/g.n:50)+(g.showDone?8:0),f=sat<45?.5:1,tip=sat>78?1.1:1;
    const total=Math.round(g.price*(g.walk?rnd(.8,1.4):1)*f*tip),pay=total-g.dep;
    S.money+=pay;N.vip+=total;N.vipCost+=g.cost;
    if(sat<45)vH-=1;else if(sat>78)vH+=.5;
    vipLines+=`<tr><td>${g.name}${g.up?' (+'+eur(g.up)+' Extras)':''}</td><td>${sat<45?'<span class="bad">unzufrieden</span>':sat>78?'<span class="good">begeistert</span>':'zufrieden'} · ${eur(total)}</td></tr>`;
  }
  S.money-=N.vipCost;
  const vipNet=N.vip+N.up-N.vipCost,profit=N.entry+N.drinks+N.coat+vipNet-costs;
  S.money-=costs;
  const fill=N.peak/cap(),qIdx=N.turned/cap();
  let dH=(avg-65)/18*clamp(fill/.5,.3,1.2)+S.bonus*.4-S.fights*.5+vH+(DOORS[S.door].ex>=8?.1:0);

  }

    if(e.series){const ty=ETYPE[e.type],nd=e.day+7;
      if(S.money>=ty.c&&!S.events.some(x=>x.day===nd)){S.money-=ty.c;
        S.events.push({id:S.evId++,type:e.type,name:e.name,day:nd,acts:[],buzz:clamp(ty.b+(e.lvl+1)*6+e.buzz*.4,0,100),series:true,lvl:e.lvl+1});

  S.staff.sec=Math.max(2,Math.round(cap()/80));S.staff.bar=Math.max(1,Math.ceil(cap()/60));
  S.setup=true;newDayGlobal();newDayClub();save();closeModal();log('Willkommen, Manager! Du bist noch unbekannt. Hype musst du dir erarbeiten.');renderAll();

function setCli(k){
  if(S.phase!=='plan'||k===S.cli)return;
  if(S.money<1500){log('Neupositionierung kostet 1.500 €.','bad');return}
  S.money-=1500;S.hype=Math.max(0,S.hype-8);S.cli=k;S.price.entry=CLI[k].entry;S.price.drink=CLI[k].drink;
  log('Neue Zielgruppe: '+CLI[k].n+'. Hype −8.','warn');save();renderAll();
}
function setDoor(i){S.door=i;if(S.phase==='plan')save();renderAll()}

// ---------- Stadt: Clubs kaufen, verkaufen, wechseln ----------
function switchClub(i){
  if(S.phase!=='plan'||i===S.ci)return;
  stash();unstash(i);calcLayout();UI={};tool=null;save();renderAll();log('Du bist jetzt im '+S.name+'.');
}
function buyLoc(id){
  const l=LOC[id];
  if(S.phase!=='plan'||S.money<l.price||ansehen()<l.a||S.clubs.some(c=>c.loc===id))return;
  S.money-=l.price;stash();
  const c=mkClub(id);c.hype=Math.round(4+ansehen()*.15);S.clubs.push(c);unstash(S.clubs.length-1);calcLayout();
  S.inq=genInquiries();tab='build';save();renderAll();
  log('Neuer Club gekauft: '+l.n+'. Richte ihn ein und stelle einen Geschäftsführer ein.','good');
}
function setMgr(i,d){
  const cur=i===S.ci?S.mgr:S.clubs[i].mgr,v=clamp(cur+d,0,3);
  if(i===S.ci)S.mgr=v;else S.clubs[i].mgr=v;
  save();renderAll();
}
function askSell(i){
  const nm=i===S.ci?S.name:S.clubs[i].name,v=clubValue(i);
  showModal(`<h2>„${nm}“ verkaufen?</h2><p>Du bekommst ${eur(v)}. Reservierungen verfallen, die Anzahlungen gehen zurück.</p><p><button class="pri" onclick="sellClub(${i})">Verkaufen</button> <button onclick="closeModal()">Abbrechen</button></p>`);
}
function sellClub(i){
  closeModal();
  if(S.phase!=='plan'||S.clubs.length<2)return;
  const v=clubValue(i),c=i===S.ci?S:S.clubs[i],dep=c.book.reduce((a,b)=>a+b.dep,0),nm=c.name;
  stash();S.money+=v-dep;S.clubs.splice(i,1);
  const ni=Math.min(i===S.ci?0:(S.ci>i?S.ci-1:S.ci),S.clubs.length-1);unstash(ni);calcLayout();
  S.ansDirty=1;save();renderAll();log(nm+' verkauft für '+eur(v)+'.','warn');
}

function act(kind,key){
  if(kind==='hire'){if(S.staff[key]<maxStaff())S.staff[key]++}
  if(kind==='fire'){if(S.staff[key]>0)S.staff[key]--}
  if(kind==='dj'){const d=DJS[key];if(S.hype<d.h)return;S.staff.dj=+key;log('DJ: '+d.n)}
  if(kind==='genre'){S.genre=key;log('Musik: '+GENRES[key].n);if(soundOn)startBeat()}
  if(kind==='entry')S.price.entry=clamp(S.price.entry+(+key),0,150);
  if(kind==='drink')S.price.drink=clamp(+(S.price.drink+(+key)).toFixed(1),1,40);
  if(kind==='walk')S.vipWalk=clamp(S.vipWalk+(+key),50,50000);
  if(kind==='auto')S.autoNeg=!S.autoNeg;
  if(kind==='loan'){const v=+key;if(v>0&&S.loan+v<=500000){S.loan+=v;S.money+=v}else if(v<0&&S.money>=-v&&S.loan>=-v){S.loan+=v;S.money+=v}}
  if(S.phase==='plan')save();
  renderAll();
}

       <label>Anzahl<select onchange="setSel(${q.id},'qty',this.value);renderPanel()">${[1,2,3,5,8,12,20].map(n=>opt(n,u.qty,n+'×')).join('')}</select></label>
       <label>Show<select onchange="setSel(${q.id},'show',this.value);renderPanel()">${Object.keys(SHW).filter(k=>S.own[k]).map(k=>opt(k,u.show,SHW[k].n+(sp(k)?' +'+eur(sp(k)):''))).join('')}</select></label>
       <label>Showzeit<select onchange="setSel(${q.id},'at',this.value)">${SHOWTIMES.map(t=>opt(t,u.at,hourStr(t))).join('')}</select></label></div>
       <div class="row"><span>Angebot: <b class="${price<=q.budget?'good':'bad'}">${eur(price)}</b> <span class="dim">(Kosten ${eur(BOT[u.pkg].c*u.qty+SHW[u.show].c)})</span></span><div class="spacer"></div>
       <button class="pri" ${ok?'':'disabled'} onclick="acceptInq(${q.id})">Zusagen</button><button onclick="declineInq(${q.id})">Ablehnen</button></div></div>`});
  }
  if(tab==='menu'){
    h+='<div class="note">Lege hier fest, was du anbietest und was es kostet. Neue Flaschen und Shows schaltest du einmal frei (Hype nötig), dann stehen sie bei Reservierungen und für nächtliche Extras zur Verfügung. Den Preis legst du selbst fest. Zu teuer mindert die Zufriedenheit nicht, aber Gäste mit kleinem Budget können sich weniger leisten.</div><b>Flaschen</b>';
    for(const k in BOT){const d=BOT[k],own=S.own[k],lock=S.hype<d.h;
      h+=item(d.n,`${d.d} · Einkauf ${eur(d.c)}${own?' · Gewinn '+eur(bp(k)-d.c):''}${!own?' · Freischaltung '+eur(d.setup)+(d.h?' · ab Hype '+d.h:''):''}`,
       own?`<div class="pm"><button onclick="menuPrice('b','${k}',-1)">−</button><b>${eur(bp(k))}</b><button onclick="menuPrice('b','${k}',1)">+</button></div>`:`<button ${lock||S.money<d.setup?'disabled':''} onclick="unlockMenu('b','${k}')">${lock?'🔒':'Freischalten'}</button>`)}
    h+='<br><b>Shows</b>';
    for(const k in SHW){if(k==='none')continue;const d=SHW[k],own=S.own[k],lock=S.hype<d.h;
      h+=item(d.n,`${d.d} · Kosten ${eur(d.c)}${d.host?' · braucht VIP-Host':''}${own?' · Gewinn '+eur(sp(k)-d.c):''}${!own?' · Freischaltung '+eur(d.setup)+(d.h?' · ab Hype '+d.h:''):''}`,
       own?`<div class="pm"><button onclick="menuPrice('s','${k}',-1)">−</button><b>${eur(sp(k))}</b><button onclick="menuPrice('s','${k}',1)">+</button></div>`:`<button ${lock||S.money<d.setup?'disabled':''} onclick="unlockMenu('s','${k}')">${lock?'🔒':'Freischalten'}</button>`)}
  }
  if(tab==='music'){
    h+='<div class="note">Jeden Tag ändern sich die Trends. Deine Klientel ('+C.n+') mag: '+C.genres.map(g=>GENRES[g].n).join(', ')+'. Bei Events spielt der gebuchte Act zur Hauptzeit sein Genre.</div>';
    for(const g in GENRES){const tr=S.trend[g];
      h+=item(`<b style="color:${GENRES[g].c}">${GENRES[g].n}</b> ${C.genres.includes(g)?'<span class="chip good">Zielgruppe</span>':''}`,`Trend: ${tr>=1.15?'🔥 heiß':tr>=.9?'normal':'❄️ kalt'} (${Math.round(tr*100)} %) · ${GENRES[g].bpm} BPM`,`<button class="${S.genre===g?'on':''}" onclick="act('genre','${g}')">${S.genre===g?'Läuft':'Spielen'}</button>`)}
  }
  if(tab==='staff'){
    h+=`<div class="note">Kosten pro Nacht: <b>${eur(nightCosts())}</b> (inkl. Miete ${eur(rent())}). Max. ${maxStaff()} je Berufsgruppe. Empfehlung: ${Math.ceil(cap()/60)} Barkeeper, ${Math.max(2,Math.round(cap()/40))} Security.</div><b>DJ</b>`;
    DJS.forEach((d,i)=>{const lock=S.hype<d.h;h+=item(d.n,`${eur(d.w)}/Nacht · Skill ${d.skill}${d.h?' · ab Hype '+d.h:''}${L.dj?'':' · braucht DJ-Pult'}`,`<button class="${S.staff.dj===i?'on':''}" ${lock?'disabled':''} onclick="act('dj',${i})">${S.staff.dj===i?'Aktiv':lock?'🔒':'Buchen'}</button>`)});
    h+='<br><b>Team</b>';
    for(const k in STAFF){const st=STAFF[k];h+=item(`${st.n} ×${S.staff[k]}`,`${st.d} · ${eur(st.w)}/Nacht`,`<button onclick="act('fire','${k}')" ${S.staff[k]<1?'disabled':''}>−</button><button onclick="act('hire','${k}')" ${S.staff[k]>=maxStaff()?'disabled':''}>+</button>`)}
  }
  if(tab==='price'){
    h+=`<div class="note">Dein Publikum erwartet ca. ${eur(C.entry)} Eintritt und ${eur(C.drink)} pro Drink. Deutlich darüber schreckt Gäste ab, deutlich darunter verschenkt Geld. Gäste von der Gästeliste zahlen nur den halben Eintritt.</div>`;
    h+=item('Eintritt','Zu teuer: weniger Gäste',`<div class="pm"><button onclick="act('entry',-1)">−</button><b>${eur(S.price.entry)}</b><button onclick="act('entry',1)">+</button></div>`);
    h+=item('Getränkepreis','Über dem 1,4-fachen sinkt die Stimmung',`<div class="pm"><button onclick="act('drink',-.5)">−</button><b>${S.price.drink.toFixed(2).replace('.',',')} €</b><button onclick="act('drink',.5)">+</button></div>`);
  }
  if(tab==='city'){
    const mk=marketM(),ex=exclusivity();
    const rows=S.rivals.map(r=>({n:r.n,h:r.h,own:0,z:(.35+r.h/32)*.85})).concat(S.clubs.map((c,i)=>({n:c.name,h:clubHype(i),own:1,z:(.35+clubHype(i)/32)*(i===S.ci?1:.5),act:i===S.ci})));
    const tot=rows.reduce((a,r)=>a+r.z,0);rows.sort((a,b)=>b.z-a.z);
    h+=`<div class="note">In der Stadt gehen nur so viele Leute aus, wie sie verteilen können. Dein Marktanteil richtet sich nach dem Hype im Vergleich zur Konkurrenz mit ähnlicher Klientel. „${S.name}“ hat <b>${Math.round(mk.share*100)} %</b>. Ab 25 % reagieren die Rivalen mit mehr Werbung.</div><b>Marktanteil</b><table>`;
    h+=rows.map((r,i)=>`<tr><td>${i+1}. ${r.own?'<b class="gold">'+r.n+'</b>':r.n}</td><td><span class="mini ${r.own?'me':''}"><u style="width:${r.h}%"></u></span> 🔥${Math.round(r.h)} · ${Math.round(r.z/tot*100)} %</td></tr>`).join('')+'</table><br><b>Meine Clubs</b>';
    S.clubs.forEach((c0,i)=>{const c=i===S.ci?S:c0;
      h+=item((i===S.ci?'▶ ':'')+c.name,`${LOC[c.loc].t} · ${c.gw}×${c.gh} · ${CLI[c.cli].n} · Hype ${Math.round(clubHype(i))} · Wert ${eur(clubValue(i))}<br>${GMN[c.mgr]}${c.mgr?' ('+eur(GMW[c.mgr])+'/Nacht, leitet den Club wenn du woanders bist)':': Club bleibt zu, wenn du nicht selbst da bist'}`,
       `<button ${plan&&i!==S.ci?'':'disabled'} onclick="switchClub(${i})">${i===S.ci?'Aktiv':'Wechseln'}</button><button ${c.mgr>0?'':'disabled'} onclick="setMgr(${i},-1)">GF −</button><button ${c.mgr<3?'':'disabled'} onclick="setMgr(${i},1)">GF +</button><button ${plan&&S.clubs.length>1?'':'disabled'} onclick="askSell(${i})">Verkaufen</button>`)});
    h+='<br><b>Standorte</b>';
    const ans=ansehen();
    for(const id in LOC){const l=LOC[id];if(S.clubs.some(c=>c.loc===id))continue;const ok=plan&&S.money>=l.price&&ans>=l.a;
      h+=item(l.n,`${l.t} · ${l.gw}×${l.gh} Felder · Nachfrage ×${l.dem} · Miete ×${l.rent} · VIP ×${l.vip}${l.season?' · saisonabhängig':''}<br>${l.d} Empfohlene Klientel: ${CLI[l.cli].n}.`,
       `<span class="chip ${ans>=l.a?'good':'bad'}">Ansehen ${l.a}</span><button ${ok?'':'disabled'} onclick="buyLoc('${id}')">${eur(l.price)}</button>`)}
  }
  if(tab==='wealth'){
    const ans=ansehen(),as=ASSETS.reduce((a,x)=>a+(S.assets[x.id]?x.a:0),0),avg=S.clubs.reduce((a,c,i)=>a+clubHype(i),0)/S.clubs.length;
    h+=`<div class="note"><b>Ansehen ${Math.round(ans)}</b> setzt sich zusammen aus Besitztümern (${as}), Ruf in der Presse (${Math.round(S.fame)}), dem Hype deiner Clubs (${Math.round(avg*.35)}), der Anzahl deiner Clubs (${(S.clubs.length-1)*1.5}) und deinem Marktanteil (${Math.round(marketM().share*30)}). Mit hohem Ansehen schaltest du bessere Standorte und Stargäste frei. Dein Privatvermögen ist von der Firma getrennt.</div>`;
    h+=`<table><tr><td>Firmenkonto</td><td>${eur(S.money)}</td></tr><tr><td>Privatvermögen</td><td>${eur(S.priv)}</td></tr><tr><td>Kredit</td><td>${eur(S.loan)}</td></tr><tr><td>Gesamtvermögen inkl. Clubs</td><td><b>${eur(worth())}</b></td></tr></table>`;
    h+=`<div class="row" style="margin:8px 0"><span class="dim">Entnahme:</span><button onclick="transfer(10000)">10 T €</button><button onclick="transfer(100000)">100 T €</button><span class="dim">Einlage:</span><button onclick="transfer(-10000)">10 T €</button><button onclick="transfer(-100000)">100 T €</button></div>`;
    h+='<b>Besitztümer</b>';
    ASSETS.forEach(a=>{h+=item(a.n,`Ansehen +${a.a} · ${eur(a.c)} aus dem Privatvermögen`,S.assets[a.id]?'<span class="chip good">Im Besitz</span>':`<button ${S.priv>=a.c?'':'disabled'} onclick="buyAsset('${a.id}')">Kaufen</button>`)});
    h+=item('Charity-Gala','30.000 € privat, +4 Presse-Ansehen. Wirkt nur eine Weile (Ruf in der Presse ${Math.round(S.fame)}).',`<button ${S.priv>=30000?'':'disabled'} onclick="gala()">Veranstalten</button>`);
    h+=`<p class="dim" style="font-size:13px">Ziel: Gesamtvermögen ${eur(GOAL_WORTH)} und Ansehen ${GOAL_ANS}.</p>`;
  }
  if(tab==='stats'){
    h+=`<table><tr><td>Gesamtgewinn</td><td>${eur(S.total)}</td></tr><tr><td>Kredit</td><td>${eur(S.loan)} (1 % Zinsen/Tag)</td></tr><tr><td>Gäste im Club</td><td>${S.guests.length}</td></tr><tr><td>Schlägereien heute</td><td>${S.fights}</td></tr><tr><td>Werbekosten pro Tag</td><td>${eur(campCost())}</td></tr></table>
    <div class="row" style="margin:8px 0"><button onclick="act('loan',50000)" ${S.loan>=500000?'disabled':''}>+50.000 € Kredit</button><button onclick="act('loan',-50000)" ${S.loan<50000||S.money<50000?'disabled':''}>50.000 € tilgen</button></div>
    <b>Letzte Nächte</b><table>`;
    h+=S.history.length?S.history.map(x=>`<tr><td>Tag ${x.day} (${wd(x.day)}) · ${x.club||''} · ${x.guests} Gäste · ${x.mood} %</td><td class="${x.profit>=0?'good':'bad'}">${eur(x.profit)}</td></tr>`).join(''):'<tr><td>Noch keine Nacht gespielt.</td></tr>';
    h+='</table><p><button onclick="askReset()">Neues Spiel</button></p>';
  }
  $('panel').innerHTML=h;
}
function renderAll(){renderHeader();renderBars();renderTabs();renderPanel()}

// ---------- Canvas ----------
const cv=$('cv'),cx=cv.getContext('2d');
function draw(ts){
  const cs=CW/S.gw,open=S.phase==='night',gen=curGenre(),col=GENRES[gen].c,bpm=GENRES[gen].bpm;
  const beat=ts/(60000/bpm),W=cv.width,H=cv.height,e=todayEvent();
  cx.fillStyle='#07040f';cx.fillRect(0,0,W,H);
  cx.fillStyle='#9b8fc4';cx.font='12px system-ui';cx.textAlign='left';
  cx.fillText(S.name+' · '+S.gw+'×'+S.gh+' · '+GENRES[gen].n+(e?' · 🎉 '+e.name:''),8,21);
  for(let y=0;y<S.gh;y++)for(let x=0;x<S.gw;x++){
    const px=x*cs,py=HDR+y*cs,t=S.grid[y]&&S.grid[y][x];
    cx.fillStyle=(x+y)%2?'#0d0820':'#0a061a';cx.fillRect(px,py,cs,cs);
    if(t==='floor'){const v=open?(Math.sin(beat*Math.PI*2/(1+(x+y)%4)+x*.7+y*.9)+1)/2:.3;
      cx.globalAlpha=.12+v*(.25+L.lightF*.35);cx.fillStyle=((x+y+Math.floor(beat))%3===0&&open)?'#ff2bd6':col;cx.fillRect(px+1,py+1,cs-2,cs-2);cx.globalAlpha=1}
    else if(t){
      cx.fillStyle=t==='vip'?'#3a2a0c':t==='bar'?'#3b1f12':'#1d1239';cx.fillRect(px+1,py+1,cs-2,cs-2);
      if(t==='vip'){cx.strokeStyle='#f5c04a';cx.strokeRect(px+1.5,py+1.5,cs-3,cs-3)}
      let sc=1;if(t==='speaker'&&open)sc=1+Math.abs(Math.sin(beat*Math.PI))*.15;
      cx.font=Math.round(cs*.6*sc)+'px serif';cx.textAlign='center';cx.textBaseline='middle';cx.fillStyle='#fff';
      cx.fillText(ITEMS[t].e,px+cs/2,py+cs/2+1);cx.textBaseline='alphabetic';
    }
  }
  for(const g of S.groups){const px=g.tx*cs,py=HDR+g.ty*cs;
    if(g.state==='seated'){cx.fillStyle=g.whale?'#ffd70088':'#f5c04a55';cx.fillRect(px,py,cs,cs);cx.fillStyle='#fff';cx.font='bold '+Math.round(cs*.32)+'px system-ui';cx.textAlign='center';cx.fillText((S.reqs.some(r=>r.gid===g.id)?'❗':'🥂')+g.size,px+cs/2,py+cs-3);
      if(S.showFx>0&&g.showDone){cx.font=Math.round(cs*.7)+'px serif';cx.fillText('🎆',px+cs/2,py-2+Math.sin(beat*6)*3)}}}
  for(const b of S.book){if(b.day!==S.day)continue;const px=b.tx*cs,py=HDR+b.ty*cs;cx.strokeStyle='#22e6ff';cx.lineWidth=2;cx.strokeRect(px+2,py+2,cs-4,cs-4);cx.lineWidth=1}
  const gs=Math.max(11,Math.round(cs*.42));cx.textAlign='center';
  for(const g of S.guests){
    const bob=Math.sin(beat*Math.PI*2+g.ph)*(g.mood/30)*cs/30,mx=Math.cos(beat*.5+g.ph)*cs*.12;
    cx.font=gs+'px serif';cx.fillText(g.mood>65?'😄':g.mood>40?'🙂':g.mood>25?'😐':'😠',(g.cx+.5)*cs+mx,HDR+(g.cy+.65)*cs+bob)}
  cx.textAlign='right';cx.font='bold 12px system-ui';
  if(open&&S.night){cx.fillStyle=S.doorClosed?'#ff4d6d':'#ffe14d';cx.fillText(S.doorClosed?'🚪 Einlass gestoppt':'🚪 Schlange: '+Math.round(S.night.queue),W-8,21)}
  else if(S.setup){cx.fillStyle='#ffffffb0';cx.fillText(tool?(tool==='erase'?'Zum Löschen anklicken':'Aufs Raster klicken'):'Club geschlossen',W-8,21)}
  requestAnimationFrame(draw);
}
let painting=false;
function cellAt(e){const r=cv.getBoundingClientRect(),cs=CW/S.gw;
  return[Math.floor((e.clientX-r.left)/r.width*CW/cs),Math.floor(((e.clientY-r.top)/r.height*cv.height-HDR)/cs)]}
cv.addEventListener('pointerdown',e=>{if(S.phase!=='plan'||!tool)return;painting=true;const[x,y]=cellAt(e);editCell(x,y)});
cv.addEventListener('pointermove',e=>{if(!painting||(tool!=='floor'&&tool!=='erase'))return;const[x,y]=cellAt(e);editCell(x,y)});
addEventListener('pointerup',()=>painting=false);

// ---------- Beat ----------
let ac=null,beatTimer=null,step=0;
function startBeat(){
  stopBeat();if(!soundOn)return;
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)()}catch(e){return}
  const ms=60000/GENRES[S.genre].bpm/2;
  beatTimer=setInterval(()=>{
    if(S.phase!=='night')return;
    const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();
    if(step%2===0){o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(40,t+.15);g.gain.setValueAtTime(.5,t);g.gain.exponentialRampToValueAtTime(.001,t+.2)}
    else{o.type='square';o.frequency.value=S.genre==='techno'?880:660;g.gain.setValueAtTime(.05,t);g.gain.exponentialRampToValueAtTime(.001,t+.05)}
    o.connect(g).connect(ac.destination);o.start(t);o.stop(t+.25);step++;
  },ms);
}
function stopBeat(){clearInterval(beatTimer);beatTimer=null}

// ---------- Init ----------
$('bGo').onclick=()=>startNight();$('bSkip').onclick=skipDay;
$('bSound').onclick=()=>{soundOn=!soundOn;$('bSound').textContent=soundOn?'🔊':'🔇';soundOn?startBeat():stopBeat()};
document.querySelectorAll('[data-sp]').forEach(b=>b.onclick=()=>{speed=+b.dataset.sp;if(S.phase==='night')run();renderHeader()});
S=load();if(!Object.keys(S.trend).length)rollTrend();
calcLayout();if(!S.clubs.length)stash();renderAll();
if(!S.setup)openSetup();else{if(!S.inq.length&&!S.book.length)S.inq=genInquiries();log('Willkommen zurück, Manager!')}
requestAnimationFrame(draw);
</script>
