<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Disco Manager</title>
<style>
:root{color-scheme:dark;--bg:#0b0618;--panel:#150c2b;--panel2:#1d1239;--line:#2e1f57;--txt:#efeaff;--dim:#9b8fc4;--pink:#ff2bd6;--cyan:#22e6ff;--yel:#ffe14d;--grn:#3dffa0;--red:#ff4d6d;--gold:#f5c04a}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 600px at 20% -10%,#2a0f55 0%,var(--bg) 60%);background-color:var(--bg);color:var(--txt);font:15px/1.4 system-ui,Segoe UI,Roboto,sans-serif;min-height:100vh}
header{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:10px 16px;background:#0e0820ee;border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
h1{margin:0;font-size:19px;letter-spacing:1px;background:linear-gradient(90deg,var(--pink),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
.stat{display:flex;flex-direction:column;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px}
.stat b{font-size:15px;color:var(--txt);text-transform:none;letter-spacing:0;font-variant-numeric:tabular-nums}
.spacer{flex:1}
main{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px;padding:14px 16px;max-width:1400px;margin:0 auto}
@media(max-width:900px){main{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}
canvas{width:100%;height:auto;border-radius:10px;background:#07040f;display:block}
button,select{font:inherit;color:var(--txt);background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:6px 11px}
button{cursor:pointer}
button:hover:not(:disabled){border-color:var(--cyan)}
button:disabled{opacity:.4;cursor:not-allowed}
button.pri{background:linear-gradient(90deg,var(--pink),#8a3dff);border:0;font-weight:700}
button.on{border-color:var(--grn);color:var(--grn)}
button:focus-visible,select:focus-visible{outline:2px solid var(--cyan);outline-offset:1px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.quick label{font-size:11px;color:var(--dim);display:flex;flex-direction:column;gap:3px;text-transform:uppercase;letter-spacing:.4px}
.quick select{width:100%;text-transform:none;letter-spacing:0;font-size:14px}
#hint{font-size:12px;color:var(--dim);margin-top:6px;min-height:1.4em}
.bars{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:10px}
.bar{background:#0a0616;border-radius:8px;padding:6px 8px;font-size:12px;color:var(--dim)}
.bar i{display:block;height:6px;border-radius:4px;background:#2a1d4d;margin-top:4px;overflow:hidden}
.bar i u{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--pink))}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tabs button.act{background:var(--pink);border-color:var(--pink);font-weight:700}
.item{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.item>div:first-child{min-width:0;flex:1 1 170px}
.item:last-child{border:0}
.item small{color:var(--dim);display:block}
.dim{color:var(--dim)}
.note{background:#0a0616;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:0 0 10px;font-size:13px;color:var(--dim)}
#news{margin-top:8px;font-size:13px;color:var(--yel)}
#log{height:120px;overflow:auto;font-size:13px;color:var(--dim);margin-top:10px}
#log div{padding:2px 0;border-bottom:1px dashed #241846}
.good{color:var(--grn)}.bad{color:var(--red)}.warn{color:var(--yel)}.gold{color:var(--gold)}
#modal{position:fixed;inset:0;background:#000b;display:none;align-items:flex-start;justify-content:center;z-index:10;padding:16px;overflow:auto}
#modal .box{background:var(--panel);border:1px solid var(--pink);border-radius:16px;padding:18px;max-width:520px;width:100%;box-shadow:0 0 40px #ff2bd655;margin:auto}
#modal h2{margin:0 0 10px}
table{width:100%;border-collapse:collapse}td{padding:4px 0;vertical-align:top}td:last-child{text-align:right}
.chip{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:20px;padding:1px 8px;color:var(--dim)}
.meter{height:7px;border-radius:4px;background:#2a1d4d;margin:5px 0;overflow:hidden}.meter u{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--pink))}
.meter.full u{background:linear-gradient(90deg,var(--gold),var(--red))}
.day{border:1px solid var(--line);border-radius:12px;padding:9px 10px;margin-bottom:8px;background:#100824}
.day.today{border-color:var(--cyan)}
.day.closed{opacity:.6}
.day.ev{border-color:var(--gold)}
.day h4{margin:0;font-size:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.wk{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.wk button{min-width:46px;padding:6px 8px}
.pips{letter-spacing:2px;color:var(--gold)}
.mod{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.mod .ic{font-size:24px;width:34px;text-align:center}
.mod>div:nth-child(2){flex:1;min-width:0}
.mod small{color:var(--dim);display:block}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.opts button{text-align:left}
.sels{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px;margin:8px 0}
.sels label{font-size:11px;color:var(--dim);display:flex;flex-direction:column;gap:2px;min-width:0}
.sels select{width:100%}
.iq{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px;background:#100824}
.iq.whale{border-color:var(--gold);box-shadow:0 0 14px #f5c04a33}
.iq h4{margin:0 0 2px;font-size:15px}
.scroll{max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:2px 10px}
</style>
</head>
<body>

    <button id="bFast" title="Nacht sofort auswerten">⏭ Überspringen</button>
    <button class="pri" id="bGo">🌙 Nacht starten</button>

</header>
<main>

    <div class="card">
      <canvas id="cv" width="720" height="420"></canvas>

      <div id="news"></div>
      <div class="bars" id="bars"></div>
      <div id="log"></div>
    </div>
  </section>
  <section class="card">
    <div class="tabs" id="tabs"></div>
    <div id="panel"></div>
  </section>
</main>
<div id="modal"><div class="box" id="mbox"></div></div>

<script>

const CONC=[
  {id:'keller',n:'Kellerbar',e:'🕯️',cap:70,rent:100,price:0,ex:82,vipMax:2,entry:10,drink:6,col:'#ff9a3d',floor:'#3a2a1a',wall:'#2a1a10',mix:{students:.2,party:.3,szene:.35,business:.1,society:.05},d:'Gemütlich und klein. Die Szene liebt es.'},
  {id:'neon',n:'Neon-Disco',e:'🌈',cap:150,rent:300,price:9000,ex:55,vipMax:4,entry:10,drink:6,col:'#ff2bd6',floor:'#2a0f3a',wall:'#1a0a2a',mix:{students:.25,party:.5,szene:.15,business:.05,society:.05},d:'Bunte Lichter, Pop und Party.'},
  {id:'lounge',n:'Lounge & Bar',e:'🍷',cap:100,rent:350,price:12000,ex:78,vipMax:5,entry:15,drink:10,col:'#d4a35a',floor:'#2a1f14',wall:'#1a1410',mix:{business:.45,society:.25,szene:.15,party:.1,students:.05},d:'Samtsofas, Cocktails, Anzugpublikum.'},
  {id:'techno',n:'Techno-Bunker',e:'⛓️',cap:300,rent:500,price:30000,ex:45,vipMax:4,entry:14,drink:6.5,col:'#8a3dff',floor:'#14141c',wall:'#0c0c12',mix:{szene:.6,party:.15,students:.15,business:.05,society:.05},d:'Beton, Nebel, Bass bis morgens.'},
  {id:'beach',n:'Beach Club',e:'🌴',cap:400,rent:700,price:60000,ex:50,vipMax:8,entry:12,drink:8,col:'#22e6ff',floor:'#2a2a1a',wall:'#102a30',season:1,mix:{party:.4,szene:.2,business:.15,society:.15,students:.1},d:'Im Sommer der Wahnsinn, im Winter leer.'},
  {id:'palace',n:'Gold Palace',e:'👑',cap:200,rent:1200,price:120000,ex:90,vipMax:10,entry:30,drink:18,col:'#f5c04a',floor:'#2a2210',wall:'#241a08',mix:{society:.5,business:.35,szene:.1,party:.05,students:0},d:'Marmor, Gold, Stars und Sternchen.'},
  {id:'super',n:'Superclub',e:'🎆',cap:900,rent:2500,price:300000,ex:25,vipMax:14,entry:12,drink:6,col:'#3dffa0',floor:'#101a24',wall:'#0a1018',mix:{party:.35,szene:.25,students:.15,business:.15,society:.1},d:'Hallen, Lasershow, Tausende Gäste.'}];
const conc=()=>CONC.find(c=>c.id===S.conc);
// Ausbau (je 0 bis 4 Stufen)
const MODS={
  sound:{n:'Sound',e:'🔊',base:900,d:'Besserer Klang, bessere Stimmung'},
  light:{n:'Licht',e:'💡',base:720,d:'Lichtshow und Stimmung'},

  {n:'Influencer-Crew',size:[3,6],mult:1.4,minH:12},{n:'Fußballprofis',size:[4,7],mult:1.6,minH:22},{n:'Erbengruppe',size:[4,6],mult:2,minH:32},
  {n:'Tech-Milliardär',size:[3,5],mult:12,minH:45,minEx:45,whale:1},{n:'Scheich-Delegation',size:[6,10],mult:25,minH:58,minEx:55,whale:1},
  {n:'Hollywood-Star mit Entourage',size:[5,8],mult:40,minH:68,minEx:65,whale:1}];
const ETYPE={
  party:{n:'Themenparty',c:300,m:1.2,b:8,d:'Motto, Deko, Kostüme.'},
  ladies:{n:'Ladies Night',c:200,m:1.25,b:6,d:'Kommt besonders am Wochenende gut an.'},
  label:{n:'Label-Night',c:600,m:1.35,b:12,d:'Ein Label bringt sein Line-up mit.'},
  concert:{n:'Live-Konzert',c:1200,m:1.5,b:15,d:'Am besten mit einem Act.'},
  anniv:{n:'Jubiläumsparty',c:1500,m:1.6,b:20,minH:20,d:'Der große Auftritt des Clubs.'},
  closed:{n:'Private Gästelistenparty',c:500,m:.7,b:10,money:1.4,exb:12,d:'Nur mit Einladung. Weniger Gäste, mehr Geld.'}};
const ACTS=[
  {id:'a1',n:'Lokal-DJ',fee:150,draw:1,h:0,g:null},{id:'a2',n:'Gast-DJ aus Berlin',fee:500,draw:1.4,h:8,g:'techno'},
  {id:'a3',n:'House-DJ aus Ibiza',fee:900,draw:1.7,h:14,g:'house'},{id:'a4',n:'Rapper (Live)',fee:1800,draw:2.2,h:22,g:'hiphop'},
  {id:'a5',n:'Schlagerstar',fee:2200,draw:2.1,h:20,g:'schlager'},{id:'a6',n:'Pop-Sängerin',fee:3500,draw:2.6,h:30,g:'pop'},
  {id:'a7',n:'Headliner-DJ',fee:7000,draw:3.2,h:42,g:'techno'},{id:'a8',n:'Superstar-Act',fee:20000,draw:4,h:60,g:'pop'}];
const PROMO=[
  {id:'flyer',n:'Flyer & Plakate',e:'📄',c:200,buzz:8,hype:.5,list:10,fit:{students:1.4,party:1.2,szene:.9,business:.3,society:.1}},
  {id:'social',n:'Social-Media-Ads',e:'📱',c:600,buzz:14,hype:1.2,list:25,fit:{students:1.3,party:1.3,szene:1.2,business:.8,society:.4}},
  {id:'influ',n:'Influencer-Posts',e:'🤳',c:2000,buzz:28,hype:3,list:30,fit:{students:1.1,party:1.3,szene:1.5,business:.7,society:1}},
  {id:'press',n:'Presse & Radio',e:'📰',c:4000,buzz:36,hype:4.5,list:20,fit:{students:.4,party:.8,szene:1,business:1.4,society:1.5}}];
const RIV=[{n:'Club Nox',ex:60,h:34},{n:'Velvet Lounge',ex:85,h:28},{n:'Warehouse 9',ex:35,h:40},{n:'Campus Keller',ex:25,h:30},{n:'Palais Royal',ex:75,h:22}];
const NEWS=[{n:'',arr:1},{n:'',arr:1},{n:'',arr:1},{n:'🌧️ Regenwetter: weniger Leute unterwegs.',arr:.85},{n:'🏁 Konkurrenz-Party um die Ecke.',arr:.8},
  {n:'🎪 Stadtfest! Die Stadt ist voll.',arr:1.25},{n:'🎉 Feiertag morgen: Alle wollen feiern.',arr:1.2},{n:'🎓 Semesterstart: Viele junge Gäste.',arr:1.3}];
const FN=['Lena','Max','Sophie','Jonas','Mia','Luca','Emma','Felix','Hannah','Paul','Lara','Noah','Anna','Leon','Nina','Tim','Clara','Ben','Julia','Elias','Marie','Finn','Laura','David','Sarah','Moritz','Lisa','Tom','Amelie','Jan'];

const WD=['Do','Fr','Sa','So','Mo','Di','Mi'],WDF=[.8,1.35,1.6,.7,.45,.5,.6],WDL=['Donnerstag','Freitag','Samstag','Sonntag','Montag','Dienstag','Mittwoch'];
const wd=d=>WD[(d-1)%7],wdF=d=>WDF[(d-1)%7];
const hourStr=t=>{const m=(22*60+t*10)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};

let S, speed=1, timer=null, soundOn=false, tab='cal', FAST=false, V=[], vid=1, UI={}, ef={type:'party',day:null,series:false};

// ---------- Zustand ----------
function newMember(seg,loy){
  const s=seg||pick(GA);
  return{id:S.mid++,name:pick(FN)+' '+String.fromCharCode(65+ri(0,25))+'.',seg:s,loy:loy==null?rnd(.15,.5):loy,visits:0,tag:Math.random()<.1&&(s==='szene'||s==='party')?'Influencer':'Neu'};

// ---------- Berechnungen ----------
const cap=()=>conc().cap;
const req=()=>Math.max(1,Math.ceil(cap()/250));
const eff=k=>Math.min(1.3,S.lv[k]/req());
const vipTables=()=>Math.min(conc().vipMax,S.lv.vip*2);
const pkgPrice=p=>Math.round(p.p*PM[S.pl].b/10)*10;
const evOn=d=>S.events.find(e=>e.day===d);
const isOpen=d=>!!evOn(d)||(String(d) in S.over?S.over[d]:S.open[(d-1)%7]);
function exclusivity(){const e=evOn(S.day);return clamp(conc().ex+DOORS[S.door].ex+(S.pl-1)*8+S.lv.deco*2+(S.phase==='night'&&e&&ETYPE[e.type].exb?ETYPE[e.type].exb:0),5,100)}
function crowd(){
  const c=conc(),ex=exclusivity(),g=S.genre,w={};let A=0;
  const entry=c.entry*PM[S.pl].e,drink=c.drink*PM[S.pl].d;
  for(const k of GA){const s=SEG[k],rE=entry/s.entry,rD=drink/s.drink;
    const pE=rE<=1?1+(1-rE)*.2:Math.max(.05,1-(rE-1)*.8),pD=rD<=1.2?1:Math.max(.2,1-(rD-1.2)*.6);
    const exF=.35+.65*Math.exp(-Math.pow((ex-s.ex)/38,2));
    w[k]=c.mix[k]*s.arr*GAFF[g][k]*pE*pD*exF;A+=w[k];}
  const mix={};let vip=0;
  for(const k of GA){const m=A>0?w[k]/A:c.mix[k];mix[k]=m;vip+=m*SEG[k].vip}
  return{mix,A,entry,drink,ex,vip};
}
const vipBase=()=>{const c=crowd();return c.vip*(.6+c.ex/100)};
const genreLove=(g,mix)=>GA.reduce((a,k)=>a+mix[k]*GAFF[g][k],0);
function marketM(){
  const ex=exclusivity(),Zc=.35+S.hype/32;let sw=0,sz=0,all=Zc;
  for(const r of S.rivals){const z=(.35+r.h/32)*.85,w=Math.exp(-Math.pow((r.ex-ex)/35,2));sw+=w;sz+=w*z;all+=z}
  return{m:Zc/(Zc+sz)*(1+sw)*1.1,share:Zc/all};
}
function rank(){const all=S.rivals.map(r=>r.h).concat([S.hype]).sort((a,b)=>b-a);return all.indexOf(S.hype)+1}
const seasonF=d=>{const c=conc();return c.season?1+.7*Math.sin(2*Math.PI*(d-14)/56):1};
const streakBefore=d=>{if(d===S.day)return S.streak;let n=0;for(let x=d-1;x>=S.day&&n<6;x--){if(!isOpen(x))n++;else break}return n+(S.streak&&true?0:0)};
const pentF=d=>1+Math.min(.5,.12*streakBefore(d));
const actF=e=>{if(!e||!e.act)return 0;const a=ACTS.find(x=>x.id===e.act);return Math.min(1.6,a.draw*.18*((a.g===null||genreLove(a.g,crowd().mix)>=.9)?1:.6))};
const evMult=e=>e?ETYPE[e.type].m*(1+e.buzz/70)*(1+actF(e)):1;
function wantAt(t,day,CR,mk,e,tr){
  const hourF=Math.exp(-Math.pow((t-20)/14,2))*.9+.1;
  return cap()*.04*mk.m*seasonF(day)*hourF*CR.A*1.7*DOORS[S.door].arr*evMult(e)*(day===S.day&&S.news?S.news.arr:1)*tr*(S.lv.dj?1:.9)*wdF(day)*pentF(day);
}
// Gästeliste
const hash=(id,d)=>((id*9301+d*49297)%233280)/233280;
function rsvpP(m,d){const e=evOn(d);return clamp((.12+m.loy*.5)*(.7+S.hype/100)*clamp(wdF(d)/1.2,.4,1.3)*(1+(e?e.buzz/80:0)),.02,.9)}
const coming=d=>S.list.filter(m=>hash(m.id,d)<rsvpP(m,d));
const listExpect=d=>S.list.reduce((a,m)=>a+rsvpP(m,d),0);
function forecast(d){
  if(!isOpen(d))return null;
  const e=evOn(d),CR=crowd(),mk=marketM(),c=cap();let tot=0;
  for(let t=0;t<40;t++)tot+=wantAt(t,d,CR,mk,e,1);
  const lst=listExpect(d);
  const guests=Math.min(Math.min(tot,c*2.2)+Math.min(lst,c),c*2.4);
  const fill=guests/(c*1.7);
  const label=fill<.3?['ruhig','dim']:fill<.6?['gut besucht','good']:fill<.9?['voll','warn']:['ausverkauft, Schlange','gold'];
  return{guests:Math.round(guests),fill,list:Math.round(lst),label,book:S.book.filter(b=>b.day===d).length};
}
const wages=()=>MK.reduce((a,k)=>{const w=MODS[k].wage;if(!w)return a;return a+(Array.isArray(w)?w[S.lv[k]]:w*S.lv[k])},0);

// ---------- Kalender ----------
function toggleDay(d){
  if(evOn(d)||d<S.day||(d===S.day&&S.phase==='night'))return;
  S.over[d]=!isOpen(d);save();renderAll();
}
function toggleWeek(i){S.open[i]=!S.open[i];for(const d in S.over){if((d-1)%7===i)delete S.over[d]}save();renderAll()}
function closeDayOnly(){ // Tag ohne Nacht
  S.money-=conc().rent;S.streak++;S.day++;newDay();
}
function skipToOpen(){
  if(S.phase!=='plan')return;
  let g=0;
  if(!isOpen(S.day)){
    while(!isOpen(S.day)&&g++<14)closeDayOnly();
    if(!isOpen(S.day)){log('Es ist kein Öffnungstag geplant. Öffne im Kalender mindestens einen Tag.','warn');}
    else log('Nächster Öffnungstag: '+WDL[(S.day-1)%7]+'.','good');
  }
  save();renderAll();
}

// ---------- Tagwechsel ----------
function newDay(){
  rollTrend();S.news=pick(NEWS);
  S.hype=clamp(S.hype*.96,0,100);S.events.forEach(e=>e.buzz*=.97);
  for(const r of S.rivals){r.h+=(r.t-r.h)*.08+rnd(-1.8,1.8);r.t=clamp(r.t+rnd(-.3,.45)+(rank()===1?.4:0),15,80);
    if(Math.random()<.05){r.h+=ri(6,14);log('🏙️ '+r.n+' feiert eine große Party und wird beliebter.','warn')}r.h=clamp(r.h,3,95)}
  S.inq=S.inq.filter(i=>i.day>=S.day);
  genInquiries();
  if(S.news.n)log(S.news.n,'warn');
  const e=evOn(S.day);if(e)log('Heute Abend: '+e.name+'!','gold');
}
function genInquiries(){
  if(!vipTables())return;
  const base=vipBase(),ex=exclusivity();
  for(let d=S.day;d<S.day+7;d++){
    if(!isOpen(d))continue;
    const have=S.inq.filter(i=>i.day===d).length+S.book.filter(b=>b.day===d).length;
    if(have>=3)continue;
    const e=evOn(d),buzz=e?e.buzz:0;
    if(Math.random()>clamp(.25+S.hype/70+buzz/120,.1,.95))continue;
    const pool=IQT.filter(t=>(t.minH||0)<=S.hype+8&&(t.minEx||0)<=ex&&(!t.whale||S.lv.host>0));
    const wh=pool.filter(t=>t.whale),nm=pool.filter(t=>!t.whale);
    const ty=(wh.length&&Math.random()<.2)?pick(wh):pick(nm),size=ri(ty.size[0],ty.size[1]);
    S.inq.push({id:S.iqId++,day:d,whale:!!ty.whale,name:ty.n+' '+pick(NAMES),size,genre:pick(Object.keys(GENRES)),budget:Math.max(300,Math.round(base*ty.mult*rnd(.8,1.8)*size/6*(1+buzz/60)/50)*50)});
  }
}

// ---------- Events ----------
function planEvent(){
  if(S.phase!=='plan'&&+(ef.day||S.day)<=S.day)return;
  const ty=ETYPE[ef.type],day=+(ef.day||S.day);
  if(ty.minH&&S.hype<ty.minH){log(ty.n+' erst ab Hype '+ty.minH+'.','warn');return}
  if(S.money<ty.c){log('Zu wenig Geld für das Event.','bad');return}
  if(evOn(day)){log('An dem Tag ist schon ein Event.','warn');return}
  S.money-=ty.c;delete S.over[day];
  S.events.push({id:S.evId++,type:ef.type,name:ty.n,day,act:null,buzz:ty.b,series:ef.series,lvl:0});
  S.events.sort((a,b)=>a.day-b.day);ef.day=null;
  log(ty.n+' geplant: '+WDL[(day-1)%7]+', Tag '+day+'.','good');save();renderAll();
}
function cancelEvent(id){
  const e=evOn0(id);if(!e)return;
  if(e.act)S.money+=Math.round(ACTS.find(a=>a.id===e.act).fee*.5);
  S.events=S.events.filter(x=>x.id!==id);S.hype=Math.max(0,S.hype-(e.buzz>30?1:0));
  log('Event abgesagt.','warn');save();renderAll();
}
const evOn0=id=>S.events.find(e=>e.id===id);
function bookAct(eid){
  const e=evOn0(eid);if(!e)return;
  const aid=UI['act'+eid]||ACTS[0].id,a=ACTS.find(x=>x.id===aid);
  if(S.hype<a.h){log(a.n+' spielt erst ab Hype '+a.h+'.','warn');return}
  const old=e.act?ACTS.find(x=>x.id===e.act):null,cost=a.fee-(old?Math.round(old.fee*.5):0);
  if(S.money<cost){log('Zu wenig Geld für die Gage.','bad');return}
  S.money-=cost;e.act=aid;e.buzz=clamp(e.buzz+a.draw*4,0,100);
  log(a.n+' gebucht für '+e.name+'.','good');save();renderAll();
}
function promo(pid,target){
  const p=PROMO.find(x=>x.id===pid);if(S.money<p.c)return;
  const CR=crowd(),fit=GA.reduce((a,k)=>a+CR.mix[k]*p.fit[k],0);

  if(target==='club'){S.hype=clamp(S.hype+p.hype*fit*(1-S.hype/110),0,100);log(p.n+': Der Club ist in aller Munde.','good')}
  else{const e=evOn0(+target);if(e){e.buzz=clamp(e.buzz+p.buzz*fit*(1-e.buzz/110),0,100);log(p.n+' für „'+e.name+'“: der Buzz wächst.','good')}}
  const n=Math.round(p.list*fit);for(let i=0;i<n;i++)if(S.list.length<400)S.list.push(newMember(null,.1));
  save();renderAll();
}

function cancelBook(id){

function makeReq(g){

  const opts=PKGS.filter(p=>pkgPrice(p)<=head&&S.lv.host>=p.host);if(!opts.length)return null;

}
function reqAct(id,mode){
  closeModal();
  const r=S.reqs.find(x=>x.id===id);if(!r){resume();return}
  S.reqs=S.reqs.filter(x=>x.id!==id);
  const g=S.groups.find(x=>x.id===r.gid),p=PKGS.find(x=>x.id===r.pid);if(!g){resume();return}

  const price=Math.round(r.list*(mode==='disc'?.85:mode==='up'?1.2:1)),base=mode==='disc'?.97:mode==='up'?.55:.88;
  const prob=clamp(base*(.55+g.mood/120),.05,.97);

function askReq(r){

   <div class="opts"><button class="pri" onclick="reqAct(${r.id},'list')">Zum Listenpreis ${eur(r.list)}</button><button onclick="reqAct(${r.id},'disc')">Rabatt −15 % · ${eur(r.list*.85)}</button><button onclick="reqAct(${r.id},'up')">Aufpreis +20 % · ${eur(r.list*1.2)}</button><button onclick="reqAct(${r.id},'no')">Ablehnen</button></div>`);

function resume(){if(S.phase==='night'&&!FAST)run()}

// ---------- Nacht ----------
function startNight(){
  if(S.phase!=='plan'||!isOpen(S.day))return;
  const e=evOn(S.day);
  S.phase='night';S.t=0;S.guests=[];S.fights=0;S.bonus=0;S.boost=0;S.mess=0;S.showFx=0;S.reqs=[];V=[];
  S.groups=S.book.filter(b=>b.day===S.day).map(b=>Object.assign({},b));S.book=S.book.filter(b=>b.day!==S.day);S.inq=S.inq.filter(i=>i.day!==S.day);
  const cm=coming(S.day).map(m=>({m,at:clamp(Math.round(14+((Math.random()+Math.random()+Math.random())/3-.5)*22),1,34)}));
  S.night={entry:0,drinks:0,coat:0,vip:0,up:0,cost:0,guests:0,moodSum:0,moodN:0,peak:0,listIn:0,newNames:0,wanted:0,turned:0,queue:2,cm,mids:[]};
  tab='cal';log('Der Club ist offen!'+(e?' '+e.name+' läuft.':''),'good');
  if(cm.length)log(cm.length+' Leute von der Gästeliste haben zugesagt.');
  if(!FAST)run();
  renderAll();
}
function run(){clearInterval(timer);timer=setInterval(tick,1000/speed)}
function curGenre(){
  const e=evOn(S.day);
  if(S.phase==='night'&&e&&e.act&&S.t>=14&&S.t<=28){const a=ACTS.find(x=>x.id===e.act);return a.g||S.genre}
  return S.genre;
}
let gid=1;
function newGuest(CR,member){
  const e=evOn(S.day),ty=e?ETYPE[e.type]:null,gs=Object.keys(GENRES);
  let r=Math.random(),seg=GA[GA.length-1];
  if(member)seg=member.seg;else for(const k of GA){r-=CR.mix[k];if(r<=0){seg=k;break}}
  const sg=SEG[seg],w=gs.map(g=>GAFF[g][seg]*S.trend[g]);let q=Math.random()*w.reduce((a,b)=>a+b,0),fav=gs[0];
  for(let i=0;i<gs.length;i++){q-=w[i];if(q<=0){fav=gs[i];break}}
  return{id:gid++,fav,seg,mid:member?member.id:0,mood:member?62:55,thirst:rnd(0,40),spent:0,money:rnd(sg.money[0],sg.money[1])*DOORS[S.door].money*(ty&&ty.money?ty.money:1)*(member?1.15:1),ph:rnd(0,6)};
}
const seatedG=()=>S.groups.filter(g=>g.state==='seated');
function tick(){
  if(S.phase!=='night')return;
  const CR=crowd(),D=DOORS[S.door],e=evOn(S.day),N=S.night,c=cap(),G=S.guests,gen=curGenre(),ex=CR.ex;
  const E={};for(const k of MK)E[k]=eff(k);
  if(e&&e.act&&S.t===14){const a=ACTS.find(x=>x.id===e.act);log('🎤 '+a.n+' betritt die Bühne!','gold')}
  if(Math.random()<.025){
    const r=Math.random();
    if(r<.3){S.boost=4;S.bonus+=1;log('⭐ Ein Promi ist im Club! Alle wollen rein.','good')}
    else if(r<.55){if(S.lv.sec<2){S.money-=150;N.cost+=150;log('🚔 Polizeikontrolle: zu wenig Security, 150 € Strafe.','bad')}else log('🚔 Polizeikontrolle: alles sauber.','good')}
    else if(r<.8){G.forEach(g=>g.mood-=10);log('⚡ Stromausfall! Die Stimmung leidet.','bad')}
    else{S.mess+=20;log('🍾 Jemand hat Getränke verschüttet.','warn')}
  }
  // VIP-Gruppen
  const hostF=()=>{const o=seatedG().length;return o?clamp(S.lv.host*3/o,0,1):1};
  let asked=false;
  for(const g of S.groups){
    if(g.state==='wait'&&S.t>=g.arrive){g.state='seated';log('👑 '+g.name+' ('+g.size+' Pers.) nimmt am VIP-Tisch Platz.','gold')}
    if(g.state==='seated'){
      const tg=55+(g.genre===gen?18:0)+E.sound*10+(S.lv.host?hostF()*14:6)+E.lounge*5+S.lv.deco*1.5-S.mess*.3-(G.length/c>.9?8:0);
      g.mood+=(tg-g.mood)*.25;g.sum+=g.mood;g.n++;
      if(!g.showDone&&S.t>=g.showAt){g.showDone=true;const p=PKGS.find(x=>x.id===g.pid);
        if(p.fx){G.forEach(x=>{x.mood+=8;x.thirst=Math.min(100,x.thirst+25)});S.bonus+=p.fx;S.showFx=3;log('🍾🎆 Show am Tisch von '+g.name+'! Der ganze Club feiert.','gold')}}
      if(S.lv.host>0&&!asked&&S.t<36&&g.mood>55&&!S.reqs.some(r=>r.gid===g.id)&&Math.random()<.1*hostF()){
        const r=makeReq(g);
        if(r){if(FAST||S.autoVip)reqAct(r.id,'list');else{asked=true;askReq(r)}}
      }
      if(S.t>=40){g.state='left';log(g.name+' verlässt den VIP-Tisch.')}
    }
  }
  // Walk-in VIPs
  if(S.t>=6&&S.t<=30&&vipTables()>0){
    const used=S.groups.length;
    if(used<vipTables()&&Math.random()<.04*(1+S.hype/50)*(.4+Math.min(1,CR.A))*(SEG.society.vip>0?1:1)){
      const p=PKGS[0],g={id:'w'+S.t+used,walk:true,name:'Spontane Gäste',size:ri(3,6),genre:pick(Object.keys(GENRES)),pid:'t1',qty:1,price:pkgPrice(p),bud:pkgPrice(p)*2.5,up:0,cost:p.c,dep:0,arrive:S.t,showAt:99,state:'seated',mood:60,sum:0,n:0,showDone:false};
      S.groups.push(g);log('👑 Spontane Gäste mieten einen VIP-Tisch.','gold');
    }
  }
  // Ankunft
  const hourF=1;const mk=marketM(),boost=S.boost>0?2:1;if(S.boost>0)S.boost--;
  const want=wantAt(S.t,S.day,CR,mk,e,.6+.4*S.trend[gen])*boost*rnd(.8,1.2);
  const door=Math.floor(6+S.lv.sec*6+c/30),people=G.length+seatedG().reduce((a,g)=>a+g.size,0);
  const w0=Math.round(want),arrive=Math.max(0,Math.min(w0,door,c-people));
  N.wanted+=w0;N.turned+=Math.max(0,w0-arrive);N.queue=N.queue*.7+Math.max(0,w0-arrive)+(w0>0?.4:0);
  for(let i=0;i<arrive;i++){const g=newGuest(CR);G.push(g);vspawn(g);N.guests++;N.entry+=CR.entry;S.money+=CR.entry;
    if(S.lv.coat){const cc=1+S.lv.coat;N.coat+=cc;S.money+=cc}}
  vturn(Math.min(3,Math.max(0,w0-arrive)));
  let la=0;
  for(const x of N.cm){if(x.at===S.t&&people+arrive+la<c){const g=newGuest(CR,x.m);G.push(g);vspawn(g,true);N.guests++;N.listIn++;la++;N.mids.push(x.m.id);const p=CR.entry*.5;N.entry+=p;S.money+=p;
    if(S.lv.coat){const cc=1+S.lv.coat;N.coat+=cc;S.money+=cc}}}
  N.peak=Math.max(N.peak,G.length);
  // Stimmung
  const act=(e&&e.act&&S.t>=14&&S.t<=28)?6:0;
  S.mess=clamp(S.mess+G.length*.05*(80/c+.4)-(S.lv.clean*6+1),0,100);
  const dens=G.length/c;let fights=0;
  for(const g of G){
    const sg=SEG[g.seg],dr=CR.drink/sg.drink,r=CR.entry/sg.entry;
    let tg=50+(g.fav===gen?18:-5)+E.sound*12+E.light*8+E.floor*8+E.lounge*6+S.lv.deco*1.5+S.lv.dj*3+(S.lv.coat?2:0)+D.mood+(Math.exp(-Math.pow((ex-sg.ex)/38,2))-.6)*10+act+(g.mid?4:0);
    if(dens>.85)tg-=(dens-.85)*80*(1+ex/100);
    if(dr>1.4)tg-=(dr-1.4)*10;if(r>1.5)tg-=(r-1.5)*6;
    tg-=S.mess*.2;if(g.thirst>70)tg-=(g.thirst-70)*.3;
    g.mood+=(tg-g.mood)*.25;g.thirst=Math.min(100,g.thirst+rnd(3,8));
    if(g.mood<30&&fights<1&&Math.random()<.015){
      if(Math.random()>Math.min(.9,S.lv.sec*.22*Math.min(2,150/c+.3))){fights++;S.fights++}else log('🛡️ Security hat eine Schlägerei im Keim erstickt.','good')
    }
  }
  if(fights){G.forEach(g=>{if(Math.random()<.15)g.mood-=12});S.hype=clamp(S.hype-.5,0,100);log('👊 Schlägerei! Hype sinkt.','bad')}
  // Bar
  let slots=Math.round(6*S.lv.bar*(1+c/120));const dcost=1.2+ex/70;
  for(const g of G.filter(x=>x.thirst>=40).sort((a,b)=>b.thirst-a.thirst)){
    if(slots<=0)break;
    const p=CR.drink,bw=clamp(1.6-p/SEG[g.seg].drink*.6,.1,1);
    if(g.money>=p&&Math.random()<bw){g.money-=p;g.spent+=p;g.thirst=rnd(0,15);S.money+=p-dcost;N.drinks+=p-dcost;slots--}else if(g.money<p)g.thirst=0;else g.thirst=Math.max(0,g.thirst-10);
  }
  // Gehen
  const lateF=Math.max(0,S.t-30)*.01;
  S.guests=G.filter(g=>{N.moodSum+=g.mood;N.moodN++;
    if(g.mood>70&&!g.signed&&!g.mid&&Math.random()<.02){g.signed=1;N.newNames++}
    const go=(g.mood<20&&Math.random()<.35)||Math.random()<.03+lateF;
    if(go)vleave(g.id);return !go});
  if(S.showFx>0)S.showFx--;
  S.t++;
  if(S.t>=TICKS)endNight();
  else if(!FAST){renderHeader();renderBars();if(tab==='cal'||tab==='vip')renderPanel()}
}
function fastNight(){
  if(S.phase!=='night')return;
  clearInterval(timer);FAST=true;
  try{let g=0;while(S.phase==='night'&&g++<100)tick()}finally{FAST=false}
}

function endNight(){
  clearInterval(timer);
  const N=S.night,e=evOn(S.day),avg=N.moodN?N.moodSum/N.moodN:50,wg=wages(),rent=conc().rent;
  let vipLines='',vH=0;
  for(const g of S.groups){
    if(g.state==='wait')g.state='seated';
    const sat=(g.n?g.sum/g.n:50)+(g.showDone?8:0),f=sat<45?.5:1,tip=sat>78?1.1:1;
    const total=Math.round(g.price*(g.walk?rnd(.8,1.4):1)*f*tip),pay=total-g.dep;
    S.money+=pay;N.vip+=total;N.cost+=g.cost;
    if(sat<45)vH-=1;else if(sat>78)vH+=.5;
    vipLines+=`<tr><td>${g.name}${g.up?' (+'+eur(g.up)+' extra)':''}</td><td>${sat<45?'<span class="bad">unzufrieden</span>':sat>78?'<span class="good">begeistert</span>':'zufrieden'} · ${eur(total)}</td></tr>`;
  }
  S.money-=N.cost+wg+rent;
  const vipNet=N.vip+N.up-N.cost,profit=N.entry+N.drinks+N.coat+vipNet-wg-rent;
  const fill=N.peak/cap(),qIdx=N.turned/cap();
  let dH=(avg-58)/8*clamp(fill/.5,.3,1.2)+S.bonus*.4-S.fights*.5+vH+(DOORS[S.door].ex>=8?.1:0);
  let qLine='',evLine='',seriesLine='';
  if(fill>=.8&&qIdx>.15){
    if(avg>=65){const q=Math.min(2.5,qIdx*3);dH+=q;qLine=`<tr><td>🚪 Schlange vor der Tür (${N.turned} abgewiesen)</td><td class="good">+${q.toFixed(1)} Hype</td></tr>`}
    else if(avg<55){const q=Math.min(1.5,qIdx*2);dH-=q;qLine=`<tr><td>Wartende sind enttäuscht</td><td class="bad">−${q.toFixed(1)} Hype</td></tr>`}
  }
  if(e){
    const a=e.act?ACTS.find(x=>x.id===e.act).draw:0,eb=(e.buzz/25+a*.5)*(avg>=60?1:-.5);dH+=eb;
    evLine=`<tr><td>Event „${e.name}“</td><td>${eb>=0?'<span class="good">+':'<span class="bad">'}${eb.toFixed(1)} Hype</span></td></tr>`;
  }
  S.hype=clamp(S.hype+dH,0,100);
  // Gästeliste pflegen
  for(const id of N.mids){const m=S.list.find(x=>x.id===id);if(m){m.visits++;m.loy=clamp(m.loy+(avg>=60?.06:-.05),0,1);if(m.visits>=3&&m.tag==='Neu')m.tag='Stammgast'}}
  for(let i=0;i<N.newNames+Math.round(N.guests*.03*(avg>=65?1:.3));i++)if(S.list.length<400)S.list.push(newMember(null,.2));
  if(avg<45)S.list.forEach(m=>m.loy=Math.max(0,m.loy-.03));
  S.total+=profit;S.history.unshift({day:S.day,guests:N.guests,profit:Math.round(profit),mood:Math.round(avg)});S.history=S.history.slice(0,20);
  if(e){
    S.events=S.events.filter(x=>x.id!==e.id);
    if(e.series){const ty=ETYPE[e.type],nd=e.day+7;
      if(S.money>=ty.c&&!evOn(nd)){S.money-=ty.c;S.events.push({id:S.evId++,type:e.type,name:e.name,day:nd,act:null,buzz:clamp(ty.b+(e.lvl+1)*6+e.buzz*.4,0,100),series:true,lvl:e.lvl+1});S.events.sort((a,b)=>a.day-b.day);
        seriesLine=`<p class="gold">🔁 „${e.name}“ geht in die nächste Runde: ${wd(nd)}, Tag ${nd}. Stammpublikum Stufe ${e.lvl+1}.</p>`}}
  }
  const sday=S.day;S.phase='plan';S.guests=[];S.groups=[];S.reqs=[];V=[];S.streak=0;S.day++;newDay();
  const win=!S.won&&S.money>=GOAL_MONEY&&S.hype>=GOAL_HYPE;if(win)S.won=true;
  const broke=S.money<-3000;
  save();renderAll();
  showModal(`<h2>${WDL[(sday-1)%7]}: Abrechnung</h2><table>
   <tr><td>Gäste (davon von der Gästeliste)</td><td>${N.guests} (${N.listIn})</td></tr><tr><td>Ø Stimmung</td><td>${Math.round(avg)} % ${'★'.repeat(clamp(Math.round(avg/20),1,5))}</td></tr>
   <tr><td>Eintritt</td><td class="good">${eur(N.entry)}</td></tr><tr><td>Getränke (Gewinn)</td><td class="good">${eur(N.drinks)}</td></tr>
   <tr><td>Garderobe</td><td class="good">${eur(N.coat)}</td></tr><tr><td>VIP & Flaschen (Gewinn)</td><td class="good">${eur(vipNet)}</td></tr>
   <tr><td>Miete & Team</td><td class="bad">-${eur(wg+rent)}</td></tr>
   <tr><td><b>Ergebnis</b></td><td><b class="${profit>=0?'good':'bad'}">${eur(profit)}</b></td></tr>
   <tr><td>Hype heute Nacht</td><td>${dH>=0?'+':''}${dH.toFixed(1)}</td></tr>${qLine}${evLine}</table>
   ${seriesLine}${vipLines?'<p><b>VIP-Tische</b></p><table>'+vipLines+'</table>':''}
   ${win?'<p class="good"><b>🏆 Du bist die Nummer 1 der Stadt und Millionär!</b></p>':''}${broke?'<p class="bad"><b>💸 Insolvenz!</b></p>':''}
   <p><button class="pri" onclick="${broke?'resetGame()':'closeModal()'}">${broke?'Neu anfangen':'Weiter'}</button></p>`);
}

  }
  if(tab==='list'){
    const nd=(()=>{let d=S.day;for(let i=0;i<14;i++,d++)if(isOpen(d))return d;return S.day})(),cm=coming(nd),ids=new Set(cm.map(m=>m.id));
    h+=`<div class="note">Die Gästeliste sind deine Stammgäste und Interessenten. Zufriedene Gäste tragen sich ein. Je öfter sie kommen und je besser die Party, desto treuer werden sie. Werbung bringt neue Namen. Ihre Zusagen siehst du hier.</div>`;
    h+=`<div class="row" style="margin-bottom:8px"><b>${S.list.length} Namen</b><span class="dim">· Zusagen für ${WDL[(nd-1)%7]} (Tag ${nd}): <b class="good">${cm.length}</b></span></div>`;
    const sorted=S.list.slice().sort((a,b)=>b.loy-a.loy);
    h+='<div class="scroll"><table>'+sorted.slice(0,120).map(m=>`<tr><td>${ids.has(m.id)?'<span class="good">✔</span>':'<span class="dim">·</span>'} ${m.name} <span class="chip">${m.tag}</span> <span class="chip">${SEG[m.seg].n}</span></td><td>${m.visits}× da · Treue ${Math.round(m.loy*100)} %</td></tr>`).join('')+'</table>'+(sorted.length>120?`<div class="dim" style="padding:6px">… und ${sorted.length-120} weitere</div>`:'')+'</div>';
  }
  if(tab==='stats'){
    const rows=S.rivals.map(r=>({n:r.n,h:r.h})).concat([{n:'Dein Club',h:S.hype,me:1}]).sort((a,b)=>b.h-a.h);
    h+=`<div class="note">Ziel: ${eur(GOAL_MONEY)} auf dem Konto und Hype ${GOAL_HYPE}. Der Hype zeigt, wie angesagt dein Club gerade ist. Er sinkt täglich um 4 %.</div><b>Stadt-Ranking</b><table>`;
    h+=rows.map((r,i)=>`<tr><td>${i+1}. ${r.me?'<b class="gold">'+r.n+'</b>':r.n}</td><td>🔥 ${Math.round(r.h)}</td></tr>`).join('')+'</table><br><b>Letzte Nächte</b><table>';
    h+=S.history.length?S.history.map(x=>`<tr><td>Tag ${x.day} (${wd(x.day)}) · ${x.guests} Gäste · ${x.mood} %</td><td class="${x.profit>=0?'good':'bad'}">${eur(x.profit)}</td></tr>`).join(''):'<tr><td>Noch keine Nacht gespielt.</td></tr>';
    h+=`</table><p><button onclick="askReset()">Neues Spiel</button></p>`;
  }
  $('panel').innerHTML=h;
}
function renderAll(){renderHeader();renderBars();renderTabs();renderPanel()}

// ---------- Szene (alles automatisch platziert) ----------
const cv=$('cv'),cx=cv.getContext('2d');
const X0=170,X1=706,Y0=34,Y1=404,DOORY=240;
function layout(){
  const L=S.lv,n=vipTables(),fw=130+L.floor*55,fh=90+L.floor*28;
  const fx=(X0+X1)/2-fw/2-20,fy=130;
  const vipCols=n>8?3:2,rows=Math.ceil(n/vipCols),sp=Math.min(52,300/Math.max(1,rows));
  const tables=[];for(let i=0;i<n;i++)tables.push({x:X1-26-(i%vipCols)*50,y:112+Math.floor(i/vipCols)*sp});
  const sofas=[];for(let i=0;i<2+L.lounge*2;i++)sofas.push({x:X0+60+i*46,y:Y1-26});
  return{floor:{x:fx,y:fy,w:fw,h:fh},bar:{x:X0+6,y:110,w:20,h:50+L.bar*55},tables,sofas};
}
function spot(){
  const l=layout(),r=Math.random();
  if(r<.62)return{x:l.floor.x+rnd(10,l.floor.w-10),y:l.floor.y+rnd(10,l.floor.h-10)};
  if(r<.78)return{x:l.bar.x+rnd(34,64),y:l.bar.y+rnd(10,l.bar.h-6)};
  if(r<.9)return{x:rnd(X0+50,X0+60+(2+S.lv.lounge*2)*46),y:Y1-rnd(52,72)};
  return{x:rnd(X0+80,X1-120),y:rnd(100,340)};
}
const OUTF=['🧍','🧍‍♀️','🧍‍♂️'];
function vspawn(g,listed){const s=spot();V.push({id:g.id,x:118,y:DOORY+rnd(-6,6),tx:s.x,ty:s.y,st:'in',e:listed?'🌟':'🙂',g,ph:rnd(0,6)})}
function vleave(id){const v=V.find(x=>x.id===id);if(v){v.st='out';v.tx=40;v.ty=DOORY+rnd(40,110)}}
function vturn(n){for(let i=0;i<n;i++)V.push({id:'t'+(vid++),x:112,y:DOORY+rnd(-6,6),tx:20,ty:DOORY+rnd(70,130),st:'turn',e:'😤',ph:0})}
let lastTs=0;
function draw(ts){
  const dt=Math.min(.05,(ts-lastTs)/1000||0);lastTs=ts;
  const c=conc(),open=S.phase==='night',gen=curGenre(),col=GENRES[gen].c,beat=ts/(60000/GENRES[gen].bpm),l=layout();
  cx.fillStyle='#07040f';cx.fillRect(0,0,CW,CH_);
  // Straße
  cx.fillStyle='#0d0a18';cx.fillRect(0,0,150,CH_);cx.fillStyle='#161226';cx.fillRect(0,DOORY-30,150,64);
  cx.fillStyle='#9b8fc4';cx.font='11px system-ui';cx.textAlign='left';cx.fillText('Straße',8,16);
  // Club
  cx.fillStyle=c.wall;cx.fillRect(150,0,CW-150,CH_);cx.fillStyle=c.floor;cx.fillRect(X0-10,Y0,X1-X0+14,Y1-Y0+6);
  cx.strokeStyle=c.col;cx.lineWidth=2;cx.strokeRect(X0-10,Y0,X1-X0+14,Y1-Y0+6);cx.lineWidth=1;
  cx.fillStyle='#fff';cx.font='bold 12px system-ui';cx.fillText(c.e+' '+c.n+' · '+GENRES[gen].n,X0,22);
  const ev=evOn(S.day);if(ev){cx.textAlign='right';cx.fillStyle='#f5c04a';cx.fillText('🎉 '+ev.name,CW-10,22);cx.textAlign='left'}
  // Lichtstrahlen
  if(open&&S.lv.light){for(let i=0;i<S.lv.light*2+1;i++){const x=X0+60+i*(X1-X0-120)/(S.lv.light*2),a=Math.sin(beat+i)*.5+.5;
    cx.globalAlpha=.08+.12*a;cx.fillStyle=i%2?'#ff2bd6':col;cx.beginPath();cx.moveTo(x,Y0);cx.lineTo(x-40,Y0+260);cx.lineTo(x+40,Y0+260);cx.fill();cx.globalAlpha=1}}
  // Bühne / DJ
  const sx=(X0+X1)/2-60;cx.fillStyle='#241040';cx.fillRect(sx,Y0+8,120,50);cx.strokeStyle=col;cx.strokeRect(sx,Y0+8,120,50);
  cx.font='28px serif';cx.textAlign='center';cx.fillText(S.lv.dj?'🎧':'💻',sx+60,Y0+44);
  cx.font='10px system-ui';cx.fillStyle='#9b8fc4';cx.fillText(DJN[S.lv.dj],sx+60,Y0+70);
  // Lautsprecher
  const pump=open?Math.abs(Math.sin(beat*Math.PI))*5:0;
  for(let i=0;i<1+S.lv.sound;i++){const x=i%2?X1-12-Math.floor(i/2)*30:X0+4+Math.floor(i/2)*30;cx.font=Math.round(22+pump)+'px serif';cx.fillText('🔊',x+8,Y0+34)}
  // Tanzfläche
  const f=l.floor,ts_=26;
  for(let y=0;y<f.h;y+=ts_)for(let x=0;x<f.w;x+=ts_){const v=open?(Math.sin(beat*Math.PI*2/(1+((x+y)/ts_|0)%4)+x*.05+y*.07)+1)/2:.25;
    cx.globalAlpha=.12+v*(.22+S.lv.light*.08);cx.fillStyle=(((x+y)/ts_+Math.floor(beat))%3<1&&open)?'#ff2bd6':col;cx.fillRect(f.x+x+1,f.y+y+1,Math.min(ts_,f.w-x)-2,Math.min(ts_,f.h-y)-2);cx.globalAlpha=1}
  // Bar
  cx.fillStyle='#3b1f12';cx.fillRect(l.bar.x,l.bar.y,l.bar.w,l.bar.h);cx.font='16px serif';for(let y=l.bar.y+4;y<l.bar.y+l.bar.h-10;y+=36)cx.fillText('🍸',l.bar.x+10,y+14);
  // VIP
  l.tables.forEach((t,i)=>{cx.fillStyle='#3a2a0c';cx.beginPath();cx.arc(t.x,t.y,17,0,7);cx.fill();cx.strokeStyle='#f5c04a';cx.stroke();cx.font='16px serif';cx.fillStyle='#fff';cx.fillText('👑',t.x,t.y+6)});
  const gs=S.groups.filter(g=>g.state==='seated');
  gs.forEach((g,i)=>{const t=l.tables[i];if(!t)return;cx.fillStyle=g.whale?'#ffd70099':'#f5c04a66';cx.beginPath();cx.arc(t.x,t.y,19,0,7);cx.fill();cx.fillStyle='#fff';cx.font='bold 11px system-ui';cx.fillText('🥂'+g.size,t.x,t.y+30);
    if(S.showFx>0&&g.showDone){cx.font='24px serif';cx.fillText('🎆',t.x-16,t.y-20+Math.sin(beat*6)*3)}});
  S.book.filter(b=>b.day===S.day).forEach((b,i)=>{});
  // Sofas, Garderobe, Deko
  cx.font='24px serif';cx.fillStyle='#fff';l.sofas.forEach(s=>cx.fillText('🛋️',s.x,s.y+10));
  if(S.lv.coat)cx.fillText('🧥',X0+16,Y1-20);cx.fillText('🚻',X1-18,Y1-14);
  const deco=['🪴','✨','🪩','🪴','✨','🪩','🪴','✨'];for(let i=0;i<S.lv.deco*2;i++){cx.font='20px serif';cx.fillText(deco[i],X0+90+i*58,Y1-60+((i%2)*-8))}
  cx.fillText(c.id==='beach'?'🌴':c.id==='palace'?'🏛️':c.id==='techno'?'⛓️':'',X0+30,Y0+46);
  // Tür & Türsteher
  cx.fillStyle='#2a1d4d';cx.fillRect(138,DOORY-26,16,56);cx.font='22px serif';cx.fillText('🚪',146,DOORY+6);
  cx.font='20px serif';cx.fillText('🛡️',130,DOORY-34);if(S.lv.sec>1)cx.fillText('🛡️',130,DOORY+44);
  // Warteschlange
  const q=open&&S.night?Math.round(S.night.queue):(isOpen(S.day)&&S.phase==='plan'?0:0);
  const shown=Math.min(14,q);cx.font='20px serif';
  for(let i=0;i<shown;i++){const px=104-(i%2)*18-Math.min(i,6)*8,py=DOORY+10+i*13-(i%2)*6-i*2;cx.fillText(OUTF[i%3],px,py)}
  if(q>14){cx.font='bold 11px system-ui';cx.fillStyle='#ffe14d';cx.fillText('+'+(q-14)+' warten',60,CH_-14)}
  if(open&&S.night){cx.font='bold 11px system-ui';cx.fillStyle=q>=8?'#ffe14d':'#9b8fc4';cx.textAlign='left';cx.fillText(q>=8?'🚪 Schlange vor der Tür':'🚪 Eingang',10,DOORY-44)}
  // Gäste (animiert)
  const sp=140*(open?speed:1);
  for(const v of V){
    const dx=v.tx-v.x,dy=v.ty-v.y,d=Math.hypot(dx,dy);
    if(d>2){const st=Math.min(d,sp*dt*(v.st==='in'?1:.9));v.x+=dx/d*st;v.y+=dy/d*st}
    else if(v.st==='in'){v.st='stay'}
    if(v.st==='in'){const m=v.g;}
    let e=v.e;if(v.st==='stay'&&v.g){const m=v.g.mood;e=v.g.mid?(m>50?'🌟':'😐'):(m>65?'😄':m>40?'🙂':m>25?'😐':'😠')}
    const bob=v.st==='stay'?Math.sin(beat*Math.PI*2+v.ph)*(v.g?v.g.mood/30:1)*2:0;
    cx.font='16px serif';cx.fillText(e,v.x,v.y+bob);
    if(v.st==='turn')cx.fillText('🚫',v.x+10,v.y-8);
  }
  V=V.filter(v=>!((v.st==='out'||v.st==='turn')&&Math.hypot(v.tx-v.x,v.ty-v.y)<3));
  if(!open){cx.fillStyle='#ffffffb0';cx.font='bold 13px system-ui';cx.textAlign='center';cx.fillText(isOpen(S.day)?'Bereit für die Nacht':'Heute geschlossen',(X0+X1)/2,CH_-8)}
  cx.textAlign='left';
  requestAnimationFrame(draw);
}

// ---------- Beat ----------
let ac=null,beatTimer=null,step=0;
function startBeat(){
  stopBeat();if(!soundOn)return;
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)()}catch(e){return}
  const ms=60000/GENRES[S.genre].bpm/2;
  beatTimer=setInterval(()=>{
    if(S.phase!=='night')return;
    const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();
    if(step%2===0){o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(40,t+.15);g.gain.setValueAtTime(.5,t);g.gain.exponentialRampToValueAtTime(.001,t+.2)}
    else{o.type='square';o.frequency.value=S.genre==='techno'?880:660;g.gain.setValueAtTime(.05,t);g.gain.exponentialRampToValueAtTime(.001,t+.05)}
    o.connect(g).connect(ac.destination);o.start(t);o.stop(t+.25);step++;
  },ms);
}
function stopBeat(){clearInterval(beatTimer);beatTimer=null}

// ---------- Start ----------
$('qGenre').innerHTML=Object.entries(GENRES).map(([k,g])=>`<option value="${k}">${g.n}</option>`).join('');
$('qPrice').innerHTML=PM.map((p,i)=>`<option value="${i}">${p.n}</option>`).join('');
$('qDoor').innerHTML=DOORS.map((d,i)=>`<option value="${i}">${d.n}</option>`).join('');
$('qGenre').onchange=e=>setQuick('genre',e.target.value);$('qPrice').onchange=e=>setQuick('price',e.target.value);$('qDoor').onchange=e=>setQuick('door',e.target.value);
$('bGo').onclick=()=>{if(isOpen(S.day))startNight();else skipToOpen()};
$('bFast').onclick=fastNight;
$('bSound').onclick=()=>{soundOn=!soundOn;$('bSound').textContent=soundOn?'🔊':'🔇';soundOn?startBeat():stopBeat()};
document.querySelectorAll('[data-sp]').forEach(b=>b.onclick=()=>{speed=+b.dataset.sp;if(S.phase==='night'&&$('modal').style.display!=='flex')run();renderHeader()});
S=load();
if(!S){initState();save()}
else if(!Object.keys(S.trend).length)rollTrend();
renderAll();
requestAnimationFrame(draw);
</script>
